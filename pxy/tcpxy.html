<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;

    /* 🔴 GLOBAL THEME (MEDIUM DARK GRAY) */
    background: #3b3b3b;
    color: #eaeaea;
}

/* =========================
   MAIN CONTAINER
========================= */
#container {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================
   TERMINAL
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100vh;

    background: #3b3b3b;   /* SAME */
    border-right: 1px solid #4a4a4a;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: 5px;
    cursor: col-resize;

    background: #4a4a4a;   /* slightly lighter */
}

/* =========================
   RIGHT PANEL
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;

    background: #3b3b3b;   /* SAME */
}

/* toolbar hidden already */
#toolbar {
    display: none;
}

#chartWrap {
    flex: 1;
    background: #3b3b3b;   /* ensure chart bg match */
}

canvas {
    width: 100% !important;
    height: 100% !important;
    background: #3b3b3b;   /* FIX chart base */
}

/* =========================
   FULLSCREEN MODES
========================= */
.fullscreen-terminal #terminal {
    width: 100% !important;
}

.fullscreen-terminal #right {
    display: none;
}

.fullscreen-chart #terminal {
    display: none;
}

.fullscreen-chart #right {
    width: 100% !important;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {

    #right {
        display: none !important;
    }

    #divider {
        display: none !important;
    }

    #terminal {
        width: 100% !important;
        height: 100vh !important;
        border-right: none;
    }

    #container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="container">

    <div id="terminal"></div>

    <div id="divider"></div>

    <div id="right">

        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea",
        selection: "rgba(255,255,255,0.1)"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   CHART
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
}

function draw(closes, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];
    const trendPad = [...stTrend, ...Array(pad).fill("UP")];

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,
            datasets: [

                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#000000",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25
                },

                {
                    label: "ST",
                    data: stPad,
                    showLine: false,
                    pointRadius: 2,
                    pointBorderWidth: 2,
                    pointBackgroundColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    ),
                    pointBorderColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    )
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: {
                    ticks: { color: "#eaeaea" },
                    grid: { display: false }
                },
                y: {
                    position: "right",
                    ticks: { color: "#eaeaea" },
                    grid: { display: false }
                }
            }
        }
    });
}

load();
setInterval(load, 3000);

</script>

</body>
</html>
