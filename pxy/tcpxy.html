<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
}

/* =========================
   TOP CANDLE STRIP (NEW)
========================= */
#bannerWrap {
    position: relative;
    width: 100%;
    height: 42px;
    overflow: hidden;
    border-bottom: 1px solid #e5e5e5;
    background: #ffffff;
}

/* candle canvas ONLY inside banner */
#bgChart {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 42px;
    opacity: 0.25;
    z-index: 0;
    pointer-events: none;
}

/* banner text on top */
#banner {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    line-height: 42px;
    color: #111;
}

/* =========================
   MAIN CONTAINER
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

/* =========================
   TERMINAL
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100%;
    background: #f7f7f7;
    border-right: 1px solid #e0e0e0;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: 5px;
    cursor: col-resize;
    background: #e6e6e6;
}

/* =========================
   RIGHT PANEL
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fafafa;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {
    #right { display: none !important; }
    #divider { display: none !important; }
    #terminal { width: 100% !important; height: 100vh !important; border-right: none; }
    #container { flex-direction: column; }
}
</style>
</head>

<body>

<!-- =========================
     TOP BANNER + CANDLE STRIP
========================= -->
<div id="bannerWrap">
    <canvas id="bgChart"></canvas>
    <div id="banner">
        🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦
    </div>
</div>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#f7f7f7",
        foreground: "#111111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", () => isDragging = true);

window.addEventListener("mouseup", () => {
    isDragging = false;
    localStorage.setItem("split", terminal.style.width);
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    const percent = (e.clientX / window.innerWidth) * 100;
    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   PRICE CHART (UNCHANGED)
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
}

function draw(closes, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];
    const trendPad = [...stTrend, ...Array(pad).fill("UP")];

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,
            datasets: [

                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#b8860b",
                    borderWidth: 1,
                    pointRadius: 0,
                    tension: 0.25
                },

                {
                    label: "ST",
                    data: stPad,
                    showLine: false,
                    pointRadius: 6,
                    pointStyle: 'rectRot',
                    pointRotation: 90,

                    pointBackgroundColor: trendPad.map(t =>
                        t === "UP" ? "#4DB6AC" : "#FF8A65"
                    ),

                    pointBorderColor: trendPad.map(t =>
                        t === "UP" ? "#4DB6AC" : "#FF8A65"
                    ),

                    pointBorderWidth: 1
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: "#333" }, grid: { display: false } },
                y: { position: "right", ticks: { color: "#333" }, grid: { display: false } }
            }
        }
    });
}

/* =========================
   CANDLE STRIP FOR BANNER
========================= */
let bgChart;

async function loadBG() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const labels = data.map((_, i) => i);
    const lows = data.map(d => d.low);
    const highs = data.map(d => d.high);
    const opens = data.map(d => d.st);
    const closes = data.map(d => d.close);

    drawBG(labels, lows, highs, opens, closes);
}

function drawBG(labels, lows, highs, opens, closes) {

    const ctx = document.getElementById("bgChart");

    if (bgChart) bgChart.destroy();

    bgChart = new Chart(ctx, {
        type: "bar",
        data: {
            labels,
            datasets: [

                {
                    data: highs.map((h, i) => h - lows[i]),
                    backgroundColor: "#999",
                    barThickness: 1,
                    grouped: false
                },

                {
                    data: closes.map((c, i) => Math.abs(c - opens[i])),
                    backgroundColor: closes.map((c, i) =>
                        c >= opens[i] ? "#4DB6AC" : "#FF8A65"
                    ),
                    barThickness: 3,
                    grouped: false
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { display: false }
            }
        }
    });
}

/* =========================
   INIT
========================= */
load();
loadBG();
setInterval(load, 3000);
setInterval(loadBG, 5000);

</script>

</body>
</html>
