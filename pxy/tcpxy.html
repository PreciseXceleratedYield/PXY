<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PXY DASHBOARD</title>
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        :root { --divider-width: 6px; }
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: monospace; background: #f5f5f5; color: #111; }
        #topHeader { position: fixed; top: 0; width: 100%; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; z-index: 1000; background: #616161; }
        #headerLeft { position: absolute; left: 10px; font-size: 14px; }
        #headerCenter { position: absolute; left: 50%; transform: translateX(-50%); font-size: 14px; }
        #headerRight { position: absolute; right: 10px; display: flex; gap: 12px; }
        #container { display: flex; height: calc(100vh - 44px); padding-top: 26px; }
        #terminal { width: 33%; min-width: 200px; border-right: 1px solid #ddd; background: #f5f5f5; }
        #divider { width: var(--divider-width); cursor: col-resize; background: #f5f5f5; }
        #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chartWrap { flex: 1; position: relative; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        #topCandleWrap { position: fixed; bottom: 0; width: 100%; height: 18px; background: #f5f5f5; border-top: 1px solid #ddd; }
        #topCandle { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="topHeader">
        <div id="headerLeft">PXY®</div>
        <div id="headerCenter">PreciseXceleratedYield Pvt Ltd</div>
        <div id="headerRight">LIVE</div>
    </div>
    <div id="container">
        <div id="terminal"></div>
        <div id="divider"></div>
        <div id="right">
            <div id="chartWrap"><canvas id="priceChart"></canvas></div>
        </div>
    </div>
    <div id="topCandleWrap"><canvas id="topCandle"></canvas></div>

    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script>
        const term = new Terminal({ convertEol: true, scrollback: 1000, fontFamily: "monospace", fontSize: 14, theme: { background: "#f5f5f5", foreground: "#111" } });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        term.writeln("PXY System Online...");

        setTimeout(() => fitAddon.fit(), 200);

        let chart;
        async function load() {
            try {
                const res = await fetch("./syschrtpxy.json");
                if (!res.ok) return;
                const data = await res.json();
                if (!data.length) return;
                
                const closes = data.map(d => d.close);
                const st = data.map(d => d.st);
                
                updateMainChart(closes, st);
                drawHorizontalCandle(st, closes);
            } catch (err) { 
                console.error("Update Error:", err); 
            }
        }

        function updateMainChart(closes, st) {
            const MAX = 40;
            const c = closes.slice(-MAX);
            const s = st.slice(-MAX);
            const labels = c.map((_, i) => i);

            const last = c[c.length-1], prev = c[c.length-2];
            const header = document.getElementById("topHeader");
            header.style.background = last > prev ? "linear-gradient(270deg,#1b5e20,#2e7d32,#1b5e20)" : 
                                     last < prev ? "linear-gradient(270deg,#7f0000,#b71c1c,#7f0000)" : "#616161";

            if (!chart) {
                chart = new Chart(document.getElementById("priceChart"), {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            { data: c, borderColor: "rgba(0,0,0,0.3)", borderWidth: 2, pointRadius: 0 },
                            { data: s, borderColor: "#000", borderWidth: 1, pointRadius: 0 }
                        ]
                    },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
                });
            } else {
                chart.data.labels = labels;
                chart.data.datasets[0].data = c; // FIXED INDEXING
                chart.data.datasets[1].data = s; // FIXED INDEXING
                chart.update('none');
            }
        }

        function drawHorizontalCandle(stVals, closes) {
            const canvas = document.getElementById("topCandle");
            const ctx = canvas.getContext("2d");
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const curPrice = closes[closes.length - 1];
            const curST = stVals[stVals.length - 1];
            const last40 = closes.slice(-40);
            const hh40 = Math.max(...last40);
            const ll40 = Math.min(...last40);

            let open, high, low, close, color;

            if (curPrice >= curST) {
                open = curST; low = curST; close = curPrice; high = hh40; color = "#1b5e20";
            } else {
                open = curST; high = curST; close = curPrice; low = ll40; color = "#b71c1c";
            }

            const min = Math.min(low, curST, curPrice);
            const max = Math.max(high, curST, curPrice);
            const range = max - min || 1;
            const scale = v => ((v - min) / range) * canvas.width;
            const midY = canvas.height / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(scale(low), midY); 
            ctx.lineTo(scale(high), midY);
            ctx.stroke();

            ctx.fillStyle = color;
            const x = Math.min(scale(open), scale(close));
            const w = Math.max(Math.abs(scale(close) - scale(open)), 2);
            ctx.fillRect(x, midY - 6, w, 12);
        }

        const divider = document.getElementById("divider");
        const terminal = document.getElementById("terminal");
        let isDragging = false;
        divider.onmousedown = () => isDragging = true;
        window.onmouseup = () => isDragging = false;
        window.onmousemove = e => {
            if (!isDragging) return;
            const p = (e.clientX / window.innerWidth) * 100;
            if (p > 10 && p < 80) {
                terminal.style.width = p + "%";
                fitAddon.fit();
            }
        };

        const ws = new WebSocket(`ws://${location.host}`);
        ws.onmessage = e => term.write(e.data);

        load();
        setInterval(load, 3000);
    </script>
</body>
</html>
