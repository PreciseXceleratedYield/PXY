<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

/* GLOBAL */
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* SCROLLBAR */
* {
    scrollbar-width: thin;
    scrollbar-color: #3b3b3b #3b3b3b;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #3b3b3b; }
::-webkit-scrollbar-thumb { background: #3b3b3b; }

/* HEADER */
#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 900;
    color: #000;

    background: linear-gradient(270deg,#ff1744,#00c853,#ff1744);
    background-size: 300% 300%;
    animation: flow 10s ease infinite;

    z-index: 1000;
}

@keyframes flow {
    0% { background-position: 0% }
    50% { background-position: 100% }
    100% { background-position: 0% }
}

/* HEADER TEXT */
#headerCenter {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
}

.brandMain {
    font-size: 14px;
    letter-spacing: 1px;
}

.brandSub {
    font-size: 10px;
    opacity: 0.7;
}

/* RIGHT SIDE */
#headerRight {
    position: absolute;
    right: 10px;
    display: flex;
    gap: 12px;
}

.liveBox { display: flex; gap: 4px; }

#statusDot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1 }
    50% { opacity: 0.3 }
}

/* MENU */
#menu { position: relative; cursor: pointer; }

#dropdown {
    position: absolute;
    top: 22px;
    right: 0;
    background: #2b2b2b;
    border: 1px solid #444;
    display: none;
}

#dropdown div { padding: 6px 10px; cursor: pointer; }
#dropdown div:hover { background: #3b3b3b; }

#menu.active #dropdown { display: block; }

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 35%;
    min-width: 200px;
    border-right: 1px solid #4a4a4a;
}

#divider {
    width: var(--divider-width);
    cursor: col-resize;
    background: #3b3b3b;
}

#right { flex: 1; display: flex; flex-direction: column; }
#chartWrap { flex: 1; }

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* BOTTOM STRIP */
#topCandleWrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 18px;
    background: #3b3b3b;
    border-top: 1px solid #4a4a4a;
}
</style>
</head>

<body>

<!-- HEADER -->
<div id="topHeader">

    <div id="headerCenter">
        <span class="brandMain">PXY®</span>
        <span class="brandSub">PreciseXceleratedYield Pvt Ltd</span>
    </div>

    <div id="headerRight">
        <span class="liveBox">
            <span id="statusDot"></span>
            <span>LIVE</span>
        </span>

        <div id="menu">
            ☰
            <div id="dropdown">
                <div>CSV 1</div>
                <div>CSV 2</div>
                <div>CSV 3</div>
            </div>
        </div>
    </div>

</div>

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* TERMINAL (UNCHANGED) */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
setTimeout(()=>fitAddon.fit(),50);
window.addEventListener("resize",()=>fitAddon.fit());

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = e => term.write(e.data);

/* MENU */
const menu = document.getElementById("menu");
menu.onclick = e => {
    e.stopPropagation();
    menu.classList.toggle("active");
};
window.onclick = () => menu.classList.remove("active");

/* DIVIDER DRAG */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", () => isDragging = true);
window.addEventListener("mouseup", () => isDragging = false);

window.addEventListener("mousemove", e => {
    if (!isDragging) return;

    const percent = (e.clientX / window.innerWidth) * 100;
    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";
});

/* CHART */
let chart;

async function load(){
    const res=await fetch("./syschrtpxy.json");
    const data=await res.json();

    const closes=data.map(d=>d.close);
    const st=data.map(d=>d.st);
    const trend=data.map(d=>d.st_trend);

    draw(closes,st,trend);
    drawTopCandle(st,closes);
}

function draw(closes,st,trend){

    const MAX=40;

    const c=closes.slice(-MAX);
    const s=st.slice(-MAX);
    const t=trend.slice(-MAX);

    const pad=5;

    const labels=[...c.map((_,i)=>i),...Array(pad).fill("")];
    const closePad=[...c,...Array(pad).fill(null)];
    const stPad=[...s,...Array(pad).fill(null)];

    const dir=t.at(-1)==="UP"?1:-1;

    document.getElementById("topHeader").style.background =
        dir===1
        ? "linear-gradient(270deg,#00c853,#00e676,#00c853)"
        : "linear-gradient(270deg,#ff1744,#ff5252,#ff1744)";

    if(!chart){
        chart=new Chart(document.getElementById("priceChart"),{
            type:"line",
            data:{
                labels,
                datasets:[
                    {
                        data:closePad,
                        borderColor:"rgba(255,255,255,0.25)",
                        borderWidth:2,
                        pointRadius:0
                    },
                    {
                        data:stPad,
                        borderWidth:3,
                        pointRadius:0,
                        segment:{
                            borderColor:i=>t[i.p0DataIndex]==="UP"
                                ?"#00c853":"#ff1744"
                        }
                    }
                ]
            },
            options:{
                animation:false,
                plugins:{legend:{display:false}},
                scales:{
                    x:{display:false},
                    y:{display:false}
                }
            }
        });
    } else {
        chart.data.labels=labels;
        chart.data.datasets[0].data=closePad;
        chart.data.datasets[1].data=stPad;
        chart.update("none");
    }
}

/* BOTTOM STRIP */
function drawTopCandle(stVals, closes){

    const canvas=document.getElementById("topCandle");
    const ctx=canvas.getContext("2d");

    canvas.width=canvas.clientWidth;
    canvas.height=canvas.clientHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const open=stVals.at(-1);
    const close=closes.at(-1);

    const high=Math.max(...stVals,...closes);
    const low=Math.min(...stVals,...closes);

    const scale=v=>((v-low)/(high-low||1))*canvas.width;

    const xLow=scale(low);
    const xHigh=scale(high);
    const xOpen=scale(open);
    const xClose=scale(close);

    const midY=canvas.height/2;

    ctx.strokeStyle="#fff";
    ctx.beginPath();
    ctx.moveTo(xLow,midY);
    ctx.lineTo(xHigh,midY);
    ctx.stroke();

    ctx.fillStyle=close>=open?"#00c853":"#ff1744";

    ctx.fillRect(
        Math.min(xOpen,xClose),
        midY-6,
        Math.max(Math.abs(xClose-xOpen),2),
        12
    );
}

load();
setInterval(load,3000);
</script>

</body>
</html>
