<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
}

/* =========================
   TOP FULL WIDTH CANDLE BANNER
========================= */
#bannerWrap {
    position: relative;
    width: 100%;
    height: 42px;
    border-bottom: 1px solid #e5e5e5;
    background: #ffffff;
    overflow: hidden;
}

#bgCanvas {
    position: absolute;
    width: 100%;
    height: 42px;
    top: 0;
    left: 0;
}

#banner {
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    line-height: 42px;
    color: #111;
}

/* =========================
   MAIN LAYOUT
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

/* TERMINAL */
#terminal {
    width: 35%;
    min-width: 200px;
    background: #f7f7f7;
    border-right: 1px solid #e0e0e0;
}

/* DIVIDER */
#divider {
    width: 5px;
    cursor: col-resize;
    background: #e6e6e6;
}

/* RIGHT */
#right {
    flex: 1;
    background: #fafafa;
}

#chartWrap {
    height: 100%;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* MOBILE */
@media (max-width: 768px) {
    #right { display: none; }
    #divider { display: none; }
    #terminal { width: 100%; height: 100vh; }
}
</style>
</head>

<body>

<!-- =========================
     TOP BANNER CANDLE
========================= -->
<div id="bannerWrap">
    <canvas id="bgCanvas"></canvas>
    <div id="banner">🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦</div>
</div>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#f7f7f7",
        foreground: "#111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG SPLIT
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let dragging = false;

divider.addEventListener("mousedown", () => dragging = true);

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const pct = (e.clientX / window.innerWidth) * 100;
    terminal.style.width = pct + "%";
    right.style.width = (100 - pct) + "%";

    fitAddon.fit();
});

/* =========================
   MAIN CHART (UNCHANGED)
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    drawMain(data);
}

function drawMain(data) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [{
                data: data.map(d => d.close),
                borderColor: "#b8860b",
                borderWidth: 1,
                pointRadius: 0,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
        }
    });
}

/* =========================
   FULL WIDTH BANNER CANDLE
========================= */
async function drawBannerCandle() {

    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    const min = Math.min(...data.map(d => d.low));
    const max = Math.max(...data.map(d => d.high));

    const scaleY = p => canvas.height - ((p - min) / (max - min)) * canvas.height;

    const step = canvas.width / data.length;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    data.forEach((d, i) => {

        const x = i * step;

        const open = d.st;
        const high = d.high;
        const low = d.low;
        const close = d.close;

        // wick
        ctx.strokeStyle = "#999";
        ctx.beginPath();
        ctx.moveTo(x, scaleY(high));
        ctx.lineTo(x, scaleY(low));
        ctx.stroke();

        // body
        ctx.fillStyle = close >= open ? "#4DB6AC" : "#FF8A65";

        const top = Math.min(scaleY(open), scaleY(close));
        const height = Math.abs(scaleY(open) - scaleY(close));

        ctx.fillRect(x - 1, top, 2, height || 1);
    });
}

/* =========================
   INIT
========================= */
load();
drawBannerCandle();

setInterval(load, 3000);
setInterval(drawBannerCandle, 3000);

</script>

</body>
</html>
