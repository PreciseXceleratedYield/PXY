<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

/* GLOBAL */
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* HEADER */
#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;
    background: linear-gradient(90deg, #ff1744, #00c853);
    color: #000;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

/* LOGO */
#logo {
    position: fixed;
    top: 3px;
    right: 10px;
    height: 20px;
    z-index: 2000;
    cursor: pointer;
    opacity: 0.95;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    transition: all 0.2s ease;
}
#logo:hover {
    transform: scale(1.08);
}

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 35%;
    min-width: 200px;
    border-right: 1px solid #4a4a4a;
}

/* INVISIBLE DIVIDER */
#divider {
    width: var(--divider-width);
    min-width: 10px;
    cursor: col-resize;
    background: #3b3b3b;
    opacity: 0;
    transition: opacity 0.15s ease;
}
#divider:hover {
    opacity: 0.15;
}

#right {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* BOTTOM STRIP */
#topCandleWrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 18px;
    background: #3b3b3b;
    border-top: 1px solid #4a4a4a;
}
</style>
</head>

<body>

<div id="topHeader">
    🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦
</div>

<img id="logo" src="./logo.png">

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* TERMINAL (UNCHANGED) */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* DIVIDER DRAG */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", e => {
    isDragging = true;
    e.preventDefault();
});

window.addEventListener("mouseup", () => isDragging = false);

window.addEventListener("mousemove", e => {
    if (!isDragging) return;
    const percent = (e.clientX / window.innerWidth) * 100;
    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";
});

/* LOGO CLICK */
document.getElementById("logo").onclick = () => location.reload();

/* CORE */
let chart, pulse = 0;
let trades = [];
let currentTrade = null;

/* LOAD */
async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const st = data.map(d => d.st);
    const trend = data.map(d => d.st_trend);

    draw(closes, st, trend);
    drawTopCandle(st, closes);
}

/* DRAW */
function draw(closes, st, trend) {

    const ctx = document.getElementById("priceChart");

    const closePad = [...closes, null,null,null];
    const stPad = [...st, null,null,null];
    const trendPad = [...trend, "UP","UP","UP"];

    const last = closePad.at(-4);
    const dir = trendPad.at(-4) === "UP" ? 1 : -1;

    let signal = false;
    if (closePad.at(-5)) {
        const p = closePad.at(-5) - stPad.at(-5);
        const c = closePad.at(-4) - stPad.at(-4);
        signal = p*c < 0;
    }

    if (signal) {
        if (!currentTrade) currentTrade = { entry:last, dir };
        else {
            const pnl = dir===1 ? last-currentTrade.entry : currentTrade.entry-last;
            trades.push(pnl);
            currentTrade = null;
        }
    }

    const winRate = trades.length
        ? trades.filter(t=>t>0).length / trades.length * 100
        : 0;

    /* LOGO COLOR */
    const logo = document.getElementById("logo");
    logo.style.filter = dir===1
        ? "drop-shadow(0 0 6px #00c853)"
        : "drop-shadow(0 0 6px #ff1744)";

    if (signal) {
        logo.style.transform="scale(1.2)";
        setTimeout(()=>logo.style.transform="scale(1)",150);
    }

    if (chart) {
        chart.data.datasets[0].data = closePad;
        chart.data.datasets[1].data = stPad;
        chart.update("none");
        return;
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: closePad.map((_,i)=>i),
            datasets: [

                /* PRICE (DIM) */
                {
                    data: closePad,
                    borderColor: "rgba(255,255,255,0.25)",
                    borderWidth: 2,
                    pointRadius: 0
                },

                /* ST (BOLD) */
                {
                    data: stPad,
                    borderWidth: 3,
                    pointRadius: 0,
                    segment:{
                        borderColor: c =>
                            trendPad[c.p0DataIndex]==="UP"
                                ? "#00c853" : "#ff1744"
                    }
                },

                /* CROSS GLOW (SMALL) */
                {
                    data: closePad.map((v,i)=>{
                        if(i<1) return null;
                        const p = closePad[i-1]-stPad[i-1];
                        const c = v-stPad[i];
                        return (p*c<0)?v:null;
                    }),
                    showLine:false,
                    pointRadius: ctx =>
                        ctx.raw ? 3.5 + Math.sin(pulse)*1.2 : 0,
                    pointBackgroundColor:"#fff",
                    pointBorderWidth:1
                }
            ]
        },
        options:{
            animation:false,
            plugins:{legend:{display:false}}
        },
        plugins:[{
            id:"overlay",
            afterDraw(chart){
                const {ctx, chartArea:{left,top}} = chart;
                ctx.fillStyle="#fff";
                ctx.font="12px monospace";
                ctx.fillText(`WR: ${winRate.toFixed(1)}%`, left+10, top+20);
            }
        }]
    });
}

/* BOTTOM STRIP */
function drawTopCandle(stVals, closes) {

    const canvas = document.getElementById("topCandle");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const open = stVals.at(-1);
    const close = closes.at(-1);

    const high = Math.max(...stVals, ...closes);
    const low = Math.min(...stVals, ...closes);

    const range = high - low || 1;
    const scale = v => ((v - low) / range) * canvas.width;

    const xLow = scale(low);
    const xHigh = scale(high);
    const xOpen = scale(open);
    const xClose = scale(close);

    const midY = canvas.height / 2;

    /* WHITE WICK */
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xLow, midY);
    ctx.lineTo(xHigh, midY);
    ctx.stroke();

    /* BODY */
    ctx.fillStyle = close >= open ? "#00c853" : "#ff1744";

    ctx.fillRect(
        Math.min(xOpen, xClose),
        midY - 6,
        Math.max(Math.abs(xClose - xOpen), 2),
        12
    );
}

/* PULSE */
function animate(){
    pulse += 0.1;
    if(chart) chart.update('none');
    requestAnimationFrame(animate);
}
animate();

/* INIT */
load();
setInterval(load, 3000);
</script>

</body>
</html>
