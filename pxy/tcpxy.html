<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

/* GLOBAL */
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* SCROLLBAR */
* {
    scrollbar-width: thin;
    scrollbar-color: #3b3b3b #3b3b3b;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #3b3b3b; }
::-webkit-scrollbar-thumb { background: #3b3b3b; }

/* XTERM */
.xterm .xterm-viewport::-webkit-scrollbar { width: 4px; }
.xterm .xterm-viewport::-webkit-scrollbar-thumb { background: #3b3b3b; }

/* ================= HEADER PRO ================= */
#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;
    font-size: 12px;
    font-weight: 900;

    color: #000;

    background: linear-gradient(270deg,#ff1744,#00c853,#ff1744);
    background-size: 300% 300%;
    animation: flow 10s ease infinite;

    box-shadow:
        inset 0 -1px 0 rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 2px 6px rgba(0,0,0,0.5);

    z-index: 1000;
}

#headerLeft, #headerRight {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 120px;
}

#headerCenter {
    flex: 1;
    text-align: center;
}

/* STATUS DOT */
#statusDot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
}

@keyframes flow {
    0% { background-position: 0% }
    50% { background-position: 100% }
    100% { background-position: 0% }
}

/* LOGO */
#logo {
    position: fixed;
    top: 3px;
    right: 10px;
    height: 20px;
    z-index: 2000;
    cursor: pointer;
}

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 35%;
    min-width: 200px;
    border-right: 1px solid #4a4a4a;
}

#divider {
    width: var(--divider-width);
    cursor: col-resize;
    background: #3b3b3b;
    opacity: 0;
}
#divider:hover { opacity: 0.15; }

#right { flex: 1; display: flex; flex-direction: column; }
#chartWrap { flex: 1; }

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* BOTTOM STRIP */
#topCandleWrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 18px;
    background: #3b3b3b;
    border-top: 1px solid #4a4a4a;
}
</style>
</head>

<body>

<!-- 🔥 HEADER -->
<div id="topHeader">
    <div id="headerLeft">
        <span id="statusDot"></span>
        <span>LIVE</span>
    </div>

    <div id="headerCenter">
        🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦
    </div>

    <div id="headerRight">
        <span id="metric">WR: --%</span>
    </div>
</div>

<img id="logo" src="./logo.png">

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* TERMINAL (UNCHANGED) */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea",
        selection: "rgba(255,255,255,0.1)"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
setTimeout(()=>fitAddon.fit(),50);
window.addEventListener("resize",()=>fitAddon.fit());

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = e => term.write(e.data);

/* LOGO */
document.getElementById("logo").onclick=()=>location.reload();

/* CORE */
let chart,pulse=0,trades=[],currentTrade=null;

async function load(){
    const res=await fetch("./syschrtpxy.json");
    const data=await res.json();

    const closes=data.map(d=>d.close);
    const st=data.map(d=>d.st);
    const trend=data.map(d=>d.st_trend);

    draw(closes,st,trend);
    drawTopCandle(st,closes);
}

function draw(closes,st,trend){

    const MAX=40;
    const c=closes.slice(-MAX);
    const s=st.slice(-MAX);
    const t=trend.slice(-MAX);

    const closePad=[...c,null,null,null];
    const stPad=[...s,null,null,null];
    const trendPad=[...t,"UP","UP","UP"];

    const last=closePad.at(-4);
    const dir=trendPad.at(-4)==="UP"?1:-1;

    /* HEADER METRIC */
    const metric=document.getElementById("metric");

    if(trades.length){
        const wr = trades.filter(t=>t>0).length / trades.length * 100;
        metric.textContent = `WR: ${wr.toFixed(1)}%`;
    }

    /* HEADER COLOR */
    const header=document.getElementById("topHeader");
    header.style.background = dir===1
        ? "linear-gradient(270deg,#00c853,#00e676,#00c853)"
        : "linear-gradient(270deg,#ff1744,#ff5252,#ff1744)";

    /* SIGNAL DETECT */
    let signal=false;
    if(closePad.at(-5)){
        const p=closePad.at(-5)-stPad.at(-5);
        const c2=closePad.at(-4)-stPad.at(-4);
        signal=p*c2<0;
    }

    if(signal){
        header.style.transform="scale(1.01)";
        setTimeout(()=>header.style.transform="scale(1)",120);
    }

    /* LOGO COLOR */
    const logo=document.getElementById("logo");
    logo.style.filter=dir===1
        ?"drop-shadow(0 0 6px #00c853)"
        :"drop-shadow(0 0 6px #ff1744)";

    if(chart){
        chart.data.labels=closePad.map((_,i)=>i);
        chart.data.datasets[0].data=closePad;
        chart.data.datasets[1].data=stPad;
        chart.update("none");
        return;
    }

    chart=new Chart(document.getElementById("priceChart"),{
        type:"line",
        data:{
            labels:closePad.map((_,i)=>i),
            datasets:[
                {
                    data:closePad,
                    borderColor:"rgba(255,255,255,0.25)",
                    borderWidth:2,
                    pointRadius:0
                },
                {
                    data:stPad,
                    borderWidth:3,
                    pointRadius:0,
                    segment:{
                        borderColor:c=>trendPad[c.p0DataIndex]==="UP"
                            ?"#00c853":"#ff1744"
                    }
                },
                {
                    data:closePad.map((v,i)=>{
                        if(i<1)return null;
                        const p=closePad[i-1]-stPad[i-1];
                        const c2=v-stPad[i];
                        return(p*c2<0)?v:null;
                    }),
                    showLine:false,
                    pointRadius:ctx=>ctx.raw?3.5+Math.sin(pulse)*1.2:0,
                    pointBackgroundColor:"#fff"
                }
            ]
        },
        options:{
            animation:false,
            plugins:{legend:{display:false}},
            scales:{
                x:{grid:{display:false},ticks:{display:false}},
                y:{grid:{display:false},ticks:{display:false},position:"right"}
            }
        }
    });
}

/* BOTTOM STRIP */
function drawTopCandle(stVals,closes){
    const canvas=document.getElementById("topCandle");
    const ctx=canvas.getContext("2d");

    canvas.width=canvas.clientWidth;
    canvas.height=canvas.clientHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const open=stVals.at(-1);
    const close=closes.at(-1);

    const high=Math.max(...stVals,...closes);
    const low=Math.min(...stVals,...closes);

    const scale=v=>((v-low)/(high-low||1))*canvas.width;

    const xLow=scale(low);
    const xHigh=scale(high);
    const xOpen=scale(open);
    const xClose=scale(close);

    const midY=canvas.height/2;

    ctx.strokeStyle="#fff";
    ctx.beginPath();
    ctx.moveTo(xLow,midY);
    ctx.lineTo(xHigh,midY);
    ctx.stroke();

    ctx.fillStyle=close>=open?"#00c853":"#ff1744";

    ctx.fillRect(
        Math.min(xOpen,xClose),
        midY-6,
        Math.max(Math.abs(xClose-xOpen),2),
        12
    );
}

/* PULSE */
function animate(){
    pulse+=0.1;
    if(chart) chart.update('none');
    requestAnimationFrame(animate);
}
animate();

load();
setInterval(load,3000);
</script>

</body>
</html>
