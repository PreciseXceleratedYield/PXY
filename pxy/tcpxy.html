<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PXY DASHBOARD</title>
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        :root { --divider-width: 6px; }
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: monospace; background: #f5f5f5; color: #111; }
        #topHeader { position: fixed; top: 0; width: 100%; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; z-index: 1000; }
        #headerLeft { position: absolute; left: 10px; font-size: 14px; }
        #headerCenter { position: absolute; left: 50%; transform: translateX(-50%); font-size: 14px; }
        #headerRight { position: absolute; right: 10px; display: flex; gap: 12px; }
        .liveBox { display: flex; gap: 4px; }
        #statusDot { width: 6px; height: 6px; border-radius: 50%; background: #00c853; animation: blink 1.2s infinite; }
        @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
        #menu { position: relative; cursor: pointer; }
        #dropdown { position: absolute; top: 22px; right: 0; background: #f5f5f5; border: 1px solid #ddd; display: none; }
        #dropdown div { padding: 6px 10px; cursor: pointer; }
        #dropdown div:hover { background: #eee; }
        #menu.active #dropdown { display: block; }
        #container { display: flex; height: calc(100vh - 18px); padding-top: 26px; }
        #terminal { width: 33%; min-width: 200px; border-right: 1px solid #ddd; }
        #divider { width: var(--divider-width); cursor: col-resize; background: #f5f5f5; }
        #right { flex: 1; display: flex; flex-direction: column; }
        #chartWrap { flex: 1; }
        canvas { width: 100% !important; height: 100% !important; background: #f5f5f5; }
        #topCandleWrap { position: fixed; bottom: 0; width: 100%; height: 18px; background: #f5f5f5; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div id="topHeader">
        <div id="headerLeft">PXY®</div>
        <div id="headerCenter">PreciseXceleratedYield Pvt Ltd</div>
        <div id="headerRight">
            <span class="liveBox"><span id="statusDot"></span><span>LIVE</span></span>
            <div id="menu"> ☰ <div id="dropdown"><div>CSV 1</div><div>CSV 2</div><div>CSV 3</div></div></div>
        </div>
    </div>

    <div id="container">
        <div id="terminal"></div>
        <div id="divider"></div>
        <div id="right"><div id="chartWrap"><canvas id="priceChart"></canvas></div></div>
    </div>

    <div id="topCandleWrap"><canvas id="topCandle"></canvas></div>

    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script>
        const term = new Terminal({ convertEol: true, scrollback: 1000, fontFamily: "monospace", fontSize: 14, theme: { background: "#f5f5f5", foreground: "#111" } });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        setTimeout(()=>fitAddon.fit(), 50);

        const ws = new WebSocket(`ws://${location.host}`);
        ws.onmessage = e => term.write(e.data);

        // Divider Logic
        const divider = document.getElementById("divider");
        const terminalDiv = document.getElementById("terminal");
        let isDragging = false;
        divider.addEventListener("mousedown", () => isDragging = true);
        window.addEventListener("mouseup", () => isDragging = false);
        window.addEventListener("mousemove", e => {
            if (!isDragging) return;
            const p = (e.clientX / window.innerWidth) * 100;
            if (p > 10 && p < 80) { terminalDiv.style.width = p + "%"; fitAddon.fit(); }
        });

        let chart;
        async function load() {
            try {
                const res = await fetch("./syschrtpxy.json");
                const data = await res.json();
                const closes = data.map(d => d.close);
                const st = data.map(d => d.st);
                drawMain(closes, st);
                drawBottomCandle(st, closes);
            } catch(e) { console.error("Update fail:", e); }
        }

        function drawMain(closes, st) {
            const MAX = 40;
            const c = closes.slice(-MAX);
            const s = st.slice(-MAX);
            const labels = c.map((_, i) => i);

            const last = c[c.length-1], prev = c[c.length-2];
            const header = document.getElementById("topHeader");
            header.style.background = last > prev ? "linear-gradient(270deg,#1b5e20,#2e7d32,#1b5e20)" : 
                                     last < prev ? "linear-gradient(270deg,#7f0000,#b71c1c,#7f0000)" : "#616161";

            if (!chart) {
                chart = new Chart(document.getElementById("priceChart"), {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            { data: c, borderColor: "rgba(0,0,0,0.25)", borderWidth: 2, pointRadius: 0 },
                            { data: s, borderColor: "#000", borderWidth: 1, pointRadius: 0 }
                        ]
                    },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
                });
            } else {
                chart.data.labels = labels;
                chart.data.datasets[0].data = c; // Fixed Index
                chart.data.datasets[1].data = s; // Fixed Index
                chart.update("none");
            }
        }

        function drawBottomCandle(stVals, closes) {
            const canvas = document.getElementById("topCandle");
            const ctx = canvas.getContext("2d");
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const curPrice = closes[closes.length - 1];
            const curST = stVals[stVals.length - 1];
            const last40 = closes.slice(-40);

            let open, high, low, close, color;
            if (curPrice >= curST) {
                open = curST; low = curST; close = curPrice; high = Math.max(...last40); color = "#1b5e20";
            } else {
                open = curST; high = curST; close = curPrice; low = Math.min(...last40); color = "#7f0000";
            }

            const min = Math.min(low, open, close), max = Math.max(high, open, close);
            const scale = v => ((v - min) / (max - min || 1)) * canvas.width;
            const midY = canvas.height / 2;

            ctx.strokeStyle = "#000";
            ctx.beginPath();
            ctx.moveTo(scale(low), midY); ctx.lineTo(scale(high), midY);
            ctx.stroke();

            ctx.fillStyle = color;
            const x = Math.min(scale(open), scale(close));
            const w = Math.max(Math.abs(scale(close) - scale(open)), 2);
            ctx.fillRect(x, midY - 6, w, 12);
        }

        load();
        setInterval(load, 3000);
    </script>
</body>
</html>
