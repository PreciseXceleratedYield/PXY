<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #bdbdbd;
}

/* =========================
   TOP FRAME
========================= */
#bannerWrap {
    width: 100%;
    height: 42px;
    position: relative;
    background: #bdbdbd;
    border-bottom: 1px solid #9e9e9e;
    overflow: hidden;
}

#bgChart {
    position: absolute;
    width: 100%;
    height: 42px;
    top: 0;
    left: 0;
    z-index: 0;
    opacity: 0.35;
}

#banner {
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    line-height: 42px;
    color: #111;
}

/* =========================
   MAIN LAYOUT (33 / 66)
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

#terminal {
    width: 28%;
    min-width: 200px;
    height: 100%;
    background: #bdbdbd;
    border-right: 1px solid #9e9e9e;
}

#divider {
    width: 5px;
    cursor: col-resize;
    background: #9e9e9e;
}

#right {
    width: 66%;
    display: flex;
    flex-direction: column;
    background: #bdbdbd;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* =========================
   SCROLLBAR
========================= */
* {
    scrollbar-width: thin;
    scrollbar-color: #9e9e9e #bdbdbd;
}

*::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

*::-webkit-scrollbar-track {
    background: #bdbdbd;
}

*::-webkit-scrollbar-thumb {
    background-color: #9e9e9e;
    border-radius: 10px;
    border: 2px solid #bdbdbd;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {
    #right { display: none !important; }
    #divider { display: none !important; }
    #terminal { width: 100% !important; height: 100vh !important; }
    #container { flex-direction: column; }
}
</style>
</head>

<body>

<!-- TOP -->
<div id="bannerWrap">
    <canvas id="bgChart"></canvas>
    <div id="banner">🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦</div>
</div>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#bdbdbd",
        foreground: "#111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG (still works but default 33/66)
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", () => isDragging = true);
window.addEventListener("mouseup", () => isDragging = false);

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    const percent = (e.clientX / window.innerWidth) * 100;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   MAIN CHART
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();
    draw(data);
}

function draw(data) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [

                {
                    data: data.map(d => d.close),
                    borderColor: "#b8860b",
                    borderWidth: 1,
                    pointRadius: 0,
                    tension: 0.25
                },

                {
                    data: data.map(d => d.st),
                    borderColor: "#00e676",
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.25
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { display: false } }
            }
        }
    });
}

/* =========================
   BANNER CANDLE (FIXED LOGIC)
========================= */
let bgChart;

async function loadBannerCandle() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const latest = data[data.length - 1];

    const close = latest.close;
    const st = latest.st;

    const high = Math.max(...data.map(d => d.high));
    const low = Math.min(...data.map(d => d.low));

    const ctx = document.getElementById("bgChart");

    if (bgChart) bgChart.destroy();

    bgChart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: ["PXY"],
            datasets: [

                {
                    // FULL RANGE WICK
                    data: [high - low],
                    backgroundColor: "#8a6f2a"
                },

                {
                    // LATEST BODY (ST → CLOSE)
                    data: [Math.abs(close - st)],
                    backgroundColor: close >= st ? "#00e676" : "#ff1744"
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },

            scales: {
                x: {
                    display: false,
                    grid: { display: false }
                },
                y: {
                    display: false,
                    grid: { display: false },
                    min: low,
                    max: high
                }
            }
        }
    });
}

/* =========================
   INIT
========================= */
load();
loadBannerCandle();

setInterval(load, 3000);
setInterval(loadBannerCandle, 3000);

</script>

</body>
</html>
