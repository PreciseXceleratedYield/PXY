<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
}

/* =========================
   BLOCK CANDLE BANNER
========================= */
#bannerWrap {
    width: 100%;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    position: relative;
    overflow: hidden;
}

/* ASCII candle strip */
#candleStrip {
    position: absolute;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1px;
    color: #888;
    opacity: 0.9;
    white-space: nowrap;
}

/* banner text above strip */
#banner {
    position: relative;
    z-index: 2;
    font-size: 15px;
    font-weight: bold;
    color: #111;
}

/* =========================
   MAIN CONTAINER
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

/* =========================
   TERMINAL
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100%;
    background: #f7f7f7;
    border-right: 1px solid #e0e0e0;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: 5px;
    cursor: col-resize;
    background: #e6e6e6;
}

/* =========================
   RIGHT PANEL
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fafafa;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {
    #right { display: none !important; }
    #divider { display: none !important; }
    #terminal { width: 100% !important; height: 100vh !important; border-right: none; }
    #container { flex-direction: column; }
}
</style>
</head>

<body>

<!-- =========================
     BLOCK CANDLE BANNER
========================= -->
<div id="bannerWrap">
    <div id="candleStrip"></div>
    <div id="banner">🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦</div>
</div>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#f7f7f7",
        foreground: "#111111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", () => isDragging = true);

window.addEventListener("mouseup", () => {
    isDragging = false;
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    const percent = (e.clientX / window.innerWidth) * 100;
    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   PRICE CHART (UNCHANGED)
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
}

function draw(closes, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: closes.map((_, i) => i),
            datasets: [
                {
                    label: "Close",
                    data: closes,
                    borderColor: "#b8860b",
                    borderWidth: 1,
                    pointRadius: 0,
                    tension: 0.25
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { position: "right" }
            }
        }
    });
}

/* =========================
   BLOCK CANDLE RENDERER
========================= */
async function loadBannerCandles() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const strip = data.slice(-80).map(d => {
        const range = d.high - d.low;
        const body = Math.abs(d.close - d.st);

        // normalize into blocks
        const strength = Math.min(8, Math.max(1, Math.floor(range / 10)));

        let char = "█";
        if (d.close < d.st) char = "▓";
        if (d.close < d.low + range * 0.3) char = "░";

        return char.repeat(strength);
    }).join("");

    document.getElementById("candleStrip").innerText = strip;
}

/* =========================
   INIT
========================= */
load();
loadBannerCandles();

setInterval(load, 3000);
setInterval(loadBannerCandles, 2000);

</script>

</body>
</html>
