<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #bdbdbd;
}

/* =========================
   TOP BAR
========================= */
#bannerWrap {
    width: 100%;
    height: 42px;
    position: relative;
    background: #bdbdbd;
    border-bottom: 1px solid #9e9e9e;
    overflow: hidden;
}

#bgChart {
    position: absolute;
    width: 100%;
    height: 42px;
    top: 0;
    left: 0;
    opacity: 0.35;
}

#banner {
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    line-height: 42px;
}

/* =========================
   LAYOUT 28 / 72
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

#terminal {
    width: 28%;
    background: #bdbdbd;
    border-right: 1px solid #9e9e9e;
}

#divider {
    width: 5px;
    background: #9e9e9e;
    cursor: col-resize;
}

#right {
    width: 72%;
    display: flex;
    flex-direction: column;
    background: #bdbdbd;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<div id="bannerWrap">
    <canvas id="bgChart"></canvas>
    <div id="banner">🏦 PXY DASHBOARD</div>
</div>

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL (RESTORED)
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#bdbdbd",
        foreground: "#111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* WebSocket */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let drag = false;

divider.addEventListener("mousedown", () => drag = true);
window.addEventListener("mouseup", () => drag = false);

window.addEventListener("mousemove", (e) => {
    if (!drag) return;

    const p = (e.clientX / window.innerWidth) * 100;
    terminal.style.width = p + "%";
    right.style.width = (100 - p) + "%";
    fitAddon.fit();
});

/* =========================
   CHART ENGINE (NO FLICKER)
========================= */
let chart;
let minPrice = null;
let maxPrice = null;

/* ST COLOR SEGMENT */
function stColor(ctx) {
    const c = ctx.p1.raw;
    const p = ctx.p0.raw;
    return c >= p ? "#006400" : "#8B0000";
}

/* INIT CHART */
function initChart(data) {

    const ctx = document.getElementById("priceChart");

    const highs = data.map(d => d.high);
    const lows = data.map(d => d.low);

    minPrice = Math.min(...lows);
    maxPrice = Math.max(...highs);

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [

                {
                    data: data.map(d => d.close),
                    borderColor: "#b8860b",
                    borderWidth: 1,
                    pointRadius: 0
                },

                {
                    data: data.map(d => d.st),
                    borderColor: "#006400",
                    borderWidth: 2,
                    pointRadius: 0,
                    borderDash: [4,3],
                    segment: {
                        borderColor: stColor
                    }
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            animation: false,   // 🔥 NO FLICKER

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: { display: false },
                y: {
                    min: minPrice,
                    max: maxPrice,
                    grid: { display: false },
                    beginAtZero: false
                }
            }
        }
    });
}

/* UPDATE ONLY DATA */
function updateChart(data) {

    if (!chart) {
        initChart(data);
        return;
    }

    chart.data.labels = data.map((_, i) => i);
    chart.data.datasets[0].data = data.map(d => d.close);
    chart.data.datasets[1].data = data.map(d => d.st);

    chart.update('none'); // 🔥 no animation = stable
}

/* =========================
   LOAD LOOP
========================= */
async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();
    updateChart(data);
}

load();
setInterval(load, 3000);

</script>

</body>
</html>
