<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
    color: #111;
}

/* =========================
   MAIN CONTAINER
========================= */
#container {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================
   TERMINAL (LEFT)
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e5e5e5;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: 5px;
    cursor: col-resize;
    background: #ddd;
}

/* =========================
   RIGHT PANEL (BROWSER)
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

/* TOOLBAR */
#toolbar {
    padding: 5px;
    background: #f3f3f3;
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #e5e5e5;
}

#urlBar {
    flex: 1;
    padding: 6px;
    font-family: monospace;
    border: 1px solid #ccc;
    outline: none;
}

/* BROWSER */
#browser {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

/* =========================
   FULLSCREEN MODES
========================= */
.fullscreen-terminal #terminal {
    width: 100% !important;
}

.fullscreen-terminal #right {
    display: none;
}

.fullscreen-browser #terminal {
    display: none;
}

.fullscreen-browser #right {
    width: 100% !important;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {

    #right {
        display: none !important;
    }

    #divider {
        display: none !important;
    }

    #terminal {
        width: 100% !important;
        height: 100vh !important;
        border-right: none;
    }

    #container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="container">

    <!-- LEFT: TERMINAL -->
    <div id="terminal"></div>

    <!-- RESIZE BAR -->
    <div id="divider"></div>

    <!-- RIGHT: BROWSER -->
    <div id="right">

        <div id="toolbar">
            <input id="urlBar" placeholder="Enter URL like google.com">
            <button onclick="loadURL()">Go</button>
            <button onclick="toggleTerminal()">🖥 Terminal</button>
            <button onclick="toggleBrowser()">🌐 Browser</button>
            <button onclick="resetLayout()">🔄 Reset</button>
        </div>

        <iframe id="browser"></iframe>

    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>

/* =========================
   TERMINAL SETUP
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#ffffff",
        foreground: "#111111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL READY");

/* =========================
   WEBSOCKET (optional)
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   BROWSER LOGIC
========================= */
const urlBar = document.getElementById("urlBar");
const browser = document.getElementById("browser");

function loadURL() {
    let url = urlBar.value.trim();
    if (!url) return;

    if (!url.startsWith("http")) {
        url = "https://" + url;
    }

    browser.src = url;
}

urlBar.addEventListener("keypress", (e) => {
    if (e.key === "Enter") loadURL();
});

// default page
browser.src = "https://example.com";

/* =========================
   RESIZE LEFT / RIGHT
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let dragging = false;

divider.addEventListener("mousedown", () => dragging = true);

window.addEventListener("mouseup", () => {
    dragging = false;
    localStorage.setItem("split", terminal.style.width);
});

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    if (window.innerWidth <= 768) return;

    const percent = (e.clientX / window.innerWidth) * 100;

    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   SAVE / LOAD LAYOUT
========================= */
function loadLayout() {
    const saved = localStorage.getItem("split");
    if (saved && window.innerWidth > 768) {
        terminal.style.width = saved;
        right.style.width = (100 - parseFloat(saved)) + "%";
    }
}

/* =========================
   FULLSCREEN TOGGLES
========================= */
function toggleTerminal() {
    document.body.classList.toggle("fullscreen-terminal");
}

function toggleBrowser() {
    document.body.classList.toggle("fullscreen-browser");
}

function resetLayout() {
    terminal.style.width = "35%";
    right.style.width = "65%";
    localStorage.removeItem("split");
}

/* =========================
   INIT
========================= */
loadLayout();

</script>

</body>
</html>
