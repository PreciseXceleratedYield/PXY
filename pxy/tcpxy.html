<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #f5f5f5;
    color: #111;
}

* {
    scrollbar-width: thin;
    scrollbar-color: #f5f5f5 #f5f5f5;
}
::-webkit-scrollbar { width: 2px; height: 2px; }
::-webkit-scrollbar-track { background: #f5f5f5; }
::-webkit-scrollbar-thumb { background: #f5f5f5; }

#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    z-index: 1000;
}

#headerLeft { position: absolute; left: 10px; font-size: 14px; }
#headerCenter { position: absolute; left: 50%; transform: translateX(-50%); font-size: 14px; }
#headerRight { position: absolute; right: 10px; display: flex; gap: 12px; }

.liveBox { display: flex; gap: 4px; }

#statusDot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00c853;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1 }
    50% { opacity: 0.3 }
}

#menu { position: relative; cursor: pointer; }
#dropdown {
    position: absolute;
    top: 22px;
    right: 0;
    background: #f5f5f5;
    border: 1px solid #ddd;
    display: none;
}
#dropdown div { padding: 6px 10px; cursor: pointer; }
#dropdown div:hover { background: #eee; }
#menu.active #dropdown { display: block; }

#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 33%;
    min-width: 200px;
    border-right: 1px solid #ddd;
}

#divider {
    width: var(--divider-width);
    cursor: col-resize;
    background: #f5f5f5;
}

#right { flex: 1; display: flex; flex-direction: column; }
#chartWrap { flex: 1; }

canvas {
    width: 100% !important;
    height: 100% !important;
    background: #f5f5f5;
}

#topCandleWrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 18px;
    background: #f5f5f5;
    border-top: 1px solid #ddd;
}
</style>
</head>

<body>

<div id="topHeader">
    <div id="headerLeft">PXY®</div>
    <div id="headerCenter">PreciseXceleratedYield Pvt Ltd</div>

    <div id="headerRight">
        <span class="liveBox">
            <span id="statusDot"></span>
            <span>LIVE</span>
        </span>

        <div id="menu">
            ☰
            <div id="dropdown">
                <div>CSV 1</div>
                <div>CSV 2</div>
                <div>CSV 3</div>
            </div>
        </div>
    </div>
</div>

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const term = new Terminal({ convertEol:true, scrollback:1000, fontFamily:"monospace", fontSize:14 });

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
setTimeout(()=>fitAddon.fit(),50);
window.addEventListener("resize",()=>fitAddon.fit());

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = e => term.write(e.data);

let chart;

async function load(){
    const res=await fetch("./syschrtpxy.json");
    const data=await res.json();

    const closes=data.map(d=>d.close);
    const st=data.map(d=>d.st);
    const highs=data.map(d=>d.high);
    const lows=data.map(d=>d.low);

    draw(closes,st);
    drawTopCandle(st,closes,highs,lows);
}

function draw(closes,st){
    const c=closes.slice(-40);
    const s=st.slice(-40);

    if(!chart){
        chart=new Chart(document.getElementById("priceChart"),{
            type:"line",
            data:{
                labels:c.map((_,i)=>i),
                datasets:[
                    { data:c, borderColor:"rgba(0,0,0,0.25)", borderWidth:2, pointRadius:0 },
                    { data:s, borderColor:"#000", borderWidth:1, pointRadius:0 }
                ]
            },
            options:{ animation:false, plugins:{legend:{display:false}}, scales:{x:{display:false},y:{display:false}} }
        });
    } else {
        chart.data.datasets[0].data=c;
        chart.data.datasets[1].data=s;
        chart.update("none");
    }
}

function drawTopCandle(stVals, closes, highs, lows){
    const canvas=document.getElementById("topCandle");
    const ctx=canvas.getContext("2d");

    canvas.width=canvas.clientWidth;
    canvas.height=canvas.clientHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const st = stVals.at(-1);
    const close = closes.at(-1);

    const HH = Math.max(...highs.slice(-40));
    const LL = Math.min(...lows.slice(-40));

    const high = close>=st ? HH : st;
    const low  = close>=st ? st : LL;

    const scale=v=>((v-low)/(high-low||1))*canvas.width;
    const midY=canvas.height/2;

    ctx.strokeStyle="#000";
    ctx.beginPath();
    ctx.moveTo(scale(low),midY);
    ctx.lineTo(scale(high),midY);
    ctx.stroke();

    // ✅ COLOR FIX ONLY
    ctx.globalAlpha = 1;
    ctx.fillStyle = close >= st ? "#1b5e20" : "#7f0000";

    ctx.fillRect(
        Math.min(scale(st),scale(close)),
        midY-6,
        Math.max(Math.abs(scale(close)-scale(st)),2),
        12
    );
}

load();
setInterval(load,3000);
</script>

</body>
</html>
