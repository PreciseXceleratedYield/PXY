<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>

:root {
    --divider-width: 6px;
}

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* =========================
   TOP BANNER
========================= */
#topCandleWrap {
    width: 100%;
    height: 60px;
    background: #3b3b3b;
    border-bottom: 1px solid #4a4a4a;
}

#topCandle {
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   MAIN LAYOUT
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 60px);
}

/* =========================
   TERMINAL
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100%;
    background: #3b3b3b;
    border-right: 1px solid #4a4a4a;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: var(--divider-width);
    min-width: 10px;
    cursor: col-resize;
    background: #4a4a4a;
}

/* =========================
   RIGHT PANEL
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #3b3b3b;
}

#chartWrap {
    flex: 1;
    position: relative;
    overflow: hidden;
}

canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    background: #3b3b3b;
}

#toolbar {
    display: none;
}

</style>
</head>

<body>

<!-- 🔥 TOP CANDLE BANNER -->
<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   OPTIONAL WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DATA LOAD
========================= */
let chart;

async function load() {
    try {
        const res = await fetch("./syschrtpxy.json");

        if (!res.ok) {
            console.log("JSON not found");
            return;
        }

        const data = await res.json();

        if (!data || data.length === 0) {
            console.log("EMPTY DATA");
            return;
        }

        const closes = data.map(d => d.close);
        const stVals = data.map(d => d.st);

        drawChart(closes, stVals);
        drawTopCandle(stVals, closes);

    } catch (e) {
        console.log("LOAD ERROR:", e);
    }
}

/* =========================
   TOP HORIZONTAL CANDLE
========================= */
function drawTopCandle(stVals, closes) {

    const canvas = document.getElementById("topCandle");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!stVals.length || !closes.length) return;

    const open = stVals[0];
    const close = closes[closes.length - 1];
    const high = Math.max(...stVals);
    const low = Math.min(...stVals);

    const midY = canvas.height / 2;

    const pad = 20;
    const width = canvas.width - pad * 2;

    const scale = v =>
        pad + ((v - low) / (high - low || 1)) * width;

    const xOpen = scale(open);
    const xClose = scale(close);
    const xHigh = scale(high);
    const xLow = scale(low);

    const color = close >= open ? "#00c853" : "#ff1744";

    // wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xLow, midY);
    ctx.lineTo(xHigh, midY);
    ctx.stroke();

    // body (3px thickness)
    ctx.fillStyle = color;
    ctx.fillRect(
        Math.min(xOpen, xClose),
        midY - 1.5,
        Math.abs(xClose - xOpen),
        3
    );
}

/* =========================
   CHART
========================= */
function drawChart(closes, stVals) {

    const ctx = document.getElementById("priceChart");

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];

    if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = closePad;
        chart.data.datasets[1].data = stPad;
        chart.update("none");
        return;
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,
            datasets: [
                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#000",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25
                },
                {
                    label: "ST",
                    data: stPad,
                    showLine: false,
                    pointRadius: 2,
                    pointBackgroundColor: "#00c853"
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { display: false }, position: "right" }
            }
        }
    });
}

/* =========================
   INIT (IMPORTANT FIX)
========================= */
window.onload = () => {
    load();
    setInterval(load, 3000);
};

</script>

</body>
</html>
