<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>

/* =========================
   GLOBAL
========================= */
:root {
    --divider-width: 6px;
}

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;

    scrollbar-width: none;
    -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
    display: none;
}

/* =========================
   MAIN LAYOUT
========================= */
#container {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================
   TERMINAL
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100vh;
    background: #3b3b3b;
    border-right: 1px solid #4a4a4a;
}

/* hide xterm scrollbar */
.xterm .xterm-viewport {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.xterm .xterm-viewport::-webkit-scrollbar {
    width: 0px !important;
    height: 0px !important;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: var(--divider-width);
    min-width: 10px;
    cursor: col-resize;
    background: #4a4a4a;
    z-index: 10;
}

/* =========================
   RIGHT PANEL
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #3b3b3b;
}

/* =========================
   CHART FIX (IMPORTANT)
========================= */
#chartWrap {
    flex: 1;
    position: relative;   /* 🔴 FIX */
    height: 100%;         /* 🔴 FIX */
    overflow: hidden;     /* 🔴 FIX */
}

canvas {
    display: block;       /* 🔴 FIX */
    width: 100% !important;
    height: 100% !important;
    background: #3b3b3b;
}

/* =========================
   REMOVE TOOLBAR
========================= */
#toolbar {
    display: none;
}

/* =========================
   FULLSCREEN
========================= */
.fullscreen-terminal #terminal {
    width: 100% !important;
}

.fullscreen-terminal #right {
    display: none;
}

.fullscreen-chart #terminal {
    display: none;
}

.fullscreen-chart #right {
    width: 100% !important;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {

    #right {
        display: none !important;
    }

    #divider {
        display: none !important;
    }

    #terminal {
        width: 100% !important;
        height: 100vh !important;
        border-right: none;
    }

    #container {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea",
        selection: "rgba(255,255,255,0.1)"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG FIXED DIVIDER
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", (e) => {
    isDragging = true;
    e.preventDefault();
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    saveLayout();
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    if (window.innerWidth <= 768) return;

    const percent = (e.clientX / window.innerWidth) * 100;

    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   LAYOUT
========================= */
function saveLayout() {
    localStorage.setItem("split", terminal.style.width);
}

function loadLayout() {
    const saved = localStorage.getItem("split");
    if (saved && window.innerWidth > 768) {
        terminal.style.width = saved;
        right.style.width = (100 - parseFloat(saved)) + "%";
    }
}

/* =========================
   CHART (FIXED - NO DESTROY)
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
}

function draw(closes, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];
    const trendPad = [...stTrend, ...Array(pad).fill("UP")];

    /* =========================
       IN-PLACE UPDATE (NO FLICKER)
    ========================= */
    if (chart) {

        chart.data.labels = labels;
        chart.data.datasets[0].data = closePad;
        chart.data.datasets[1].data = stPad;

        chart.data.datasets[1].pointBackgroundColor = trendPad.map(t =>
            t === "UP" ? "#00c853" : "#ff1744"
        );

        chart.data.datasets[1].pointBorderColor = trendPad.map(t =>
            t === "UP" ? "#00c853" : "#ff1744"
        );

        chart.update("none"); // 🔴 no animation jump
        return;
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,
            datasets: [

                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#000000",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25
                },

                {
                    label: "ST",
                    data: stPad,
                    showLine: false,
                    pointRadius: 2,
                    pointBorderWidth: 2,
                    pointBackgroundColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    ),
                    pointBorderColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    )
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false }, ticks: { color: "#eaeaea" } },
                y: { grid: { display: false }, ticks: { color: "#eaeaea" }, position: "right" }
            }
        }
    });
}

/* =========================
   INIT
========================= */
loadLayout();
load();
setInterval(load, 3000);

</script>

</body>
</html>
