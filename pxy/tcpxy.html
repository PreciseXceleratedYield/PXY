<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

/* GLOBAL */
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* SCROLLBAR */
* {
    scrollbar-width: thin;
    scrollbar-color: #3b3b3b #3b3b3b;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #3b3b3b; }
::-webkit-scrollbar-thumb { background: #3b3b3b; }

/* HEADER */
#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.5px;

    color: #000;

    background: linear-gradient(270deg,#ff1744,#00c853,#ff1744);
    background-size: 300% 300%;
    animation: flow 10s ease infinite;

    box-shadow:
        inset 0 -1px 0 rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 2px 6px rgba(0,0,0,0.5);

    z-index: 1000;
}

@keyframes flow {
    0% { background-position: 0% }
    50% { background-position: 100% }
    100% { background-position: 0% }
}

/* CENTER TEXT */
#headerCenter {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
}

/* RIGHT SIDE */
#headerRight {
    position: absolute;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
}

/* LIVE */
.liveBox {
    display: flex;
    align-items: center;
    gap: 4px;
}

#statusDot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* MENU */
#menu {
    position: relative;
    cursor: pointer;
    font-size: 14px;
}

#dropdown {
    position: absolute;
    top: 22px;
    right: 0;
    background: #2b2b2b;
    border: 1px solid #444;
    display: none;
    min-width: 100px;
    z-index: 2000;
}

#dropdown div {
    padding: 6px 10px;
    cursor: pointer;
}

#dropdown div:hover {
    background: #3b3b3b;
}

#menu.active #dropdown {
    display: block;
}

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 35%;
    min-width: 200px;
    border-right: 1px solid #4a4a4a;
}

#divider {
    width: var(--divider-width);
    cursor: col-resize;
    background: #3b3b3b;
    opacity: 0;
}
#divider:hover { opacity: 0.15; }

#right { flex: 1; display: flex; flex-direction: column; }
#chartWrap { flex: 1; }

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* BOTTOM STRIP */
#topCandleWrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 18px;
    background: #3b3b3b;
    border-top: 1px solid #4a4a4a;
}
</style>
</head>

<body>

<!-- HEADER -->
<div id="topHeader">

    <div id="headerCenter">
        🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦
    </div>

    <div id="headerRight">
        <span class="liveBox">
            <span id="statusDot"></span>
            <span>LIVE</span>
        </span>

        <div id="menu">
            ☰
            <div id="dropdown">
                <div>CSV 1</div>
                <div>CSV 2</div>
                <div>CSV 3</div>
            </div>
        </div>
    </div>

</div>

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* TERMINAL (UNCHANGED) */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea",
        selection: "rgba(255,255,255,0.1)"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
setTimeout(()=>fitAddon.fit(),50);
window.addEventListener("resize",()=>fitAddon.fit());

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = e => term.write(e.data);

/* MENU */
const menu = document.getElementById("menu");
menu.onclick = (e) => {
    e.stopPropagation();
    menu.classList.toggle("active");
};
window.onclick = () => menu.classList.remove("active");

/* CHART */
let chart;

async function load(){
    const res=await fetch("./syschrtpxy.json");
    const data=await res.json();

    const closes=data.map(d=>d.close);
    const st=data.map(d=>d.st);
    const trend=data.map(d=>d.st_trend);

    draw(closes,st,trend);
}

function draw(closes,st,trend){

    const MAX=40;

    const c=closes.slice(-MAX);
    const s=st.slice(-MAX);
    const t=trend.slice(-MAX);

    const dir=t.at(-1)==="UP"?1:-1;

    const header=document.getElementById("topHeader");
    header.style.background = dir===1
        ? "linear-gradient(270deg,#00c853,#00e676,#00c853)"
        : "linear-gradient(270deg,#ff1744,#ff5252,#ff1744)";

    if(!chart){
        chart=new Chart(document.getElementById("priceChart"),{
            type:"line",
            data:{
                labels:c.map((_,i)=>i),
                datasets:[
                    {
                        data:c,
                        borderColor:"rgba(255,255,255,0.25)",
                        borderWidth:2,
                        pointRadius:0
                    },
                    {
                        data:s,
                        borderWidth:3,
                        pointRadius:0,
                        segment:{
                            borderColor:i=>t[i.p0DataIndex]==="UP"
                                ?"#00c853":"#ff1744"
                        }
                    }
                ]
            },
            options:{
                animation:false,
                plugins:{legend:{display:false}},
                scales:{
                    x:{display:false},
                    y:{display:false}
                }
            }
        });
    } else {
        chart.data.labels=c.map((_,i)=>i);
        chart.data.datasets[0].data=c;
        chart.data.datasets[1].data=s;
        chart.update("none");
    }
}

load();
setInterval(load,3000);
</script>

</body>
</html>
