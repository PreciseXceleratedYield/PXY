<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* HEADER */
#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;
    background: linear-gradient(90deg, #ff1744, #00c853);
    color: #000;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

/* LOGO */
#logo {
    position: fixed;
    top: 2px;
    right: 8px;
    height: 22px;
    cursor: pointer;
    z-index: 2000;
    transition: 0.2s;
}

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 35%;
    min-width: 200px;
    border-right: 1px solid #4a4a4a;
}

#divider {
    width: var(--divider-width);
    cursor: col-resize;
}

#right {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* BOTTOM STRIP (RESTORED) */
#topCandleWrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 18px;
    background: #3b3b3b;
    border-top: 1px solid #4a4a4a;
}

</style>
</head>

<body>

<div id="topHeader">
    🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦
</div>

<img id="logo" src="logo.png">

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* ================= TERMINAL (UNCHANGED) ================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* ================= CORE ================= */
const COLORS = {
    bull: "#00c853",
    bear: "#ff1744",
    dim: "rgba(255,255,255,0.25)"
};

let chart, pulse = 0;
let trades = [];
let currentTrade = null;

/* ================= LOGO ================= */
document.getElementById("logo").onclick = () => location.reload();

/* ================= LOAD ================= */
async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const st = data.map(d => d.st);
    const trend = data.map(d => d.st_trend);

    draw(closes, st, trend);
    drawTopCandle(st, closes);
}

/* ================= DRAW ================= */
function draw(closes, st, trend) {

    const ctx = document.getElementById("priceChart");

    const closePad = [...closes, null,null,null];
    const stPad = [...st, null,null,null];
    const trendPad = [...trend, "UP","UP","UP"];

    const last = closePad.at(-4);
    const dir = trendPad.at(-4) === "UP" ? 1 : -1;

    /* SIGNAL */
    let signal = false;
    if (closePad.at(-5)) {
        const p = closePad.at(-5) - stPad.at(-5);
        const c = closePad.at(-4) - stPad.at(-4);
        signal = p*c < 0;
    }

    /* TRADE */
    if (signal) {
        if (!currentTrade) currentTrade = { entry:last, dir };
        else {
            const pnl = dir===1 ? last-currentTrade.entry : currentTrade.entry-last;
            trades.push(pnl);
            currentTrade = null;
        }
    }

    const winRate = trades.length
        ? trades.filter(t=>t>0).length / trades.length * 100
        : 0;

    /* LOGO REACT */
    const logo = document.getElementById("logo");
    logo.style.filter = dir===1
        ? "drop-shadow(0 0 6px #00c853)"
        : "drop-shadow(0 0 6px #ff1744)";

    if (signal) {
        logo.style.transform="scale(1.2)";
        setTimeout(()=>logo.style.transform="scale(1)",150);
    }

    if (chart) {
        chart.data.datasets[0].data = closePad;
        chart.data.datasets[1].data = stPad;
        chart.update("none");
        return;
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: closePad.map((_,i)=>i),
            datasets: [

                { data: closePad, borderColor: COLORS.dim, borderWidth: 2, pointRadius:0 },

                {
                    data: stPad,
                    borderWidth: 3,
                    pointRadius: 0,
                    segment:{
                        borderColor: c =>
                            trendPad[c.p0DataIndex]==="UP"
                                ? COLORS.bull : COLORS.bear
                    }
                },

                {
                    data: closePad.map((v,i)=>{
                        if(i<1) return null;
                        const p = closePad[i-1]-stPad[i-1];
                        const c = v-stPad[i];
                        return (p*c<0)?v:null;
                    }),
                    showLine:false,
                    pointRadius: ctx =>
                        ctx.raw ? 5 + Math.sin(pulse)*2 : 0,
                    pointBackgroundColor:"#fff"
                }
            ]
        },
        options:{
            animation:false,
            plugins:{legend:{display:false}}
        },
        plugins:[{
            id:"overlay",
            afterDraw(chart){
                const {ctx, chartArea:{left,top}} = chart;
                ctx.fillStyle="#fff";
                ctx.font="12px monospace";
                ctx.fillText(`WR: ${winRate.toFixed(1)}%`, left+10, top+20);
            }
        }]
    });
}

/* ================= BOTTOM STRIP (RESTORED) ================= */
function drawTopCandle(stVals, closes) {

    const canvas = document.getElementById("topCandle");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const open = stVals.at(-1);
    const close = closes.at(-1);

    const high = Math.max(...stVals, ...closes);
    const low = Math.min(...stVals, ...closes);

    const scale = v => ((v - low) / (high - low || 1)) * canvas.width;

    const xOpen = scale(open);
    const xClose = scale(close);

    ctx.fillStyle = close >= open ? "#00c853" : "#ff1744";

    ctx.fillRect(
        Math.min(xOpen, xClose),
        canvas.height/2 - 6,
        Math.max(Math.abs(xClose-xOpen),2),
        12
    );
}

/* ================= PULSE ================= */
function animate(){
    pulse += 0.1;
    if(chart) chart.update('none');
    requestAnimationFrame(animate);
}
animate();

/* ================= INIT ================= */
load();
setInterval(load, 3000);

</script>
</body>
</html>
