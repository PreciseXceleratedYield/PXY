<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY TRADING DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
    color: #111;
}

/* =========================
   MAIN CONTAINER
========================= */
#container {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================
   TERMINAL (LEFT)
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e5e5e5;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: 5px;
    cursor: col-resize;
    background: #ddd;
}

/* =========================
   RIGHT PANEL (CHART)
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

/* TOOLBAR */
#toolbar {
    padding: 6px;
    background: #f3f3f3;
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #e5e5e5;
}

/* CHART CONTAINER */
#chart {
    flex: 1;
    width: 100%;
    height: 100%;
}

/* =========================
   FULLSCREEN MODES
========================= */
.fullscreen-terminal #terminal {
    width: 100% !important;
}

.fullscreen-terminal #right {
    display: none;
}

.fullscreen-chart #terminal {
    display: none;
}

.fullscreen-chart #right {
    width: 100% !important;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {
    #right {
        display: none !important;
    }

    #divider {
        display: none !important;
    }

    #terminal {
        width: 100% !important;
        height: 100vh !important;
        border-right: none;
    }

    #container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="container">

    <!-- LEFT TERMINAL -->
    <div id="terminal"></div>

    <!-- RESIZER -->
    <div id="divider"></div>

    <!-- RIGHT CHART -->
    <div id="right">

        <div id="toolbar">
            <button onclick="toggleTerminal()">🖥 Terminal</button>
            <button onclick="toggleChart()">📊 Chart</button>
            <button onclick="resetLayout()">🔄 Reset</button>
        </div>

        <!-- TradingView Chart -->
        <div id="chart"></div>

    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<!-- TRADINGVIEW -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    theme: {
        background: "#ffffff",
        foreground: "#111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById("terminal"));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL READY");

/* =========================
   WEBSOCKET (optional)
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   RESIZE
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let dragging = false;

divider.addEventListener("mousedown", () => dragging = true);

window.addEventListener("mouseup", () => {
    dragging = false;
    localStorage.setItem("split", terminal.style.width);
});

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    if (window.innerWidth <= 768) return;

    const percent = (e.clientX / window.innerWidth) * 100;

    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   LAYOUT SAVE/LOAD
========================= */
function loadLayout() {
    const saved = localStorage.getItem("split");
    if (saved && window.innerWidth > 768) {
        terminal.style.width = saved;
        right.style.width = (100 - parseFloat(saved)) + "%";
    }
}

/* =========================
   FULLSCREEN
========================= */
function toggleTerminal() {
    document.body.classList.toggle("fullscreen-terminal");
}

function toggleChart() {
    document.body.classList.toggle("fullscreen-chart");
}

function resetLayout() {
    terminal.style.width = "35%";
    right.style.width = "65%";
    localStorage.removeItem("split");
}

/* =========================
   TRADINGVIEW CHART
========================= */
new TradingView.widget({
    container_id: "chart",
    symbol: "NSE:NIFTY",
    interval: "5",
    theme: "light",
    style: "1",
    locale: "en",
    allow_symbol_change: true,
    hide_top_toolbar: false,
    autosize: true
});

/* =========================
   INIT
========================= */
loadLayout();

</script>

</body>
</html>
