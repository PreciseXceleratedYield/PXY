<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
:root { --divider-width: 6px; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;
}

/* HEADER */
#topHeader {
    position: fixed;
    top: 0;
    width: 100%;
    height: 26px;
    background: linear-gradient(90deg, #ff1744, #00c853);
    color: #000;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

/* LOGO */
#logo {
    position: fixed;
    top: 2px;
    right: 8px;
    height: 22px;
    cursor: pointer;
    z-index: 2000;
    transition: 0.2s;
}

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 18px);
    padding-top: 26px;
}

#terminal {
    width: 35%;
    background: #3b3b3b;
    border-right: 1px solid #4a4a4a;
}

#divider {
    width: var(--divider-width);
    cursor: col-resize;
}

#right {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<div id="topHeader">
    🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦
</div>

<img id="logo" src="logo.png">

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* =========================
   CORE CONFIG
========================= */
const COLORS = {
    bull: "#00c853",
    bear: "#ff1744",
    dim: "rgba(255,255,255,0.25)"
};

let chart, pulse = 0;
let trades = [];
let currentTrade = null;
let WEIGHTS = { trend:0.4, volatility:0.3, slope:0.3 };

/* =========================
   TERMINAL
========================= */
const term = new Terminal();
term.open(document.getElementById('terminal'));

/* =========================
   LOGO CLICK
========================= */
document.getElementById("logo").onclick = () => location.reload();

/* =========================
   DATA LOAD
========================= */
async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const st = data.map(d => d.st);
    const trend = data.map(d => d.st_trend);

    draw(closes, st, trend);
}

/* =========================
   DRAW
========================= */
function draw(closes, st, trend) {

    const ctx = document.getElementById("priceChart");

    const pad = 3;
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...st, ...Array(pad).fill(null)];
    const trendPad = [...trend, ...Array(pad).fill("UP")];

    /* ===== FEATURES ===== */
    const last = closePad.at(-4);
    const prev = closePad.at(-8) || last;

    const volatility = Math.abs(last - prev);
    const slope = last - prev;
    const dir = trendPad.at(-4) === "UP" ? 1 : -1;

    const score = Math.round(
        (dir*WEIGHTS.trend + volatility*WEIGHTS.volatility + slope*WEIGHTS.slope)*50 + 50
    );

    /* ===== SIGNAL ===== */
    let signal = false;
    if (closePad.at(-5) && stPad.at(-5)) {
        const prevDiff = closePad.at(-5) - stPad.at(-5);
        const currDiff = closePad.at(-4) - stPad.at(-4);
        signal = prevDiff * currDiff < 0;
    }

    /* ===== TRADE ENGINE ===== */
    if (signal) {
        if (!currentTrade) {
            currentTrade = { entry:last, dir };
        } else {
            const pnl = dir === 1 ? last-currentTrade.entry : currentTrade.entry-last;
            trades.push(pnl);
            currentTrade = null;
        }
    }

    const winRate = trades.length
        ? trades.filter(t=>t>0).length / trades.length * 100
        : 0;

    /* ===== LOGO ===== */
    const logo = document.getElementById("logo");
    logo.style.filter = dir === 1
        ? "drop-shadow(0 0 6px #00c853)"
        : "drop-shadow(0 0 6px #ff1744)";

    if (signal) {
        logo.style.transform = "scale(1.2)";
        setTimeout(()=>logo.style.transform="scale(1)",150);
    }

    /* ===== CHART ===== */
    if (chart) {
        chart.data.datasets[0].data = closePad;
        chart.data.datasets[1].data = stPad;
        chart.update("none");
        return;
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: closePad.map((_,i)=>i),
            datasets: [

                // PRICE (DIM)
                {
                    data: closePad,
                    borderColor: COLORS.dim,
                    borderWidth: 2,
                    pointRadius: 0
                },

                // ST (MAIN)
                {
                    data: stPad,
                    borderWidth: 3,
                    pointRadius: 0,
                    segment: {
                        borderColor: c =>
                            trendPad[c.p0DataIndex]==="UP"
                                ? COLORS.bull : COLORS.bear
                    }
                },

                // CROSS PULSE
                {
                    data: closePad.map((v,i)=>{
                        if(i<1) return null;
                        const p = closePad[i-1]-stPad[i-1];
                        const c = v-stPad[i];
                        return (p*c<0)?v:null;
                    }),
                    showLine:false,
                    pointRadius: ctx =>
                        ctx.raw ? 5 + Math.sin(pulse)*2 : 0,
                    pointBackgroundColor:"#fff"
                }
            ]
        },
        options: {
            animation:false,
            plugins:{
                legend:{display:false}
            }
        },
        plugins:[{
            id:"overlay",
            afterDraw(chart){
                const {ctx, chartArea:{left,top}} = chart;

                ctx.fillStyle="#fff";
                ctx.font="12px monospace";

                ctx.fillText(`SCORE: ${score}`, left+10, top+20);
                ctx.fillText(`WR: ${winRate.toFixed(1)}%`, left+10, top+40);
            }
        }]
    });
}

/* =========================
   PULSE LOOP
========================= */
function animate(){
    pulse += 0.1;
    if(chart) chart.update('none');
    requestAnimationFrame(animate);
}
animate();

/* =========================
   INIT
========================= */
load();
setInterval(load, 3000);

</script>
</body>
</html>
