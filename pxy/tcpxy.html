<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
    color: #111;
}

#container {
    display: flex;
    width: 100%;
    height: 100vh;
}

#terminal {
    width: 35%;
    min-width: 200px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e5e5e5;
}

#divider {
    width: 5px;
    cursor: col-resize;
    background: #ddd;
}

#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

#toolbar {
    display: none;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

.fullscreen-terminal #terminal { width: 100% !important; }
.fullscreen-terminal #right { display: none; }
.fullscreen-chart #terminal { display: none; }
.fullscreen-chart #right { width: 100% !important; }

@media (max-width: 768px) {
    #right { display: none !important; }
    #divider { display: none !important; }
    #terminal { width: 100% !important; height: 100vh !important; border-right: none; }
    #container { flex-direction: column; }
}
</style>
</head>

<body>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   CHART
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
}

function draw(closes, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];
    const trendPad = [...stTrend, ...Array(pad).fill("UP")];

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,
            datasets: [

                // PRICE LINE
                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#b8860b",
                    borderWidth: 1,
                    pointRadius: 0,
                    tension: 0.25
                },

                // ST → DASH MARKERS (EYE-FRIENDLY COLORS)
                {
                    label: "ST",
                    data: stPad,
                    showLine: false,

                    pointRadius: 6,
                    pointStyle: 'rectRot',
                    pointRotation: 90,

                    pointBackgroundColor: trendPad.map(t =>
                        t === "UP" ? "#4DB6AC" : "#FF8A65"   // 👈 soft teal / soft coral
                    ),

                    pointBorderColor: trendPad.map(t =>
                        t === "UP" ? "#4DB6AC" : "#FF8A65"
                    ),

                    pointBorderWidth: 1
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: {
                    ticks: { color: "#333" },
                    grid: { display: false }
                },
                y: {
                    position: "right",
                    ticks: { color: "#333" },
                    grid: { display: false }
                }
            }
        }
    });
}

/* =========================
   INIT
========================= */
load();
setInterval(load, 3000);

</script>

</body>
</html>
