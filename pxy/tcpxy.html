<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
    color: #111;
}

#container {
    display: flex;
    width: 100%;
    height: 100vh;
}

#terminal {
    width: 35%;
    min-width: 200px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e5e5e5;
}

#divider {
    width: 5px;
    cursor: col-resize;
    background: #ddd;
}

#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

#toolbar {
    padding: 5px;
    background: #f3f3f3;
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #e5e5e5;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

.fullscreen-terminal #terminal {
    width: 100% !important;
}

.fullscreen-terminal #right {
    display: none;
}

.fullscreen-chart #terminal {
    display: none;
}

.fullscreen-chart #right {
    width: 100% !important;
}

@media (max-width: 768px) {

    #right {
        display: none !important;
    }

    #divider {
        display: none !important;
    }

    #terminal {
        width: 100% !important;
        height: 100vh !important;
        border-right: none;
    }

    #container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="container">

    <div id="terminal"></div>

    <div id="divider"></div>

    <div id="right">

        <div id="toolbar">
            <button onclick="toggleTerminal()">🖥 Terminal</button>
            <button onclick="toggleChart()">📊 Chart</button>
            <button onclick="resetLayout()">🔄 Reset</button>
        </div>

        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>

    </div>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<!-- Chart.js + Financial Plugin -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#ffffff",
        foreground: "#111111",
        cursor: "#111111",
        selection: "rgba(0,0,0,0.08)"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG SPLIT
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", () => isDragging = true);

window.addEventListener("mouseup", () => {
    isDragging = false;
    saveLayout();
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    if (window.innerWidth <= 768) return;

    const percent = (e.clientX / window.innerWidth) * 100;
    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   LAYOUT
========================= */
function saveLayout() {
    localStorage.setItem("split", terminal.style.width);
}

function loadLayout() {
    const saved = localStorage.getItem("split");
    if (saved && window.innerWidth > 768) {
        terminal.style.width = saved;
        right.style.width = (100 - parseFloat(saved)) + "%";
    }
}

/* =========================
   FULLSCREEN
========================= */
function toggleTerminal() {
    document.body.classList.toggle("fullscreen-terminal");
}

function toggleChart() {
    document.body.classList.toggle("fullscreen-chart");
}

function resetLayout() {
    terminal.style.width = "35%";
    right.style.width = "65%";
    localStorage.removeItem("split");
}

/* =========================
   HEIKIN ASHI CONVERSION
========================= */
function toHA(data) {
    let ha = [];

    for (let i = 0; i < data.length; i++) {

        const d = data[i];

        const close = (d.open + d.high + d.low + d.close) / 4;

        let open;
        if (i === 0) {
            open = (d.open + d.close) / 2;
        } else {
            open = (ha[i - 1].o + ha[i - 1].c) / 2;
        }

        const high = Math.max(d.high, open, close);
        const low = Math.min(d.low, open, close);

        ha.push({ x: i, o: open, h: high, l: low, c: close });
    }

    return ha;
}

/* =========================
   CHART
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const raw = await res.json();

    const haData = toHA(raw);

    const stVals = raw.map(d => d.st);
    const stTrend = raw.map(d => d.st_trend);

    draw(haData, stVals, stTrend);
}

function draw(haData, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "candlestick",

        data: {
            datasets: [

                // HEIKIN ASHI
                {
                    label: "HA",
                    data: haData,

                    borderColor: ctx => {
                        const d = ctx.raw;
                        return d.c >= d.o ? "#00c853" : "#ff1744";
                    },

                    backgroundColor: ctx => {
                        const d = ctx.raw;
                        return d.c >= d.o ? "#00c853" : "#ff1744";
                    }
                },

                // SUPER TREND DOTS
                {
                    type: "scatter",
                    label: "ST",
                    data: stVals.map((v, i) => ({ x: i, y: v })),

                    pointRadius: 2,
                    pointBackgroundColor: stTrend.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    )
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: {
                    ticks: { color: "#333" },
                    grid: { color: "#eee" }
                },
                y: {
                    position: "right",
                    ticks: { color: "#333" },
                    grid: { color: "#eee" }
                }
            }
        }
    });
}

/* =========================
   INIT
========================= */
loadLayout();
load();
setInterval(load, 3000);

</script>

</body>
</html>
