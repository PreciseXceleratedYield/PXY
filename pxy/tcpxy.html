<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #bdbdbd;
}

/* =========================
   TOP BAR
========================= */
#bannerWrap {
    width: 100%;
    height: 42px;
    position: relative;
    background: #bdbdbd;
    border-bottom: 1px solid #9e9e9e;
    overflow: hidden;
}

#bgChart {
    position: absolute;
    width: 100%;
    height: 42px;
    top: 0;
    left: 0;
    opacity: 0.35;
}

#banner {
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    line-height: 42px;
    color: #111;
}

/* =========================
   LAYOUT (28 / 70)
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

#terminal {
    width: 28%;
    min-width: 200px;
    background: #bdbdbd;
    border-right: 1px solid #9e9e9e;
}

#divider {
    width: 5px;
    cursor: col-resize;
    background: #9e9e9e;
}

#right {
    width: 70%;
    display: flex;
    flex-direction: column;
    background: #bdbdbd;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<!-- TOP -->
<div id="bannerWrap">
    <canvas id="bgChart"></canvas>
    <div id="banner">🏦 PXY DASHBOARD</div>
</div>

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let chart;
let bgChart;

/* =========================
   LOAD DATA
========================= */
async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    drawMain(data);
    drawBanner(data);
}

/* =========================
   ST DOTTED + COLOR SEGMENT
========================= */
function stColor(ctx) {
    const curr = ctx.p1.raw;
    const prev = ctx.p0.raw;
    return curr >= prev ? "#006400" : "#8B0000";
}

/* =========================
   MAIN CHART
========================= */
function drawMain(data) {

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    const highs = data.map(d => d.high);
    const lows = data.map(d => d.low);

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [

                {
                    label: "Close",
                    data: data.map(d => d.close),
                    borderColor: "#b8860b",
                    borderWidth: 1,
                    pointRadius: 0,
                    tension: 0.25
                },

                {
                    label: "ST",
                    data: data.map(d => d.st),

                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25,

                    segment: {
                        borderColor: stColor,
                        borderDash: [4, 3]   // dotted effect
                    }
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: {
                    grid: { display: false }
                },

                y: {
                    min: Math.min(...lows),
                    max: Math.max(...highs),
                    beginAtZero: false,
                    grid: { display: false }
                }
            }
        }
    });
}

/* =========================
   BANNER CANDLE (FIXED SCALE)
========================= */
function drawBanner(data) {

    const latest = data[data.length - 1];

    const close = latest.close;
    const st = latest.st;

    const high = Math.max(...data.map(d => d.high));
    const low = Math.min(...data.map(d => d.low));

    const ctx = document.getElementById("bgChart");

    if (bgChart) bgChart.destroy();

    bgChart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: ["PXY"],
            datasets: [

                {
                    data: [high - low],
                    backgroundColor: "#8a6f2a"
                },

                {
                    data: [Math.abs(close - st)],
                    backgroundColor: close >= st ? "#006400" : "#8B0000"
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: { display: false },
                y: {
                    display: false,
                    min: low,
                    max: high
                }
            }
        }
    });
}

/* =========================
   INIT
========================= */
load();
setInterval(load, 3000);

</script>

</body>
</html>
