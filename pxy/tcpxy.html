<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>

/* ───────── ROOT ───────── */
:root {
    --bg:#06080d; --bg2:#0c101a; --bg3:#111827;
    --border:rgba(255,255,255,0.06);
    --border2:rgba(255,255,255,0.12);
    --text:#e8ecf4; --muted:#5b6478;
    --bull:#22c55e; --bear:#ef4444;
    --accent:#3b82f6;
}

/* ───────── BASE ───────── */
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    height:100%;
    overflow:auto;
    font-family:'DM Mono',monospace;
    background:var(--bg);
    color:var(--text);
}

/* ───────── HEADER ───────── */
#topHeader{
    position:fixed; top:0; left:0; right:0;
    height:44px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 12px;
    background:var(--bg2);
    border-bottom:1px solid var(--border);
    z-index:1000;
    flex-wrap:wrap;
}

.price-display{
    font-family:'Syne';
    font-weight:800;
    font-size:clamp(16px,2vw,28px);
}

/* ───────── LAYOUT ───────── */
#container{
    display:flex;
    width:100%;
    height:calc(100dvh - 44px - 44px);
    margin-top:44px;
}

/* ───────── TERMINAL ───────── */
#terminalPanel{
    width:30%;
    min-width:200px;
    max-width:420px;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--border);
}

#terminal{
    flex:1;
    overflow:hidden;
}

/* ───────── DIVIDER ───────── */
#divider{
    width:5px;
    cursor:col-resize;
}

/* ───────── RIGHT ───────── */
#right{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* ───────── STATS ───────── */
#statsBar{
    display:flex;
    flex-wrap:wrap;
    padding:6px;
    border-bottom:1px solid var(--border);
}

.stat-item{
    padding:4px 10px;
    font-size:12px;
}

/* ───────── CHART ───────── */
#chartWrap{
    flex:1;
    position:relative;
}

canvas{
    width:100%!important;
    height:100%!important;
}

/* ───────── BOTTOM ───────── */
#bottomBar{
    position:fixed;
    bottom:0;
    left:0; right:0;
    height:44px;
    background:var(--bg2);
    border-top:1px solid var(--border);
}

/* ───────── RESPONSIVE ───────── */

/* Tablet */
@media(max-width:1024px){
    #terminalPanel{width:35%}
}

/* Mobile */
@media(max-width:768px){

    #container{
        flex-direction:column;
        height:auto;
    }

    #terminalPanel{
        width:100%;
        height:180px;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    #divider{display:none}

    #right{
        height:calc(100dvh - 44px - 44px - 180px);
    }

    #topHeader{
        height:auto;
        padding:6px;
    }
}

/* TV */
@media(min-width:1600px){
    .price-display{font-size:32px}
    .stat-item{font-size:14px}
}

</style>
</head>

<body>

<div id="topHeader">
    <div>PXY</div>
    <div class="price-display" id="priceDisplay">—</div>
</div>

<div id="container">

    <div id="terminalPanel">
        <div id="terminal"></div>
    </div>

    <div id="divider"></div>

    <div id="right">
        <div id="statsBar">
            <div class="stat-item">Open: <span id="statOpen">—</span></div>
            <div class="stat-item">High: <span id="statHigh">—</span></div>
            <div class="stat-item">Low: <span id="statLow">—</span></div>
        </div>

        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<div id="bottomBar"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* DPI FIX */
Chart.defaults.devicePixelRatio = window.devicePixelRatio || 1;

/* TERMINAL */
const term = new Terminal({fontSize:12});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById("terminal"));
setTimeout(()=>fitAddon.fit(),100);
window.addEventListener("resize",()=>fitAddon.fit());

/* DIVIDER RESIZE */
const divider=document.getElementById("divider");
const panel=document.getElementById("terminalPanel");

let drag=false;

divider.onmousedown=()=>drag=true;
window.onmouseup=()=>drag=false;

window.onmousemove=e=>{
    if(!drag) return;
    const pct=(e.clientX/window.innerWidth)*100;
    if(pct<15||pct>70) return;
    panel.style.width=pct+"%";
    fitAddon.fit();
};

/* DEMO CHART */
const ctx=document.getElementById("priceChart");

let data=[...Array(60)].map((_,i)=>i+Math.random()*10);

new Chart(ctx,{
    type:"line",
    data:{
        labels:data.map((_,i)=>i),
        datasets:[{
            data:data,
            borderColor:"#22c55e",
            tension:.3,
            pointRadius:0
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{display:false}}
    }
});

/* MOCK DATA */
function updateStats(){
    document.getElementById("statOpen").textContent=(Math.random()*100).toFixed(2);
    document.getElementById("statHigh").textContent=(Math.random()*120).toFixed(2);
    document.getElementById("statLow").textContent=(Math.random()*80).toFixed(2);
    document.getElementById("priceDisplay").textContent=(Math.random()*2500).toFixed(2);
}

setInterval(updateStats,2000);

</script>

</body>
</html>
