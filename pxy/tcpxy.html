<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
}

/* =========================
   TOP FULL WIDTH CANDLE FRAME
========================= */
#bannerWrap {
    position: relative;
    width: 100%;
    height: 42px;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    overflow: hidden;
}

/* canvas fills entire banner */
#bgCanvas {
    position: absolute;
    width: 100%;
    height: 42px;
    top: 0;
    left: 0;
    z-index: 0;
}

/* text overlay */
#banner {
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    line-height: 42px;
    color: #111;
}

/* =========================
   MAIN LAYOUT
========================= */
#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 42px);
}

/* TERMINAL */
#terminal {
    width: 35%;
    min-width: 200px;
    background: #f7f7f7;
    border-right: 1px solid #e0e0e0;
}

/* RIGHT */
#right {
    flex: 1;
    background: #fafafa;
}

/* DIVIDER */
#divider {
    width: 5px;
    background: #e6e6e6;
    cursor: col-resize;
}

/* MOBILE */
@media (max-width: 768px) {
    #right { display: none; }
    #divider { display: none; }
    #terminal { width: 100%; height: 100vh; }
}
</style>
</head>

<body>

<!-- =========================
     FULL WIDTH CANDLE BANNER
========================= -->
<div id="bannerWrap">
    <canvas id="bgCanvas"></canvas>
    <div id="banner">🏦 PXY® PreciseXceleratedYield Pvt Ltd 🏦</div>
</div>

<div id="container">
    <div id="terminal"></div>
    <div id="divider"></div>
    <div id="right"></div>
</div>

<script>

/* =========================
   FULL WIDTH CANDLE RENDERER
========================= */
async function drawBanner() {

    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");

    const w = canvas.width = canvas.offsetWidth;
    const h = canvas.height = canvas.offsetHeight;

    const prices = data.map(d => ({
        open: d.st,
        high: d.high,
        low: d.low,
        close: d.close
    }));

    const min = Math.min(...prices.map(p => p.low));
    const max = Math.max(...prices.map(p => p.high));

    const scaleY = (p) => h - ((p - min) / (max - min)) * h;

    const step = w / prices.length;

    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < prices.length; i++) {

        const x = i * step;

        const p = prices[i];

        const yHigh = scaleY(p.high);
        const yLow = scaleY(p.low);
        const yOpen = scaleY(p.open);
        const yClose = scaleY(p.close);

        // WICK
        ctx.strokeStyle = "#999";
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // BODY
        ctx.fillStyle = p.close >= p.open ? "#4DB6AC" : "#FF8A65";

        const bodyTop = Math.min(yOpen, yClose);
        const bodyH = Math.abs(yOpen - yClose);

        ctx.fillRect(x - 1, bodyTop, 2, bodyH || 1);
    }
}

/* =========================
   INIT
========================= */
drawBanner();
setInterval(drawBanner, 3000);

</script>

</body>
</html>
