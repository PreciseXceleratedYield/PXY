<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>

:root {
    --divider-width: 6px;
}

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #3b3b3b;
    color: #eaeaea;

    scrollbar-width: none;
    -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
    display: none;
}

#topCandleWrap {
    width: 100%;
    height: 18px;
    background: #3b3b3b;
    border-bottom: 1px solid #4a4a4a;
}

#topCandle {
    width: 100%;
    height: 100%;
    display: block;
}

#container {
    display: flex;
    width: 100%;
    height: calc(100vh - 18px);
}

#terminal {
    width: 35%;
    min-width: 200px;
    height: 100%;
    background: #3b3b3b;
    border-right: 1px solid #4a4a4a;
}

.xterm .xterm-viewport {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.xterm .xterm-viewport::-webkit-scrollbar {
    width: 0px !important;
    height: 0px !important;
}

#divider {
    width: var(--divider-width);
    min-width: 10px;
    cursor: col-resize;
    background: #4a4a4a;
    z-index: 10;
}

#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #3b3b3b;
}

#chartWrap {
    flex: 1;
    position: relative;
    height: 100%;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    background: #3b3b3b;
}

</style>
</head>

<body>

<div id="topCandleWrap">
    <canvas id="topCandle"></canvas>
</div>

<div id="container">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">
        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#3b3b3b",
        foreground: "#eaeaea",
        cursor: "#eaeaea",
        selection: "rgba(255,255,255,0.1)"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG DIVIDER
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let isDragging = false;

divider.addEventListener("mousedown", (e) => {
    isDragging = true;
    e.preventDefault();
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    saveLayout();
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    if (window.innerWidth <= 768) return;

    const percent = (e.clientX / window.innerWidth) * 100;

    if (percent < 10 || percent > 80) return;

    terminal.style.width = percent + "%";
    right.style.width = (100 - percent) + "%";

    fitAddon.fit();
});

/* =========================
   LAYOUT
========================= */
function saveLayout() {
    localStorage.setItem("split", terminal.style.width);
}

function loadLayout() {
    const saved = localStorage.getItem("split");
    if (saved && window.innerWidth > 768) {
        terminal.style.width = saved;
        right.style.width = (100 - parseFloat(saved)) + "%";
    }
}

/* =========================
   CHART
========================= */
let chart;

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
    drawTopCandle(stVals, closes);
}

function draw(closes, stVals, stTrend) {

    const ctx = document.getElementById("priceChart");

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];
    const trendPad = [...stTrend, ...Array(pad).fill("UP")];

    if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = closePad;
        chart.data.datasets[1].data = stPad;
        chart.update("none");
        return;
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,
            datasets: [
                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#000000",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25
                },
                {
                    label: "ST",
                    data: stPad,
                    showLine: false,
                    pointRadius: 2,
                    pointBorderWidth: 2,
                    pointBackgroundColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    ),
                    pointBorderColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    )
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false }, ticks: { color: "#eaeaea" } },
                y: { grid: { display: false }, ticks: { color: "#eaeaea" }, position: "right" }
            }
        }
    });
}

/* =========================
   🔥 TOP CANDLE (4× THICKNESS)
========================= */
function drawTopCandle(stVals, closes) {

    const canvas = document.getElementById("topCandle");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!stVals.length || !closes.length) return;

    const open = stVals[0];
    const close = closes[closes.length - 1];

    const high = Math.max(...stVals, ...closes);
    const low = Math.min(...stVals, ...closes);

    const range = high - low || 1;
    const midY = canvas.height / 2;

    const scale = v =>
        ((v - low) / range) * canvas.width;

    const xLow = scale(low);
    const xHigh = scale(high);
    const xOpen = scale(open);
    const xClose = scale(close);

    const bodyColor = close >= open ? "#00c853" : "#ff1744";
    const wickColor = "#ffffff";

    // wick
    ctx.strokeStyle = wickColor;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(xLow, midY);
    ctx.lineTo(xHigh, midY);
    ctx.stroke();

    // 🔥 4× THICK BODY
    const thickness = 12;

    ctx.fillStyle = bodyColor;

    ctx.fillRect(
        Math.min(xOpen, xClose),
        midY - thickness / 2,
        Math.max(Math.abs(xClose - xOpen), 2),
        thickness
    );
}

/* =========================
   INIT
========================= */
loadLayout();
load();
setInterval(load, 3000);

</script>

</body>
</html>
