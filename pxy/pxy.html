<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + Live HA Chart</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body { margin:0; height:100%; background:#1e1e1e; color:#e0d8c0; font-family:'Fira Code', monospace;}
#main { display:flex; height:100vh; }
#terminal-container { width:60%; border-right:1px solid #333; height:100%; }
#chart-container { width:40%; height:100%; padding:10px; }
canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="main">
    <div id="terminal-container"><div id="terminal"></div></div>
    <div id="chart-container"><canvas id="chart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
// ---------- TERMINAL ----------
const term = new Terminal({ convertEol:true });
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
term.writeln("Terminal + Live HA Chart Ready 🚀");

const ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
ws.onmessage = e => term.write(e.data);

// ---------- CHART ----------
const ctx = document.getElementById('chart').getContext('2d');
let chart = new Chart(ctx,{
    type:'line',
    data:{ labels:[], datasets:[{ label:'HA Line', data:[], borderColor:'#00ff00', borderWidth:2, pointRadius:0 }]},
    options:{
        animation:false,
        plugins:{legend:{display:false}},
        scales:{
            x:{ticks:{color:'#aaa'}, title:{display:true, text:'Time', color:'#ccc'}},
            y:{ticks:{color:'#aaa'}, title:{display:true, text:'Price', color:'#ccc'}}
        }
    }
});

// ---------- LOAD CSV ----------
async function loadData(){
    try{
        const res = await fetch('/sys/market_data.csv?t='+Date.now());
        if(!res.ok){ console.error("CSV fetch failed"); return; }
        const text = await res.text();
        const rows = text.trim().split('\n');

        // Skip header row
        const dataRows = rows[0].startsWith('Datetime') ? rows.slice(1) : rows;

        const data = dataRows.slice(-120).map(r=>{
            const cols = r.split(',');
            if(cols.length < 5) return null;  // ignore bad rows
            const dt = cols[0],
                  open=parseFloat(cols[1]),
                  high=parseFloat(cols[2]),
                  low=parseFloat(cols[3]),
                  close=parseFloat(cols[4]);
            if(isNaN(open)||isNaN(high)||isNaN(low)||isNaN(close)) return null;

            const ha_open = (open + high + low + close)/4;
            const ha_close = (open + close)/2;
            const ha_line = (ha_open + ha_close)/2;

            return {time:dt, value:ha_line};
        }).filter(Boolean);

        chart.data.labels = data.map(d=>d.time.substring(11,16)); // show HH:MM
        chart.data.datasets[0].data = data.map(d=>d.value);
        chart.update();

    }catch(e){ console.error("Chart load error:", e);}
}

// Auto-refresh every 3s
setInterval(loadData, 3000);
loadData();

// Resize terminal
window.addEventListener('resize',()=>fitAddon.fit());
</script>
</body>
</html>
