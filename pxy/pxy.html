<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PX Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    font-family: monospace;
    overflow: hidden;
}

/* LEFT TERMINAL */
#terminal {
    width: 50%;
    height: 100vh;
    border-right: 1px solid #ddd;
}

/* RIGHT CHART */
#right {
    width: 50%;
    height: 100vh;
    padding: 10px;
    box-sizing: border-box;
}

canvas {
    width: 100% !important;
    height: 95vh !important;
}
</style>
</head>

<body>

<!-- LEFT -->
<div id="terminal"></div>

<!-- RIGHT -->
<div id="right">
    <h3>📊 Close Price (Last 42)</h3>
    <canvas id="priceChart"></canvas>
</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// =====================
// TERMINAL
// =====================
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));
fitAddon.fit();

term.writeln("TERMINAL OK");

// =====================
// WEBSOCKET
// =====================
const ws = new WebSocket(`ws://${location.host}`);

ws.onmessage = (e) => term.write(e.data);

// =====================
// CHART
// =====================
let chartInstance = null;

async function loadChart() {
    try {
        const res = await fetch("./pxy.json");

        if (!res.ok) {
            console.log("FETCH FAIL:", res.status);
            return;
        }

        const data = await res.json();

        const closes = data.map(d => Number(d.close));

        drawChart(closes);

    } catch (err) {
        console.error("FETCH ERROR:", err);
    }
}

function drawChart(data) {
    const ctx = document.getElementById("priceChart");

    if (!ctx) return;

    const c = ctx.getContext("2d");

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(c, {
        type: "line",
        data: {
            labels: data.map((_, i) => i + 1),
            datasets: [{
                label: "Close",
                data: data,
                borderColor: "#1565c0",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { display: false },
                y: { display: true }
            }
        }
    });
}

// =====================
loadChart();
setInterval(loadChart, 3000);

window.addEventListener('resize', () => fitAddon.fit());

</script>

</body>
</html>
