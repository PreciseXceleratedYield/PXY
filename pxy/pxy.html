<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    background: #ffffff;
    color: #111;
}

/* =========================
   TOP BANNER (NEW)
========================= */
#banner {
    height: 64px; /* ~4 lines */
    width: 100%;
    background: #f7f7f7;
    border-bottom: 1px solid #ddd;
    padding: 6px 10px;
    box-sizing: border-box;
    font-size: 12px;
    line-height: 16px;
}

/* =========================
   MAIN WRAP
========================= */
#main {
    display: flex;
    width: 100%;
    height: calc(100vh - 64px);
}

/* =========================
   TERMINAL
========================= */
#terminal {
    width: 35%;
    min-width: 200px;
    height: 100%;
    background: #ffffff;
    border-right: 1px solid #e5e5e5;
}

/* =========================
   DIVIDER
========================= */
#divider {
    width: 5px;
    cursor: col-resize;
    background: #ddd;
}

/* =========================
   RIGHT
========================= */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#toolbar {
    padding: 5px;
    background: #f3f3f3;
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #e5e5e5;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* FULLSCREEN */
.fullscreen-terminal #terminal { width: 100% !important; }
.fullscreen-terminal #right { display: none; }
.fullscreen-chart #terminal { display: none; }
.fullscreen-chart #right { width: 100% !important; }
</style>
</head>

<body>

<!-- ================= BANNER (NEW) ================= -->
<div id="banner">
    <div id="b1">PXY DASHBOARD ACTIVE</div>
    <div id="b2">ST: -- | TREND: --</div>
    <div id="b3">WAITING DATA...</div>
    <div id="b4">━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>
</div>

<!-- ================= MAIN ================= -->
<div id="main">

    <div id="terminal"></div>
    <div id="divider"></div>

    <div id="right">

        <div id="toolbar">
            <button onclick="toggleTerminal()">🖥 Terminal</button>
            <button onclick="toggleChart()">📊 Chart</button>
            <button onclick="resetLayout()">🔄 Reset</button>
        </div>

        <div id="chartWrap">
            <canvas id="priceChart"></canvas>
        </div>

    </div>
</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* ================= TERMINAL ================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    theme: {
        background: "#ffffff",
        foreground: "#111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL READY");

/* ================= WS ================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* ================= DRAG ================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let dragging = false;

divider.addEventListener("mousedown", () => dragging = true);

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const p = (e.clientX / window.innerWidth) * 100;
    if (p < 10 || p > 80) return;

    terminal.style.width = p + "%";
    right.style.width = (100 - p) + "%";

    fitAddon.fit();
});

/* ================= LAYOUT ================= */
function saveLayout() {
    localStorage.setItem("split", terminal.style.width);
}

function loadLayout() {
    const s = localStorage.getItem("split");
    if (s) {
        terminal.style.width = s;
        right.style.width = (100 - parseFloat(s)) + "%";
    }
}

/* ================= FULLSCREEN ================= */
function toggleTerminal() {
    document.body.classList.toggle("fullscreen-terminal");
}

function toggleChart() {
    document.body.classList.toggle("fullscreen-chart");
}

function resetLayout() {
    terminal.style.width = "35%";
    right.style.width = "65%";
    localStorage.removeItem("split");
}

/* ================= CHART ================= */
let chart;

function updateBanner(lastST, trend) {
    document.getElementById("b2").innerText =
        `ST: ${lastST} | TREND: ${trend}`;

    document.getElementById("b3").innerText =
        trend === "UP" ? "MARKET BULLISH" : "MARKET BEARISH";
}

async function load() {
    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    updateBanner(stVals.at(-1), stTrend.at(-1));

    draw(closes, stVals, stTrend);
}

function draw(closes, stVals, stTrend) {
    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: closes.map((_, i) => i),

            datasets: [

                {
                    label: "Close",
                    data: closes,
                    borderColor: "#1f77b4",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25
                },

                /* ================= SUPER TREND ASCII STYLE ================= */
                {
                    label: "ST",
                    data: stVals,
                    showLine: false,

                    pointRadius: 0,   // hide circles

                    /* THIS IS THE KEY CHANGE */
                    pointStyle: stTrend.map(t => "line"),

                    pointBackgroundColor: stTrend.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    ),

                    pointBorderColor: stTrend.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    ),

                    pointBorderWidth: 3,

                    /* use unicode line marker instead of emoji */
                    beforeDraw: (chart) => {}
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { ticks: { color: "#333" }, grid: { color: "#eee" } },
                y: { position: "right", ticks: { color: "#333" }, grid: { color: "#eee" } }
            }
        }
    });
}

/* ================= INIT ================= */
loadLayout();
load();
setInterval(load, 3000);

</script>

</body>
</html>
