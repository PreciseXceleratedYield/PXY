<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #f0f0f0; /* page background */
}

#container {
    display: flex;
    height: 100vh; /* full viewport height */
    width: 100%;
}

/* Left: Terminal panel */
#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #ccc;
    height: 100%;
    background-color: #ffffff; /* white terminal panel */
}

/* Terminal itself */
#terminal {
    flex: 1;           /* fill full height */
    overflow-y: auto;
    color: #000000;     /* black text */
    background-color: #ffffff; /* white background */
}

/* Right: Chart panel */
#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;       /* match terminal height */
    padding: 10px;
    box-sizing: border-box;
}

/* iframe stretches to fill panel */
iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #00B4FF;
}
</style>
</head>
<body>

<div id="container">
    <!-- Left: Terminal -->
    <div id="terminal-container">
        <div id="terminal">Connecting to npxy tmux session...</div>
    </div>

    <!-- Right: Investing.com Chart -->
    <div id="chart-container">
        <iframe 
            src="https://ssltvc.investing.com/?pair_ID=8985&height=650&width=1200&interval=86400&plotStyle=candles&domain_ID=1&lang_ID=1&timezone_ID=20">
        </iframe>
    </div>
</div>

<!-- xterm.js -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<script>
/* ------------------ TERMINAL ------------------ */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#ffffff', // white background
        foreground: '#000000'  // black text
    }
});
term.open(document.getElementById('terminal'));

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('Connected. Displaying npxy tmux session...\n');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);
</script>

</body>
</html>
