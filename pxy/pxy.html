<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Light Mode Chart</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #ffffff;
    overflow: hidden;
}

#terminal {
    width: 100%;
    height: 100vh;
}
</style>

<!-- TradingView Lightweight Charts -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>

<div id="terminal"></div>

<script>

// =====================
// INIT CHART
// =====================
const chart = LightweightCharts.createChart(document.getElementById('terminal'), {
    layout: {
        background: { color: '#ffffff' },
        textColor: '#111111'
    },
    grid: {
        vertLines: { color: '#eee' },
        horzLines: { color: '#eee' }
    },
    width: window.innerWidth,
    height: window.innerHeight
});

const candleSeries = chart.addCandlestickSeries();

// =====================
// STORE CANDLES
// =====================
let candles = [];

// =====================
// WEBSOCKET
// =====================
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => {
    console.log("WebSocket Connected");
};

// =====================
// HANDLE DATA
// EXPECTS:
// {
//   time, open, high, low, close
// }
// =====================
ws.onmessage = (event) => {

    try {
        const d = JSON.parse(event.data);

        const candle = {
            time: Number(d.time),
            open: Number(d.open),
            high: Number(d.high),
            low: Number(d.low),
            close: Number(d.close)
        };

        candles.push(candle);

        // update chart
        candleSeries.setData(candles);

    } catch (err) {
        console.log("Invalid data:", event.data);
    }
};

// =====================
// RESIZE HANDLING
// =====================
window.addEventListener('resize', () => {
    chart.applyOptions({
        width: window.innerWidth,
        height: window.innerHeight
    });
});

</script>

</body>
</html>
