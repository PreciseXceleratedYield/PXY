<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Mode Terminal</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #1e1e1e;
}

/* Terminal container */
#terminal {
    width: 100%;
    height: 100vh;
}

/* Cursor + selection styling */
.xterm .xterm-cursor {
    border-left: 2px solid #f0e0b0 !important;
    animation: none !important;
}

.xterm .xterm-selection {
    background: rgba(224, 216, 192, 0.2) !important;
}
</style>
</head>

<body>

<div id="terminal"></div>

<!-- xterm.js -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
// =====================
// CONFIG
// =====================
const BASE_FONT = 15.3;
const SCALE = 2.6; // ✅ UPDATED TO 2.7x
const FONT_SIZE = Math.round(BASE_FONT * SCALE); // ≈ 43px

// =====================
// TERMINAL INIT
// =====================
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "'DejaVu Sans Mono', 'Ubuntu Mono', monospace",
    fontSize: FONT_SIZE,
    cursorBlink: false,
    theme: {
        background: '#1e1e1e',
        foreground: '#e0d8c0',
        cursor: '#f0e0b0',
        selection: 'rgba(224, 216, 192, 0.2)'
    },
    rendererType: 'dom'
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

// =====================
// START TERMINAL
// =====================
term.open(document.getElementById('terminal'));
fitAddon.fit();

// TEST OUTPUT
term.writeln("✅ Terminal Ready");
term.writeln("Font size: " + FONT_SIZE + "px (2.7x)");
term.writeln("-----------------------------------");

// =====================
// WEBSOCKET
// =====================
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => {
    term.writeln("✅ WebSocket Connected");
};

ws.onmessage = (event) => {
    term.write(event.data);
};

ws.onerror = () => {
    term.writeln("❌ WebSocket Error");
};

// =====================
// RESIZE HANDLING
// =====================
window.addEventListener('resize', () => {
    fitAddon.fit();
});
</script>

</body>
</html>
