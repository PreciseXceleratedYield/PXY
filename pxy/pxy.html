<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background-color: #1e1e1e;
    color: #fff;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #555;
    height: 100%;
    background-color: #1e1e1e;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

#chart-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background-color: #1e1e1e;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="niftyChart"></canvas>
    </div>
</div>

<!-- xterm.js and FitAddon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: { background: '#1e1e1e', foreground: '#ffffff' }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
term.writeln('Connected. Terminal ready...');

// Chart.js setup
const ctx = document.getElementById('niftyChart').getContext('2d');
const niftyChart = new Chart(ctx, {
    type: 'line',
    data: {
        datasets: [{
            label: 'NIFTY Close',
            data: [],
            borderColor: '#00FF00',
            backgroundColor: 'rgba(0,255,0,0.2)',
            pointRadius: 0,
            borderWidth: 2,
            tension: 0.2
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
            legend: { labels: { color: '#ffffff' } }
        },
        scales: {
            x: { 
                type: 'time',
                time: { unit: 'minute' },
                ticks: { color: '#ffffff' },
                grid: { color: '#555' }
            },
            y: {
                ticks: { color: '#ffffff' },
                grid: { color: '#555' }
            }
        }
    }
});

// WebSocket connection
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => {
    try {
        const obj = JSON.parse(event.data);
        if(obj.chart){
            // Update chart
            const dataset = niftyChart.data.datasets[0];
            dataset.data = obj.chart.map(p => ({ x: new Date(p.time * 1000), y: p.close }));
            niftyChart.update('none');
        } else {
            // Terminal data
            term.write(event.data);
            term.scrollToBottom();
        }
    } catch(e){
        term.write(event.data);
        term.scrollToBottom();
    }
};

window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
