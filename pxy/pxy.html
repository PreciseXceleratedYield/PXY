<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal + Chart Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    background: #ffffff;
    overflow: hidden;
    font-family: monospace;
}

/* LEFT TERMINAL */
#terminal {
    width: 50%;
    height: 100vh;
    border-right: 1px solid #ddd;
}

/* RIGHT CHART */
#chart {
    width: 50%;
    height: 100vh;
    padding: 10px;
    box-sizing: border-box;
}

canvas {
    width: 100% !important;
    height: 95vh !important;
}

/* terminal cursor fix */
.xterm .xterm-cursor {
    border-left: 2px solid #111 !important;
    animation: none !important;
}
</style>
</head>

<body>

<!-- LEFT: TERMINAL -->
<div id="terminal"></div>

<!-- RIGHT: CHART -->
<div id="chart">
    <h3>📊 Close Price (Last 42)</h3>
    <canvas id="priceChart"></canvas>
</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================
   TERMINAL SETUP
   ========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "'Cascadia Mono', monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: '#ffffff',
        foreground: '#111'
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));
fitAddon.fit();

term.writeln("✅ Terminal Ready");
term.writeln("-----------------------------------");

/* =========================
   WEBSOCKET (pxy.js)
   ========================= */
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onmessage = (event) => {
    term.write(event.data);
};

/* =========================
   CHART LOGIC
   ========================= */
let chartInstance = null;

async function loadChart() {
    try {
        const res = await fetch("/sys/syschrtpxy.json");

        if (!res.ok) {
            console.log("JSON not reachable");
            return;
        }

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) return;

        const labels = data.map((_, i) => i + 1);
        const closes = data.map(d => Number(d.close));

        renderChart(labels, closes);

    } catch (err) {
        console.error("Chart error:", err);
    }
}

function renderChart(labels, data) {
    const ctx = document.getElementById("priceChart").getContext("2d");

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Close",
                data: data,
                borderColor: "#1565c0",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { display: false },
                y: { display: true }
            }
        }
    });
}

/* =========================
   AUTO REFRESH
   ========================= */
loadChart();
setInterval(loadChart, 3000);

/* =========================
   RESIZE FIX
   ========================= */
window.addEventListener('resize', () => fitAddon.fit());

</script>

</body>
</html>
