<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eye-Friendly Terminal</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Fira Code', monospace; /* smooth monospace font */
    background: #002b36; /* Solarized Dark background */
    color: #839496; /* off-white text */
}

#terminal-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #002b36; /* match background */
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.5; /* more spacing for readability */
}

.xterm {
    height: 100% !important;
    font-weight: normal;
}

/* cursor and selection customization */
.xterm .xterm-cursor {
    border-left: 2px solid #93a1a1 !important; /* soft cursor */
    animation: none !important; /* disable blinking for less eye strain */
}

.xterm .xterm-selection {
    background: rgba(131, 148, 150, 0.2) !important; /* subtle selection */
}
</style>
</head>
<body>

<div id="terminal-container">
    <div id="terminal"></div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#002b36', // Solarized Dark background
        foreground: '#839496', // off-white text
        cursor: '#93a1a1',     // soft gray cursor
        selection: 'rgba(131, 148, 150, 0.2)' // subtle selection
    },
    cursorBlink: false
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

// Fit terminal to container
fitAddon.fit();

// Example text to test
term.writeln('Connected. Displaying npxy tmux session...');
term.writeln('Eye-friendly Solarized Dark terminal ready.');

// WebSocket example
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

// Re-fit on window resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
