<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    font-family: monospace;
    background: #ffffff;
    color: #111;
}

/* ===================== */
/* LEFT TERMINAL (54% approx) */
/* ===================== */
#terminal {
    width: 54%;
    height: 100vh;
    border-right: 1px solid #e5e5e5;
    background: #ffffff;
}

/* ===================== */
/* RIGHT CHART */
/* ===================== */
#right {
    width: 46%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

/* remove header look */
#title {
    display: none;
}

#status {
    display: none;
}

#chartWrap {
    flex: 1;
    padding: 10px;
}

/* chart clean theme */
canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<!-- LEFT TERMINAL -->
<div id="terminal"></div>

<!-- RIGHT CHART -->
<div id="right">
    <div id="chartWrap">
        <canvas id="priceChart"></canvas>
    </div>
</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

console.log("JS OK");

/* =====================
   TERMINAL
===================== */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));
fitAddon.fit();

term.writeln("TERMINAL OK");

/* =====================
   WEBSOCKET
===================== */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =====================
   CHART
===================== */
let chart;

async function load() {
    try {
        const res = await fetch("./syschrtpxy.json");
        const data = await res.json();

        const closes = data.map(d => Number(d.close));
        draw(closes);

    } catch (err) {
        console.error(err);
    }
}

function draw(data) {
    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [{
                data: data,
                borderColor: "#1f77b4",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: {
                    ticks: {
                        color: "#333"
                    },
                    grid: {
                        color: "#eee"
                    }
                },
                y: {
                    position: "right",   // ✅ MOVE Y AXIS RIGHT
                    ticks: {
                        color: "#333"
                    },
                    grid: {
                        color: "#eee"
                    }
                }
            }
        }
    });
}

/* ===================== */
load();
setInterval(load, 3000);

</script>

</body>
</html>
