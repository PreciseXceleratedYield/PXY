<!-- Right: TradingView NIFTY Chart Widget -->
<div id="chart-container" style="flex:1; height:100%; width:100%;">
  <div class="tradingview-widget-container" style="height:100%; width:100%;">
    <div id="tradingview_nifty" style="height:100%; width:100%;"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      new TradingView.widget({
        "container_id": "tradingview_nifty",
        "autosize": true,
        "symbol": "NSE:NIFTY50",      // NIFTY index
        "interval": "60",
        "timezone": "Asia/Kolkata",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#333",
        "enable_publishing": false,
        "allow_symbol_change": true,   // true lets users search/switch
        "studies": ["MACD@tv-basicstudies","RSI@tv-basicstudies"]
      });
    </script>
  </div>
</div>
