<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Fix</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #1e1e1e;
}

#terminal {
    width: 100%;
    height: 100vh;
}
</style>
</head>
<body>

<div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const BASE = 16;
const SCALE = 2.3;
const FONT = Math.round(BASE * SCALE); // 37px

const term = new Terminal({
    fontSize: FONT,   // ✅ FORCE 2.3x ALWAYS
    theme: {
        background: '#1e1e1e',
        foreground: '#e0d8c0'
    },
    cursorBlink: false
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));
fitAddon.fit();

// ✅ TEST OUTPUT (IMPORTANT)
term.writeln("✅ Terminal Loaded");
term.writeln("Font size: " + FONT + "px");
term.writeln("--------------------------------");

// WebSocket
const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${location.host}`);

ws.onopen = () => {
    term.writeln("✅ WebSocket Connected");
};

ws.onmessage = (e) => {
    term.write(e.data);
};

ws.onerror = () => {
    term.writeln("❌ WebSocket Error");
};

// Resize fix
window.addEventListener('resize', () => {
    fitAddon.fit();
});
</script>

</body>
</html>
