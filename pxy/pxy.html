<script>

/* =========================
   DEVICE DETECTION (FIXED)
========================= */
function isMobile() {
    return window.innerWidth <= 768;
}

/* =========================
   TERMINAL
========================= */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false,
    theme: {
        background: "#ffffff",
        foreground: "#111111"
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

setTimeout(() => fitAddon.fit(), 50);
window.addEventListener("resize", () => fitAddon.fit());

term.writeln("TERMINAL OK");

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = (e) => term.write(e.data);

/* =========================
   DRAG SPLIT (DESKTOP ONLY)
========================= */
const divider = document.getElementById("divider");
const terminal = document.getElementById("terminal");
const right = document.getElementById("right");

let dragging = false;

divider.addEventListener("mousedown", () => dragging = true);

window.addEventListener("mouseup", () => {
    dragging = false;
    saveLayout();
});

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    if (isMobile()) return;

    const p = (e.clientX / window.innerWidth) * 100;
    if (p < 10 || p > 80) return;

    terminal.style.width = p + "%";
    right.style.width = (100 - p) + "%";

    fitAddon.fit();
});

/* =========================
   LAYOUT SAVE / LOAD
========================= */
function saveLayout() {
    localStorage.setItem("split", terminal.style.width);
}

function loadLayout() {
    const saved = localStorage.getItem("split");

    if (saved && !isMobile()) {
        terminal.style.width = saved;
        right.style.width = (100 - parseFloat(saved)) + "%";
    }
}

/* =========================
   FULLSCREEN
========================= */
function toggleTerminal() {
    document.body.classList.toggle("fullscreen-terminal");
}

function toggleChart() {
    document.body.classList.toggle("fullscreen-chart");
}

function resetLayout() {
    terminal.style.width = "35%";
    right.style.width = "65%";
    localStorage.removeItem("split");
}

/* =========================
   CHART STATE
========================= */
let chart = null;
let loaded = false;

/* =========================
   MOBILE MODE KILL SWITCH
========================= */
function applyMode() {

    if (isMobile()) {

        document.getElementById("right").style.display = "none";
        document.getElementById("divider").style.display = "none";
        document.getElementById("terminal").style.width = "100%";

        // destroy chart if exists
        if (chart) {
            chart.destroy();
            chart = null;
        }

        return;
    }

    document.getElementById("right").style.display = "flex";
    document.getElementById("divider").style.display = "block";
}

/* =========================
   LOAD DATA (SAFE)
========================= */
async function load() {

    // 🚫 HARD BLOCK MOBILE
    if (isMobile()) return;

    const res = await fetch("./syschrtpxy.json");
    const data = await res.json();

    const closes = data.map(d => d.close);
    const stVals = data.map(d => d.st);
    const stTrend = data.map(d => d.st_trend);

    draw(closes, stVals, stTrend);
}

/* =========================
   DRAW CHART
========================= */
function draw(closes, stVals, stTrend) {

    if (isMobile()) return;

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    const pad = 3;

    const labels = [...closes.map((_, i) => i), ...Array(pad).fill("")];
    const closePad = [...closes, ...Array(pad).fill(null)];
    const stPad = [...stVals, ...Array(pad).fill(null)];
    const trendPad = [...stTrend, ...Array(pad).fill("UP")];

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels,

            datasets: [

                {
                    label: "Close",
                    data: closePad,
                    borderColor: "#1f77b4",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.25
                },

                {
                    label: "SuperTrend",
                    data: stPad,
                    showLine: false,

                    pointRadius: 2,
                    pointBorderWidth: 2,

                    pointBackgroundColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    ),

                    pointBorderColor: trendPad.map(t =>
                        t === "UP" ? "#00c853" : "#ff1744"
                    )
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: { display: false }
            },

            scales: {
                x: {
                    ticks: { color: "#333" },
                    grid: { color: "#eee" },
                    offset: true
                },
                y: {
                    position: "right",
                    ticks: { color: "#333" },
                    grid: { color: "#eee" }
                }
            }
        }
    });
}

/* =========================
   INIT
========================= */
loadLayout();
applyMode();
load();
setInterval(load, 3000);

/* re-check on resize */
window.addEventListener("resize", () => {
    applyMode();

    if (!isMobile()) {
        load();
    }
});

</script>
