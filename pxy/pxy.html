<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Fira Code', monospace;
    background: #1e1e1e; /* dark background */
    color: #e0d8c0;
}

#container {
    display: flex;
    flex-direction: row;
    height: 100vh;
    width: 100%;
}

/* Terminal panel */
#terminal-container {
    width: calc(46ch + 16px); /* 46 characters width */
    min-width: 46ch;
    background-color: #1e1e1e;
    overflow: hidden; /* hide scrollbar */
    display: flex;
    flex-direction: column;
}

/* Terminal itself */
#terminal {
    flex: 1;
    overflow-y: hidden; /* no scrollbar */
    font-size: 16px;
    line-height: 1.4;
}

/* Chart panel */
#chart-container {
    flex: 1; 
    background-color: #252525;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#chart {
    width: 100%;
    height: 100%;
}

/* Optional: remove scrollbar in webkit browsers */
#terminal::-webkit-scrollbar {
    display: none;
}
</style>
