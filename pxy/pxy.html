<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background-color: #111; /* dark background */
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: 55ch; /* 50 characters wide */
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #000; /* thin black separator */
    height: 100%;
    background-color: #111; /* dark background */
}

#terminal {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    font-size: 16px;
    line-height: 1.4;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
    background-color: #111 !important;
    color: #fff !important;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
}

iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #00B4FF;
    background-color: #111;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#111',
        foreground: '#fff'
    }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

// ---------------- Terminal WebSocket ----------------
let lastLines = 0;
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('Connected. Terminal ready...');
ws.onmessage = (event) => {
    const lines = event.data.split("\n");
    const newLines = lines.slice(lastLines);
    newLines.forEach(l => term.writeln(l));
    lastLines = lines.length;
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

// ---------------- Chart ----------------
const ctx = document.getElementById('chartCanvas').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Close',
            data: [],
            borderColor: '#fff',
            backgroundColor: 'rgba(255,255,255,0.1)',
            tension: 0.1,
            pointRadius: 0
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
            x: { 
                ticks: { color: '#fff' }, 
                grid: { color: '#333' } 
            },
            y: { 
                ticks: { color: '#fff' }, 
                grid: { color: '#333' } 
            }
        },
        interaction: { intersect: false, mode: 'index' }
    }
});

async function updateChart() {
    try {
        const res = await fetch('/sys/line_data.csv?' + Date.now());
        const text = await res.text();
        const rows = text.trim().split("\n").slice(1);
        const labels = [];
        const data = [];
        rows.forEach(r => {
            const [time, close] = r.split(",");
            labels.push(new Date(Number(time)*1000).toLocaleTimeString());
            data.push(Number(close));
        });
        chart.data.labels = labels;
        chart.data.datasets[0].data = data;
        chart.update();
    } catch(err) {
        console.error('Chart update error:', err);
    }
}
updateChart();
setInterval(updateChart, 3000);

// Re-fit terminal on resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
