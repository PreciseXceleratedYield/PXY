<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>npxy Live Session</title>

<!-- xterm.css -->
<link rel="stylesheet" href="/xterm/css/xterm.css" />

<style>
body { margin:0; background:#1e1e1e; color:#c5c5c5; font-family: monospace; }
#terminal { width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="terminal"></div>

<!-- xterm.js -->
<script src="/xterm/lib/xterm.js"></script>
<script>
const term = new Terminal({ convertEol:true, scrollback:1000 });
term.open(document.getElementById('terminal'));

const ws = new WebSocket(`ws://${window.location.host}`);

ws.onopen = () => term.writeln('Connected. Displaying npxy session output...\n');

ws.onmessage = (event) => {
    term.write(event.data);
};

ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);
</script>
</body>
</html>
