<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + TradingView</title>

<link rel="stylesheet" href="/xterm/css/xterm.css" />

<style>
html, body { margin:0; padding:0; height:100%; width:100%; font-family:monospace; background:#1e1e1e; color:#c5c5c5; }
#container { display:flex; height:100%; width:100%; }
#terminal-container {
    width:55ch; max-width:50%; min-width:300px;
    border-right:2px solid #444; display:flex; flex-direction:column;
}
#terminal { flex:1; }
#tradingview-container { flex:1; background:#fff; }
iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body>
<div id="container">
    <div id="terminal-container">
        <div id="terminal">Connecting to npxy tmux session...</div>
    </div>
    <div id="tradingview-container">
        <iframe src="https://www.tradingview.com/embed/?user=kcbppc@gmail.com"></iframe>
    </div>
</div>

<script src="/xterm/lib/xterm.js"></script>
<script>
const term = new Terminal({ convertEol:true, scrollback:1000 });
term.open(document.getElementById('terminal'));

const ws = new WebSocket(`ws://${window.location.host}`);

ws.onopen = () => term.writeln('Connected. Displaying npxy tmux session...\n');

ws.onmessage = (event) => term.write(event.data);

ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);
</script>
</body>
</html>
