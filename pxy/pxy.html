<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIFTY Terminal + Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background-color: #1e1e1e;
    color: #fff;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #444;
    height: 100%;
    background-color: #1e1e1e;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    font-size: 16px;
    line-height: 1.4;
    color: #fff;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
    background-color: #1e1e1e;
}

canvas {
    width: 100% !important;
    height: 100% !important;
    background-color: #1e1e1e;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="lineChart"></canvas>
    </div>
</div>

<!-- xterm.js and Fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#1e1e1e',
        foreground: '#ffffff'
    }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
term.writeln('Connected. Terminal ready...');

// Chart.js setup
const ctx = document.getElementById('lineChart').getContext('2d');
let lineChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Close Price',
            data: [],
            borderColor: '#ffffff',
            backgroundColor: 'rgba(255,255,255,0.1)',
            pointRadius: 0,
            borderWidth: 2,
            tension: 0.2
        }]
    },
    options: {
        responsive: true,
        animation: false,
        scales: {
            x: { 
                grid: { color: '#333' },
                ticks: { color: '#fff' }
            },
            y: { 
                grid: { color: '#333' },
                ticks: { color: '#fff' }
            }
        },
        plugins: {
            legend: { labels: { color: '#fff' } }
        }
    }
});

// Fetch CSV data and update chart + terminal
async function updateData() {
    try {
        const res = await fetch('sys/line_data.csv');
        const text = await res.text();
        const lines = text.trim().split('\n');
        const labels = [];
        const data = [];
        let latestSignal = '';

        lines.forEach((line, idx) => {
            if(idx === 0) return; // skip header
            const [timestamp, close, signal] = line.split(',');
            labels.push(new Date(parseInt(timestamp)*1000).toLocaleTimeString());
            data.push(parseFloat(close));
            latestSignal = signal; // keep last signal
        });

        lineChart.data.labels = labels;
        lineChart.data.datasets[0].data = data;
        lineChart.update();

        // Update terminal
        term.write(`\r\nLatest Close: ${data[data.length-1]} | Signal: ${latestSignal}`);
        term.scrollToBottom();

    } catch(e) {
        console.error('Error fetching CSV:', e);
        term.write('\r\nError fetching CSV.');
    }
}

// Initial update
updateData();

// Auto-update every 10 seconds
setInterval(updateData, 10000);

// Refit terminal on window resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
