<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #1e1e1e;
    color: #c5c5c5;
}
#container {
    display: flex;
    height: 100vh; /* full browser height */
    width: 100%;
}
#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #444;
    height: 100%;
}
#terminal {
    flex: 1;
    overflow-y: auto;
}
#chart-container {
    flex: 1;
    height: 100%;
    width: 100%;
}
iframe {
    border: none;
}
</style>
</head>
<body>

<div id="container">
    <!-- Left: Terminal -->
    <div id="terminal-container">
        <div id="terminal">Connecting to npxy tmux session...</div>
    </div>

    <!-- Right: Nifty50.Live NIFTY Chart -->
    <div id="chart-container">
        <iframe 
            src="https://tvc4.forexpros.com/init.php?family_prefix=tvc4&pair_ID=17940&interval=60&width=1150&height=650&lang_ID=1&timezone_ID=20"
            style="background-color: white; border: solid 1px #00B4FF; padding-top: 8px;"
            width="100%" 
            height="100%">
        </iframe>
    </div>
</div>

<!-- xterm.js JS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script>
const term = new Terminal({ convertEol: true, scrollback: 1000 });
term.open(document.getElementById('terminal'));

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('Connected. Displaying npxy tmux session...\n');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);
</script>

</body>
</html>
