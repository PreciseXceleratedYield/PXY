<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal Only</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #f0f0f0;
}

#terminal-container {
    width: 100%;
    height: 100vh; /* full viewport height */
    display: flex;
    flex-direction: column;
    background-color: #ffffff;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.4;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="terminal-container">
    <div id="terminal"></div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#ffffff',
        foreground: '#222222'
    }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

// Fit terminal to container
fitAddon.fit();

// Example text to test
term.writeln('Connected. Displaying npxy tmux session...');
term.writeln('Terminal ready.');

// WebSocket example
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

// Re-fit on window resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
