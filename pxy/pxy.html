<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PXy Dashboard</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Fira Code', monospace;
    background: #1e1e1e;
    color: #e0d8c0;
}

#container {
    display: flex;
    flex-direction: row;
    height: 100vh;
    width: 100%;
}

/* Terminal panel */
#terminal-container {
    width: calc(49ch + 16px); /* 49 chars wide */
    min-width: 49ch;
    background-color: #1e1e1e;
    display: flex;
    flex-direction: column;
}

/* Terminal itself */
#terminal {
    flex: 1;
    overflow-y: scroll; 
    font-size: 16px;
    line-height: 1.4;
    padding-left: 7ch; /* shift all lines 7 spaces */
    scrollbar-width: thin; 
    scrollbar-color: #1e1e1e #1e1e1e; 
}

/* Webkit browsers (Chrome/Safari/Edge) */
#terminal::-webkit-scrollbar {
    width: 8px; 
}

#terminal::-webkit-scrollbar-thumb {
    background-color: #1e1e1e; 
    border-radius: 4px;
}

#terminal::-webkit-scrollbar-track {
    background-color: #1e1e1e;
}

/* Chart panel */
#chart-container {
    flex: 1;
    background-color: #1e1e1e; /* same as terminal */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#chart {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>
    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// === Terminal Setup ===
const term = new Terminal({
    convertEol: true,
    scrollback: 2000,
    theme: {
        background: '#1e1e1e',
        foreground: '#e0d8c0',
        cursor: '#f0e0b0'
    },
    cursorBlink: false
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

// Initial lines
term.writeln('       Connected. PXy terminal ready.');
term.writeln('       Width fixed at 49 chars.');

// WebSocket stream
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);
ws.onmessage = (event) => {
    const lines = event.data.split('\n').map(l => '       ' + l).join('\n');
    term.write(lines);
    term.scrollToBottom();
};

// Re-fit terminal on resize
window.addEventListener('resize', () => fitAddon.fit());

// === Chart Setup ===
async function loadChartData() {
    const resp = await fetch('/sys/market_data.csv');
    const text = await resp.text();
    const rows = text.split('\n').slice(1).filter(r => r);

    const labels = [];
    const data = [];

    rows.forEach(row => {
        const cols = row.split(',');
        labels.push(cols[0].slice(11,16)); // hh:mm
        data.push(parseFloat(cols[4])); // Close price
    });

    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Price',
                data: data,
                borderColor: '#00ff99',
                backgroundColor: 'rgba(0,255,153,0.1)',
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { 
                    display: true,
                    title: { display: true, text: 'Time', color: '#e0d8c0' },
                    ticks: { color: '#e0d8c0' }
                },
                y: { 
                    display: true,
                    title: { display: true, text: 'Price', color: '#e0d8c0' },
                    ticks: { color: '#e0d8c0' }
                }
            },
            plugins: { legend: { display: false } },
            layout: { padding: 0 }
        }
    });
}

loadChartData();
</script>

</body>
</html>
