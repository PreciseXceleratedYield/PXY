<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #000000; /* 🖤 AMOLED */
    color: #ffffff;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

/* LEFT TERMINAL */
#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #111; /* ultra subtle */
    height: 100%;
    background-color: #000000;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    font-size: 16px;
    line-height: 1.4;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

/* RIGHT CHART */
#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 6px; /* tighter for AMOLED */
    box-sizing: border-box;
    background: #000000;
}

iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #111;
    background: #000000;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <iframe
            src="https://s.tradingview.com/widgetembed/?symbol=NSE:BANKNIFTY&interval=5&theme=dark&style=1&locale=en&hide_top_toolbar=1&hide_legend=0&save_image=0&toolbarbg=000000&studies=[]"
            style="width:100%; height:100%; border:0;">
        </iframe>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#000000',   // 🖤 AMOLED
        foreground: '#ffffff',
        cursor: '#00ffcc',       // neon cursor
        selection: '#222222',

        black: '#000000',
        red: '#ff4d4d',
        green: '#00ff88',
        yellow: '#ffff66',
        blue: '#4da6ff',
        magenta: '#ff66ff',
        cyan: '#00ffff',
        white: '#ffffff'
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

fitAddon.fit();

term.writeln('Connected. AMOLED mode active...');
term.writeln('Terminal ready.');

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
