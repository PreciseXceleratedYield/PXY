<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PX DEBUG MODE</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    font-family: monospace;
}

#terminal {
    width: 50%;
    height: 100vh;
    border-right: 1px solid #ddd;
}

#right {
    width: 50%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#title {
    padding: 10px;
    font-weight: bold;
    background: #f3f3f3;
}

#status {
    padding: 5px 10px;
    font-size: 12px;
    color: blue;
}

#chartBox {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
    background: #fafafa;
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="right">
    <div id="title">📊 Close Price (Last 42)</div>
    <div id="status">INIT...</div>
    <div id="chartBox">
        <canvas id="priceChart"></canvas>
    </div>
</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

console.log("🔥 SCRIPT LOADED");

document.getElementById("status").innerText = "SCRIPT LOADED";

// =====================
// TERMINAL
// =====================
try {
    const term = new Terminal({
        convertEol: true,
        scrollback: 1000,
        fontSize: 14
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    term.writeln("TERMINAL OK");
    document.getElementById("status").innerText = "TERMINAL OK";

} catch (e) {
    console.error("TERMINAL ERROR", e);
    document.getElementById("status").innerText = "TERMINAL FAIL";
}

// =====================
// TEST FETCH
// =====================
async function testFetch() {
    try {
        console.log("FETCH START");

        const res = await fetch("/sys/syschrtpxy.json");

        console.log("STATUS:", res.status);

        const data = await res.json();

        console.log("DATA:", data.length);

        document.getElementById("status").innerText =
            "DATA LOADED: " + data.length;

        draw(data.map(d => d.close));

    } catch (e) {
        console.error("FETCH ERROR", e);
        document.getElementById("status").innerText = "FETCH FAIL";
    }
}

// =====================
// DRAW CHART
// =====================
let chart;

function draw(data) {
    console.log("DRAW CALLED");

    const ctx = document.getElementById("priceChart");

    if (!ctx) {
        console.error("NO CANVAS");
        return;
    }

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [{
                label: "Close",
                data,
                borderColor: "blue",
                pointRadius: 0
            }]
        }
    });

    document.getElementById("status").innerText = "CHART RENDERED";
}

// =====================
testFetch();

setInterval(testFetch, 3000);

</script>

</body>
</html>
