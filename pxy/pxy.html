<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PXy Dashboard</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Fira Code', monospace;
    background: #1e1e1e; /* dark background */
    color: #e0d8c0;
}

/* Container for terminal + chart */
#container {
    display: flex;
    flex-direction: row;
    height: 100vh; /* full viewport height */
    width: 100%;
}

/* Terminal panel */
#terminal-container {
    width: calc(48ch + 16px); /* 52 characters + scrollbar padding */
    min-width: 48ch;
    background-color: #1e1e1e;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Terminal itself */
#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.4;
}

/* Chart panel */
#chart-container {
    flex: 1; /* fill remaining width */
    background-color: #252525;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Canvas fills the container */
#chart {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>
    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// === Terminal Setup ===
const term = new Terminal({
    convertEol: true,
    scrollback: 2000,
    theme: {
        background: '#1e1e1e',
        foreground: '#e0d8c0',
        cursor: '#f0e0b0'
    },
    cursorBlink: false
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

term.writeln('Connected. PXy terminal ready.');
term.writeln('Width fixed at 52 chars.');

// Example WebSocket stream (update with your server)
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);
ws.onmessage = (event) => {
    term.write(event.data);
    term.scrollToBottom();
};

// Re-fit terminal on resize
window.addEventListener('resize', () => fitAddon.fit());

// === Chart Setup ===
async function loadChartData() {
    // fetch CSV from sys folder
    const resp = await fetch('/sys/market_data.csv');
    const text = await resp.text();
    const rows = text.split('\n').slice(1).filter(r => r);
    
    const labels = [];
    const data = [];
    
    rows.forEach(row => {
        const cols = row.split(',');
        labels.push(cols[0].slice(11,16)); // hh:mm
        data.push(parseFloat(cols[4])); // Close price
    });

    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Price',
                data: data,
                borderColor: '#00ff99',
                backgroundColor: 'rgba(0,255,153,0.1)',
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { 
                    display: true,
                    title: { display: true, text: 'Time', color: '#e0d8c0' },
                    ticks: { color: '#e0d8c0' }
                },
                y: { 
                    display: true,
                    title: { display: true, text: 'Price', color: '#e0d8c0' },
                    ticks: { color: '#e0d8c0' }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
}

loadChartData();
</script>

</body>
</html>
