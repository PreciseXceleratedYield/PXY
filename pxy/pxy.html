<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Mode Terminal</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'DejaVu Sans Mono', 'Ubuntu Mono', 'Noto Color Emoji', monospace;
    background: #1e1e1e;
    color: #e0d8c0;
}

#terminal-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 38px;       /* scaled 2.35x */
    line-height: 1.5;
}

.xterm {
    height: 100% !important;
    font-weight: normal;
    font-size: 38px !important;  /* ensure xterm respects larger size */
}

.xterm .xterm-cursor {
    border-left: 4px solid #f0e0b0 !important; /* thicker cursor for 38px */
    animation: none !important;
}

.xterm .xterm-selection {
    background: rgba(224, 216, 192, 0.2) !important;
}
</style>
</head>
<body>

<div id="terminal-container">
    <div id="terminal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "'DejaVu Sans Mono', 'Ubuntu Mono', 'Noto Color Emoji', monospace",
    fontSize: 38,          // scaled 2.35x
    cursorBlink: false,
    theme: {
        background: '#1e1e1e',
        foreground: '#e0d8c0',
        cursor: '#f0e0b0',
        selection: 'rgba(224, 216, 192, 0.2)'
    },
    rendererType: 'dom',             
    padding: { top: 0, right: 0, bottom: 0, left: 2 }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => {
    term.writeln('WebSocket connected. Awaiting terminal output...');
};

ws.onmessage = (event) => {
    term.write(event.data);
    term.scrollToBottom();
};

ws.onerror = (err) => {
    term.writeln(`\nWebSocket error: ${err}`);
};

window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
