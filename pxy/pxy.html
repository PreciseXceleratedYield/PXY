<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #0f1117;
    color: #e6edf3;
    font-family: monospace;
}

#container {
    display: flex;
    height: 100vh;
}

/* TERMINAL */
#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    border-right: 1px solid #1f2937;
    background: #0d1117;
}

#terminal {
    height: 100%;
}

.xterm {
    height: 100% !important;
}

/* CHART */
#chart-container {
    flex: 1;
    padding: 10px;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>

<!-- xterm -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<!-- chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// ================= TERMINAL =================
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#0d1117',
        foreground: '#00ff9c',
        cursor: '#00ff9c'
    }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('🚀 Connected...');
ws.onmessage = (event) => {
    term.write(event.data);
    term.scrollToBottom();
};
ws.onerror = (err) => term.writeln('\n❌ WS error');

window.addEventListener('resize', () => fitAddon.fit());


// ================= CHART =================
const ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'NIFTY',
                data: [],
                borderColor: '#ffffff',
                borderWidth: 2,
                tension: 0.25,
                pointRadius: 0
            },
            {
                label: 'BUY',
                data: [],
                pointBackgroundColor: '#00ff00',
                pointRadius: 6,
                showLine: false
            },
            {
                label: 'SELL',
                data: [],
                pointBackgroundColor: '#ff3b3b',
                pointRadius: 6,
                showLine: false
            }
        ]
    },
    options: {
        responsive: true,
        animation: false,
        plugins: {
            legend: {
                labels: { color: '#e6edf3' }
            }
        },
        scales: {
            x: {
                ticks: { color: '#9ca3af' },
                grid: { color: '#1a1f2b' }
            },
            y: {
                ticks: { color: '#9ca3af' },
                grid: { color: '#1a1f2b' }
            }
        }
    }
});


// ================= LIVE UPDATE =================
async function updateChart() {
    try {
        const res = await fetch('/line_data.csv?' + Date.now());
        const text = await res.text();

        const rows = text.trim().split('\n').slice(1);

        const labels = [];
        const prices = [];
        const buyData = [];
        const sellData = [];

        let lastBuyIndex = -1;
        let lastSellIndex = -1;

        rows.forEach((row, i) => {
            const parts = row.split(',');

            const ts = parts[0];
            const close = parts[1];
            const entry = parts[2] || "";

            const d = new Date(ts * 1000);
            const time = d.toLocaleTimeString();

            const price = parseFloat(close);

            labels.push(time);
            prices.push(price);

            buyData.push(null);
            sellData.push(null);

            if (entry.includes("BUY")) lastBuyIndex = i;
            if (entry.includes("SELL")) lastSellIndex = i;
        });

        // Only latest markers
        if (lastBuyIndex !== -1) {
            buyData[lastBuyIndex] = prices[lastBuyIndex];
        }

        if (lastSellIndex !== -1) {
            sellData[lastSellIndex] = prices[lastSellIndex];
        }

        chart.data.labels = labels;
        chart.data.datasets[0].data = prices;
        chart.data.datasets[1].data = buyData;
        chart.data.datasets[2].data = sellData;

        chart.update();

    } catch (e) {
        console.log("Chart error:", e);
    }
}

setInterval(updateChart, 1000);
</script>

</body>
</html>
