<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Line Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background-color: #1e1e1e;
    color: #ffffff;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #444;
    height: 100%;
    background-color: #1e1e1e;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    font-size: 16px;
    line-height: 1.4;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
    background-color: #1e1e1e;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="lineChart"></canvas>
    </div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#1e1e1e',
        foreground: '#ffffff'
    }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
term.writeln('Connected. Displaying latest NIFTY signals...');

// ---------------- Chart.js ----------------
const ctx = document.getElementById('lineChart').getContext('2d');
let lineChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Close Price',
            data: [],
            borderColor: '#00ffea',
            backgroundColor: 'rgba(0,255,234,0.2)',
            fill: false,
            tension: 0.1,
            pointRadius: 2,
            pointHoverRadius: 4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            x: {
                ticks: { color: '#ffffff' },
                grid: { color: '#444' }
            },
            y: {
                ticks: { color: '#ffffff' },
                grid: { color: '#444' }
            }
        },
        plugins: {
            legend: { labels: { color: '#ffffff' } }
        }
    }
});

// ---------------- Load CSV and update ----------------
async function loadCSV() {
    try {
        const res = await fetch('sys/line_data.csv?_=' + new Date().getTime());
        const text = await res.text();
        const lines = text.trim().split('\n');
        const labels = [];
        const data = [];

        // Assuming CSV header: timestamp,close,...
        for (let i = 1; i < lines.length; i++) {
            const parts = lines[i].split(',');
            const ts = parseInt(parts[0]);
            const close = parseFloat(parts[1]);
            labels.push(new Date(ts * 1000).toLocaleTimeString());
            data.push(close);
        }

        lineChart.data.labels = labels;
        lineChart.data.datasets[0].data = data;
        lineChart.update();

        // Terminal: show latest signal
        const lastLine = lines[lines.length - 1].split(',');
        const lastClose = lastLine[1];
        const lastTimestamp = new Date(parseInt(lastLine[0]) * 1000).toLocaleTimeString();
        term.writeln(`Latest Close: ${lastClose} @ ${lastTimestamp}`);

    } catch (err) {
        console.error(err);
        term.writeln('Error loading CSV: ' + err);
    }
}

// Initial load + repeat every 10s
loadCSV();
setInterval(loadCSV, 10000);
</script>

</body>
</html>
