<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PXY DEBUG DASHBOARD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    font-family: monospace;
    overflow: hidden;
}

/* ===================== */
/* LEFT TERMINAL PANEL   */
/* ===================== */
#terminal {
    width: 50%;
    height: 100vh;
    border-right: 1px solid #ddd;
}

/* ===================== */
/* RIGHT CHART PANEL     */
/* ===================== */
#right {
    width: 50%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#title {
    padding: 10px;
    font-weight: bold;
    background: #f3f3f3;
}

#status {
    padding: 5px 10px;
    font-size: 12px;
    color: blue;
}

#chartWrap {
    flex: 1;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<!-- LEFT: TERMINAL -->
<div id="terminal"></div>

<!-- RIGHT: CHART -->
<div id="right">
    <div id="title">📊 Close Price (Last 42)</div>
    <div id="status">INIT...</div>
    <div id="chartWrap">
        <canvas id="priceChart"></canvas>
    </div>
</div>

<!-- ===================== -->
<!-- LIBRARIES -->
<!-- ===================== -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

console.log("JS LOADED OK");
document.getElementById("status").innerText = "JS LOADED OK";

/* =====================
   TERMINAL SETUP (UNCHANGED + STABLE)
===================== */
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "monospace",
    fontSize: 14,
    cursorBlink: false
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));
fitAddon.fit();

term.writeln("TERMINAL OK");

/* =====================
   WEBSOCKET STREAM
===================== */
const ws = new WebSocket(`ws://${location.host}`);

ws.onmessage = (e) => term.write(e.data);

/* =====================
   CHART ENGINE
===================== */
let chart;

async function load() {
    try {
        console.log("FETCH START");

        const res = await fetch("./syschrtpxy.json");

        if (!res.ok) {
            throw new Error("HTTP " + res.status);
        }

        const data = await res.json();

        console.log("DATA OK:", data.length);

        document.getElementById("status").innerText =
            "DATA LOADED: " + data.length;

        const closes = data.map(d => Number(d.close));

        draw(closes);

    } catch (err) {
        console.error(err);
        document.getElementById("status").innerText =
            "ERROR: " + err.message;
    }
}

function draw(data) {
    console.log("DRAW");

    const ctx = document.getElementById("priceChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map((_, i) => i),
            datasets: [{
                label: "Close",
                data: data,
                borderColor: "blue",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            }
        }
    });

    document.getElementById("status").innerText = "CHART RENDERED";
}

/* ===================== */
load();
setInterval(load, 3000);

</script>

</body>
</html>
