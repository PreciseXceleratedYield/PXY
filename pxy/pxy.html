<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PXy Terminal + HA Chart</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body { margin:0; height:100%; background:#1e1e1e; color:#e0d8c0; font-family:'Fira Code', monospace;}
#main { display:flex; height:100vh; }
#terminal-container { width:60%; border-right:1px solid #333; height:100%; }
#chart-container { width:40%; height:100%; padding:10px; }
canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="main">
    <div id="terminal-container"><div id="terminal"></div></div>
    <div id="chart-container"><canvas id="chart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
// ---------- TERMINAL ----------
const term = new Terminal({ convertEol:true });
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
term.writeln("PXy Terminal + Live HA Chart Ready 🚀");

const ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
ws.onmessage = e => term.write(e.data);

// ---------- CHART ----------
const ctx = document.getElementById('chart').getContext('2d');
let chart = new Chart(ctx,{
    type:'line',
    data:{ labels:[], datasets:[{ label:'HA Line', data:[], borderColor:'#00ff00', borderWidth:2, pointRadius:0 }]},
    options:{
        animation:false,
        plugins:{legend:{display:false}},
        scales:{
            x:{ticks:{color:'#aaa'}, title:{display:true, text:'Time', color:'#ccc'}},
            y:{ticks:{color:'#aaa'}, title:{display:true, text:'Price', color:'#ccc'}}
        }
    }
});

// ---------- LOAD CSV WITH 2-HR GRID ----------
async function loadData(){
    try{
        const res = await fetch('/sys/market_data.csv?t='+Date.now());
        if(!res.ok){ console.error("CSV fetch failed"); return; }
        const text = await res.text();
        const rows = text.trim().split('\n');
        const dataRows = rows[0].startsWith('Datetime') ? rows.slice(1) : rows;

        const parsed = dataRows.map(r=>{
            const cols = r.split(',');
            if(cols.length < 5) return null;
            const dt = new Date(cols[0]);
            const open=parseFloat(cols[1]), high=parseFloat(cols[2]),
                  low=parseFloat(cols[3]), close=parseFloat(cols[4]);
            if(isNaN(open)||isNaN(high)||isNaN(low)||isNaN(close)) return null;

            const ha_open = (open + high + low + close)/4;
            const ha_close = (open + close)/2;
            const ha_line = (ha_open + ha_close)/2;

            return {time: dt, value: ha_line};
        }).filter(Boolean);

        const now = new Date();
        const twoHoursAgo = new Date(now.getTime() - 2*60*60*1000);
        const timeGrid = [];
        let lastValue = parsed.length ? parsed[parsed.length-1].value : 0;

        for(let t = new Date(twoHoursAgo); t <= now; t.setMinutes(t.getMinutes()+1)){
            const found = parsed.find(d=>Math.abs(d.time - t) < 60*1000);
            if(found) lastValue = found.value;
            timeGrid.push({time: new Date(t), value: lastValue});
        }

        chart.data.labels = timeGrid.map(d=>d.time.toTimeString().substring(0,5));
        chart.data.datasets[0].data = timeGrid.map(d=>d.value);
        chart.update();

    }catch(e){ console.error("Chart load error:", e);}
}

// Auto-refresh every 3s
setInterval(loadData, 3000);
loadData();
window.addEventListener('resize',()=>fitAddon.fit());
</script>
</body>
</html>
