<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background-color: #111; /* dark background */
    color: #fff;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: 48ch; /* fixed width for terminal */
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #000; /* thin black separator */
    background-color: #111; /* dark */
}

#terminal {
    flex: 1;
    overflow-y: auto;
}

.xterm {
    height: 100% !important;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 5px;
    background-color: #111; /* dark */
}

canvas {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: { background: '#111', foreground: '#fff' },
    cols: 48
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

// ---------------- WebSocket for terminal ----------------
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('\x1b[32mConnected. Terminal ready...\x1b[0m');
ws.onmessage = (event) => {
    term.write(event.data);
    term.scrollToBottom();
};
ws.onerror = (err) => term.writeln('\x1b[31mWebSocket error: ' + err + '\x1b[0m');
window.addEventListener('resize', () => fitAddon.fit());

// ---------------- Chart.js ----------------
const ctx = document.getElementById('chartCanvas').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'NIFTY Close',
            data: [],
            borderColor: '#00ffff',
            backgroundColor: 'rgba(0,255,255,0.1)',
            pointRadius: 0,
            borderWidth: 2,
            tension: 0.2
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,  // prevents flickering
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
            x: { ticks: { color: '#fff' }, grid: { color: '#333' } },
            y: { ticks: { color: '#fff' }, grid: { color: '#333' } }
        }
    }
});

// ---------------- Fetch CSV and update chart ----------------
async function updateChart() {
    try {
        const res = await fetch('/line_data.csv?' + Date.now());
        const csv = await res.text();
        const lines = csv.trim().split('\n').slice(1); // skip header
        const labels = [];
        const data = [];
        lines.forEach(line => {
            const [time, close] = line.split(',');
            labels.push(new Date(Number(time)*1000).toLocaleTimeString());
            data.push(Number(close));
        });

        chart.data.labels = labels;
        chart.data.datasets[0].data = data;
        chart.update();
    } catch(err) {
        console.error('Chart update error:', err);
    }
}

// Initial chart update
updateChart();
// Update every 5 seconds
setInterval(updateChart, 5000);
</script>

</body>
</html>
