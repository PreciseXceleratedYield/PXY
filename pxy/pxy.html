<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Mode Terminal</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'DejaVu Sans Mono', 'Ubuntu Mono', 'Noto Color Emoji', monospace;
    background: #1e1e1e;   /* dark terminal background */
    color: #e0d8c0;         /* warm off-white text */
}

#terminal-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.5;
}

.xterm {
    height: 100% !important;
    font-weight: normal;
}

.xterm .xterm-cursor {
    border-left: 2px solid #f0e0b0 !important; /* warm cursor */
    animation: none !important;                  /* disable blinking */
}

.xterm .xterm-selection {
    background: rgba(224, 216, 192, 0.2) !important; /* subtle warm selection */
}
</style>
</head>
<body>

<div id="terminal-container">
    <div id="terminal"></div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "'DejaVu Sans Mono', 'Ubuntu Mono', 'Noto Color Emoji', monospace",
    fontSize: 16,
    theme: {
        background: '#1e1e1e',
        foreground: '#e0d8c0',
        cursor: '#f0e0b0',
        selection: 'rgba(224, 216, 192, 0.2)'
    },
    cursorBlink: false
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

// WebSocket connection to backend Python script
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => {
    term.writeln('WebSocket connected. Awaiting terminal output...');
};

ws.onmessage = (event) => {
    term.write(event.data);  // append incoming data
    term.scrollToBottom();
};

ws.onerror = (err) => {
    term.writeln(`\nWebSocket error: ${err}`);
};

// Re-fit terminal on window resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
