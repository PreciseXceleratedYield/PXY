<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #111;
    color: #fff;
}

#container {
    display: flex;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: 55ch; /* updated width */
    max-width: 55ch;
    min-width: 55ch;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #111; /* invisible separator (blends with bg) */
    height: 100%;
    background-color: #111;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.4;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
    background: #111;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="niftyChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: { background: '#111', foreground: '#fff' }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);
ws.onopen = () => term.writeln('Connected. Terminal ready...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);
window.addEventListener('resize', () => fitAddon.fit());

// ================= Chart.js setup =================
const ctx = document.getElementById('niftyChart').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'NIFTY Close',
            data: [],
            borderColor: '#00ff00',
            backgroundColor: 'rgba(0,255,0,0.1)',
            pointRadius: 0,
            tension: 0.2
        }]
    },
    options: {
        responsive: true,
        animation: false,
        plugins: { legend: { display: false } },
        scales: {
            x: { 
                grid: { color: '#333' },
                ticks: { color: '#fff' }
            },
            y: { 
                grid: { color: '#333' },
                ticks: { color: '#fff' }
            }
        }
    }
});

// ================= Fetch CSV =================
async function updateChart() {
    try {
        const res = await fetch('/sys/line_data.csv?' + Date.now());
        if(!res.ok) throw new Error('CSV fetch failed');
        const text = await res.text();
        const rows = text.trim().split("\n").slice(1);
        const labels = [];
        const data = [];
        rows.forEach(r => {
            const [time, close] = r.split(",");
            if(!time || !close) return;
            labels.push(new Date(Number(time)*1000).toLocaleTimeString());
            data.push(Number(close));
        });
        if(data.length === 0) return;
        const MAX_POINTS = 100;
        chart.data.labels = labels.slice(-MAX_POINTS);
        chart.data.datasets[0].data = data.slice(-MAX_POINTS);
        chart.update();
    } catch(err) {
        console.error('Chart update error:', err);
    }
}

setInterval(updateChart, 1000);
updateChart();
</script>

</body>
</html>
