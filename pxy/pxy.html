<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PXy Dashboard</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Fira Code', monospace;
    background: #1e1e1e;
    color: #e0d8c0;
}

#container {
    display: flex;
    flex-direction: row;
    height: 100vh;
    width: 100%;
}

#terminal-container {
    width: calc(46ch + 16px);
    min-width: 46ch;
    background-color: #1e1e1e;
    display: flex;
    flex-direction: column;
}

#terminal {
    flex: 1;
    overflow: hidden;
    font-size: 16px;
    line-height: 1.4;
}

#chart-container {
    flex: 1;
    background-color: #252525;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#chart {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>
    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// === Terminal Setup ===
const term = new Terminal({
    convertEol: true,
    scrollback: 2000,
    theme: { background: '#1e1e1e', foreground: '#e0d8c0', cursor: '#f0e0b0' },
    cursorBlink: false
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();
term.writeln('Connected. PXy terminal ready.');
term.writeln('Width fixed at 46 chars.');

// WebSocket placeholder
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);
ws.onmessage = (event) => { term.write(event.data); term.scrollToBottom(); };
window.addEventListener('resize', () => fitAddon.fit());

// === Chart Setup with missing data fill ===
async function loadChartData() {
    const resp = await fetch('/sys/market_data.csv');
    const text = await resp.text();
    const rows = text.split('\n').slice(1).filter(r => r);

    // Map CSV by datetime
    const priceMap = {};
    rows.forEach(row => {
        const cols = row.split(',');
        priceMap[cols[0]] = parseFloat(cols[4]); // Close price
    });

    const labels = [];
    const data = [];

    // Determine last available timestamp
    const allTimes = Object.keys(priceMap).sort();
    const lastTime = new Date(allTimes[allTimes.length - 1]);

    // Build last 120 minutes
    let current = new Date(lastTime.getTime() - 119*60*1000); // 119 min ago
    let lastPrice = priceMap[allTimes[0]] || 0;

    for (let i = 0; i < 120; i++) {
        const key = current.toISOString().slice(0,16).replace('T',' ');
        labels.push(current.toTimeString().slice(0,5));
        if (priceMap[key] !== undefined) lastPrice = priceMap[key];
        data.push(lastPrice);
        current = new Date(current.getTime() + 60*1000); // next minute
    }

    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Price',
                data: data,
                borderColor: '#00ff99',
                backgroundColor: 'rgba(0,255,153,0.1)',
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { ticks: { color: '#e0d8c0', maxRotation: 0 }, grid: { color: '#1e1e1e' } },
                y: { ticks: { color: '#e0d8c0' }, grid: { color: '#1e1e1e' } }
            },
            plugins: { legend: { display: false } }
        }
    });
}

loadChartData();
</script>

</body>
</html>
