<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Light/Dark Toggle</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    transition: background 0.3s ease;
}

/* THEME: DARK */
body.dark {
    background: #1e1e1e;
}

/* THEME: LIGHT */
body.light {
    background: #ffffff;
}

/* terminal */
#terminal {
    width: 100%;
    height: 100vh;
}

/* toggle button */
#toggleBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 999;
    padding: 8px 12px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
}

/* button themes */
body.dark #toggleBtn {
    background: #333;
    color: #fff;
}

body.light #toggleBtn {
    background: #eee;
    color: #111;
}
</style>
</head>

<body class="dark">

<button id="toggleBtn">Light Mode</button>

<div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
// =====================
// CONFIG
// =====================
const BASE_FONT = 15.3;
const SCALE = 1;
const FONT_SIZE = Math.round(BASE_FONT * SCALE);

// =====================
// THEME STATE
// =====================
let isDark = true;

// =====================
// TERMINAL INIT
// =====================
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    fontFamily: "'DejaVu Sans Mono', 'Ubuntu Mono', monospace",
    fontSize: FONT_SIZE,
    cursorBlink: false,
    theme: getTheme()
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

// =====================
// THEME FUNCTION
// =====================
function getTheme() {
    return isDark
        ? {
            background: '#1e1e1e',
            foreground: '#e0d8c0',
            cursor: '#f0e0b0',
            selection: 'rgba(224, 216, 192, 0.2)'
        }
        : {
            background: '#ffffff',
            foreground: '#111111',
            cursor: '#000000',
            selection: 'rgba(0, 0, 0, 0.15)'
        };
}

// =====================
// APPLY UI THEME
// =====================
function applyUITheme() {
    document.body.className = isDark ? "dark" : "light";

    const btn = document.getElementById("toggleBtn");
    btn.textContent = isDark ? "Light Mode" : "Dark Mode";

    term.setOption("theme", getTheme());
}

// =====================
// START TERMINAL
// =====================
term.open(document.getElementById('terminal'));
fitAddon.fit();

applyUITheme();

// TEST OUTPUT
term.writeln("Terminal Ready");
term.writeln("Toggle theme using top-right button");
term.writeln("-----------------------------------");

// =====================
// TOGGLE HANDLER
// =====================
document.getElementById("toggleBtn").addEventListener("click", () => {
    isDark = !isDark;
    applyUITheme();
});

// =====================
// WEBSOCKET
// =====================
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln("WebSocket Connected");

ws.onmessage = (event) => term.write(event.data);

ws.onerror = () => term.writeln("WebSocket Error");

// =====================
// RESIZE
// =====================
window.addEventListener('resize', () => fitAddon.fit());

</script>

</body>
</html>
