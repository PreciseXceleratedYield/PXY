<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #f0f0f0;
}

#container {
    display: flex;
    height: 100vh; /* full viewport height */
    width: 100%;
}

#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #ccc;
    height: 100%;
    background-color: #ffffff;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    font-size: 16px;
    line-height: 1.4;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
}

iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #00B4FF;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <iframe 
            src="https://ssltvc.investing.com/?pair_ID=8985&height=650&width=1200&interval=86400&plotStyle=candles&domain_ID=1&lang_ID=1&timezone_ID=20">
        </iframe>
    </div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#ffffff',
        foreground: '#222222'
    }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

// Fit terminal to container
fitAddon.fit();

// Example text to test
term.writeln('Connected. Displaying npxy tmux session...');
term.writeln('Terminal ready.');

// WebSocket example
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

// Re-fit on window resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
