<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06080d">
<title>PXY®</title>
<style>
body{margin:0;background:#06080d;display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',monospace;}
.logo{font-size:32px;font-weight:900;color:#e2e8f4;letter-spacing:-1px;}
.logo sup{font-size:0.45em;vertical-align:super;color:#3b82f6;}
</style>
</head>
<body>
<div class="logo">PXY<sup>®</sup></div>
<script>
(function(){
    const ua = navigator.userAgent;

    // detect touch/mobile device
    const isMobile = (
        /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
        ('ontouchstart' in window && navigator.maxTouchPoints > 1) ||
        window.innerWidth < 768
    );

    // detect tablet — treat as mobile
    const isTablet = /iPad|Tablet/i.test(ua) || (navigator.maxTouchPoints > 1 && window.innerWidth < 1200);

    if (isMobile || isTablet) {
        window.location.replace('./web/webphpxy.html');
    } else {
        window.location.replace('./web/webpcpxy.html');
    }
})();
</script>
</body>
</html>
