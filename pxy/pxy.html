<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Night Mode Terminal</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Fira Code', monospace; /* smooth monospace font */
    background: #1e1e1e; /* warm dark background */
    color: #e0d8c0; /* warm off-white text */
}

#terminal-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #1e1e1e;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.5;
}

.xterm {
    height: 100% !important;
    font-weight: normal;
}

/* cursor and selection customization */
.xterm .xterm-cursor {
    border-left: 2px solid #f0e0b0 !important; /* warm cursor */
    animation: none !important; /* disable blinking */
}

.xterm .xterm-selection {
    background: rgba(224, 216, 192, 0.2) !important; /* subtle selection */
}
</style>
</head>
<body>

<div id="terminal-container">
    <div id="terminal"></div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<script>
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#1e1e1e', // warm dark background
        foreground: '#e0d8c0', // warm off-white text
        cursor: '#f0e0b0',     // warm yellow cursor
        selection: 'rgba(224, 216, 192, 0.2)' // subtle warm selection
    },
    cursorBlink: false
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));

// Fit terminal to container
fitAddon.fit();

// Example text to test
term.writeln('Connected. Night-mode terminal ready for late-night sessions.');
term.writeln('Warm tones reduce eye strain and blue light exposure.');

// WebSocket example
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

// Re-fit on window resize
window.addEventListener('resize', () => fitAddon.fit());
</script>

</body>
</html>
