<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #1e1e1e;
    color: #c5c5c5;
}
#container {
    display: flex;
    height: 100vh;
    width: 100%;
}
#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #444;
    height: 100%;
}
#terminal {
    flex: 1;
    overflow-y: auto;
}
#chart-container {
    flex: 1;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
}
canvas {
    background: #1e1e1e;
    border: 1px solid #00B4FF;
    height: 100% !important;
    width: 100% !important;
}
</style>
</head>
<body>

<div id="container">
    <!-- Left: Terminal -->
    <div id="terminal-container">
        <div id="terminal">Connecting to npxy tmux session...</div>
    </div>

    <!-- Right: NIFTY Chart -->
    <div id="chart-container">
        <canvas id="niftyChart"></canvas>
    </div>
</div>

<!-- xterm.js -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<script>
/* ------------------ TERMINAL ------------------ */
const term = new Terminal({ convertEol: true, scrollback: 1000 });
term.open(document.getElementById('terminal'));

const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('Connected. Displaying npxy tmux session...\n');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

/* ------------------ NIFTY CHART ------------------ */
const ctx = document.getElementById('niftyChart').getContext('2d');
let niftyChart;

async function fetchNiftyData() {
    try {
        // Using Yahoo Finance API (delayed)
        const response = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/^NSEI?interval=5m&range=1d');
        const data = await response.json();
        const timestamps = data.chart.result[0].timestamp.map(ts => new Date(ts*1000).toLocaleTimeString());
        const prices = data.chart.result[0].indicators.quote[0].close;

        return {timestamps, prices};
    } catch (err) {
        console.error('Error fetching NIFTY data:', err);
        return {timestamps: [], prices: []};
    }
}

async function updateChart() {
    const {timestamps, prices} = await fetchNiftyData();
    if (!niftyChart) {
        niftyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timestamps,
                datasets: [{
                    label: 'NIFTY 50',
                    data: prices,
                    borderColor: '#00B4FF',
                    backgroundColor: 'rgba(0, 180, 255, 0.2)',
                    fill: true,
                    pointRadius: 0,
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { 
                        ticks: { color: '#c5c5c5' },
                        grid: { color: '#444' }
                    },
                    y: { 
                        ticks: { color: '#c5c5c5' },
                        grid: { color: '#444' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#c5c5c5' } }
                }
            }
        });
    } else {
        niftyChart.data.labels = timestamps;
        niftyChart.data.datasets[0].data = prices;
        niftyChart.update();
    }
}

// Initial load
updateChart();
// Refresh every 60 seconds
setInterval(updateChart, 60000);
</script>

</body>
</html>
