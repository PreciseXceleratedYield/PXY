<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Light Mode Terminal</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #ffffff;
    color: #111;
}

/* Terminal container */
#terminal {
    width: 100%;
    height: 100vh;
}

/* Cursor */
.xterm .xterm-cursor {
    border-left: 2px solid #111 !important;
    animation: none !important;
}

/* Selection */
.xterm .xterm-selection {
    background: rgba(0, 0, 0, 0.15) !important;
}
</style>
</head>

<body>

<div id="terminal"></div>

<!-- xterm -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<!-- ✅ IMPORTANT: Unicode fix addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11/lib/xterm-addon-unicode11.js"></script>

<script>

// =====================
// CONFIG
// =====================
const BASE_FONT = 15.3;
const SCALE = 1;
const FONT_SIZE = Math.round(BASE_FONT * SCALE);

// =====================
// TERMINAL INIT
// =====================
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,

    // ✅ IMPORTANT: emoji-safe font stack
    fontFamily: "'Cascadia Mono', 'Segoe UI Emoji', 'Noto Color Emoji', monospace",
    fontSize: FONT_SIZE,

    cursorBlink: false,

    theme: {
        background: '#ffffff',
        foreground: '#111111',
        cursor: '#111111',
        selection: 'rgba(0, 0, 0, 0.15)',

        black: '#111111',
        red: '#d32f2f',
        green: '#2e7d32',
        yellow: '#f9a825',
        blue: '#1565c0',
        magenta: '#6a1b9a',
        cyan: '#00838f',
        white: '#333333',
        brightBlack: '#555555',
        brightWhite: '#000000'
    },

    rendererType: 'dom'
});

// =====================
// ADDONS
// =====================
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

// ✅ FIX: Unicode width engine (CRITICAL)
const unicode11Addon = new Unicode11Addon.Unicode11Addon();
term.loadAddon(unicode11Addon);
term.unicode.activeVersion = '11';

// =====================
// START
// =====================
term.open(document.getElementById('terminal'));
fitAddon.fit();

// TEST
term.writeln("✅ Terminal Ready (Emoji Fix Enabled)");
term.writeln("Testing: 🚀 📈 ⚠️ 🔥 ✔ alignment OK");
term.writeln("-----------------------------------");

// =====================
// WEBSOCKET
// =====================
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => {
    term.writeln("✅ WebSocket Connected");
};

ws.onmessage = (event) => {
    term.write(event.data);
};

ws.onerror = () => {
    term.writeln("❌ WebSocket Error");
};

// =====================
// RESIZE
// =====================
window.addEventListener('resize', () => {
    fitAddon.fit();
});

</script>

</body>
</html>
