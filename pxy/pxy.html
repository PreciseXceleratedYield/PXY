<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal + NIFTY Chart</title>

<!-- xterm.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: monospace;
    background: #000; /* Dark background */
}

#container {
    display: flex;
    height: 100vh; /* full viewport height */
    width: 100%;
}

#terminal-container {
    width: 55ch;
    max-width: 50%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #555;
    height: 100%;
    background-color: #111; /* dark terminal panel */
}

#terminal {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    font-size: 16px;
    line-height: 1.4;
    color: #fff;
}

.xterm {
    height: 100% !important;
    font-weight: bold;
}

#chart-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
    background-color: #000; /* dark chart background */
}

canvas {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="container">
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <div id="chart-container">
        <canvas id="niftyChart"></canvas>
    </div>
</div>

<!-- xterm.js and fit addon -->
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// ===== TERMINAL =====
const term = new Terminal({
    convertEol: true,
    scrollback: 1000,
    theme: {
        background: '#111',
        foreground: '#fff'
    }
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

term.writeln('Connected. Terminal ready...');

// Example WebSocket connection (if used)
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${window.location.host}`);

ws.onopen = () => term.writeln('WebSocket connected...');
ws.onmessage = (event) => { 
    term.write(event.data); 
    term.scrollToBottom(); 
};
ws.onerror = (err) => term.writeln('\nWebSocket error: ' + err);

// Re-fit on window resize
window.addEventListener('resize', () => fitAddon.fit());

// ===== CHART =====
async function loadChart() {
    try {
        const res = await fetch('./sys/line_data.csv?' + Date.now());
        const csvText = await res.text();

        const rows = csvText.trim().split('\n').slice(1).map(r => {
            const [time, close] = r.split(',');
            return { x: new Date(parseInt(time) * 1000), y: parseFloat(close) };
        });

        const ctx = document.getElementById('niftyChart').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'NIFTY Close',
                    data: rows,
                    borderColor: '#00FF00', // green line
                    backgroundColor: 'rgba(0,0,0,0)', 
                    tension: 0.2,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#fff' } }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'minute' },
                        ticks: { color: '#fff' },
                        grid: { color: '#555' }
                    },
                    y: {
                        ticks: { color: '#fff' },
                        grid: { color: '#555' }
                    }
                }
            }
        });
    } catch (err) {
        console.error('Error loading chart:', err);
    }
}

// Load chart
loadChart();
</script>

</body>
</html>
