<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080d">
<title>PXY® — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<style>
:root,[data-theme="dark"]{
    --bg:#06080d;--bg2:#0b0f1a;--bg3:#111827;
    --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.13);
    --text:#e2e8f4;--muted:#4a5568;--accent:#3b82f6;
    --bull:#22c55e;--bear:#ef4444;
}
[data-theme="light"]{
    --bg:#f0f4fb;--bg2:#ffffff;--bg3:#e8eef8;
    --border:rgba(0,0,0,0.065);--border2:rgba(0,0,0,0.13);
    --text:#0f172a;--muted:#94a3b8;--accent:#2563eb;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{
    height:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body{
    height:100dvh;display:flex;flex-direction:column;
    font-family:'DM Mono',monospace;
    background:var(--bg);color:var(--text);
    overflow:hidden;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    transition:background 0.3s,color 0.3s;
}

/* ── HEADER ── */
#hdr{
    height:44px;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;
    background:var(--bg2);
    border-bottom:1px solid var(--border2);
    transition:background 0.3s,border-color 0.3s;
}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:10px;}

.back-btn{
    display:flex;align-items:center;gap:5px;
    padding:4px 10px;
    border:1px solid var(--border2);border-radius:6px;
    color:var(--muted);font-size:11px;letter-spacing:0.06em;
    text-decoration:none;font-family:'DM Mono',monospace;
    transition:all 0.2s;
}
.back-btn:hover,.back-btn:active{color:var(--text);background:var(--bg3);}

.logo{
    font-family:'Syne',sans-serif;font-weight:800;
    font-size:16px;color:var(--text);
}
.logo sup{font-size:0.5em;vertical-align:super;color:var(--accent);}

/* status dot */
#statusDot{
    width:7px;height:7px;border-radius:50%;
    background:var(--muted);flex-shrink:0;
    transition:background 0.3s;
}
#statusDot.connected{background:var(--bull);box-shadow:0 0 6px var(--bull);}
#statusDot.error    {background:var(--bear);box-shadow:0 0 6px var(--bear);}

/* theme toggle */
.toggle-wrap{display:flex;align-items:center;cursor:pointer;user-select:none;}
.toggle-track{
    width:28px;height:15px;border-radius:8px;
    background:var(--bg3);border:1px solid var(--border2);
    position:relative;transition:background 0.3s;
}
[data-theme="light"] .toggle-track{background:var(--accent);border-color:var(--accent);}
.toggle-thumb{
    position:absolute;top:2px;left:2px;
    width:9px;height:9px;border-radius:50%;
    background:var(--muted);
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
[data-theme="light"] .toggle-thumb{transform:translateX(13px);background:#fff;}

/* clock */
#clk{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ── TERMINAL ── */
#termBox{
    flex:1;min-height:0;overflow:hidden;
    padding:4px 0;
}
#termBox .xterm{height:100%!important;}
#termBox .xterm-viewport{background:transparent!important;}
#termBox .xterm-screen{background:transparent!important;}

/* ── FOOTER ── */
#ftr{
    height:32px;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;
    background:var(--bg2);border-top:1px solid var(--border2);
    transition:background 0.3s,border-color 0.3s;
}
.ftr-lbl{font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
#reconnectBtn{
    padding:3px 10px;border-radius:5px;
    border:1px solid var(--border2);background:transparent;
    color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;
    cursor:pointer;transition:all 0.2s;
}
#reconnectBtn:hover{color:var(--accent);border-color:var(--accent);}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
    <div class="hdr-l">
        <button id="reconnectBtn" class="back-btn">↺ Reconnect</button>
        <div id="statusDot" title="WebSocket status"></div>
        <span id="statusLbl" style="font-size:9px;color:var(--muted);letter-spacing:0.1em;">CONNECTING</span>
    </div>
    <div class="hdr-r">
        <span id="clk">—</span>
        <span class="logo" id="logoRefresh" style="cursor:pointer;" title="Actions">PXY<sup>®</sup></span>
    </div>
</div>

<!-- TERMINAL -->
<div id="termBox"></div>

<!-- RISK BAR -->
<div id="riskBar" style="height:44px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;gap:12px;background:var(--bg2);border-top:1px solid var(--border2);transition:background 0.3s,border-color 0.3s;overflow:hidden;">
    <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
        <span style="font-size:7px;letter-spacing:0.12em;text-transform:uppercase;color:#ffffff;white-space:nowrap;">⛔ Stop</span>
        <span id="rskNet" style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;white-space:nowrap;color:#ffffff;">—</span>
    </div>
    <div style="flex:1;min-width:0;height:32px;position:relative;overflow:hidden;border-radius:6px;background:var(--bg3);border:1px solid var(--border2);">
        <canvas id="rskCanvas" style="position:absolute;inset:0;width:100%!important;height:100%!important;"></canvas>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;align-items:flex-end;">
        <span style="font-size:7px;letter-spacing:0.12em;text-transform:uppercase;color:#ffffff;white-space:nowrap;">📈 Peak</span>
        <span id="rskPeak" style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;white-space:nowrap;color:#ffffff;">—</span>
    </div>
</div>

<div id="ftr" style="height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--bg2);border-top:1px solid var(--border2);transition:background 0.3s,border-color 0.3s;">
    <span class="ftr-lbl">Terminal · PXY®</span>
</div>

<script>
'use strict';

/* ── CLOCK ── */
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-IN',{hour12:false});}
tick();setInterval(tick,1000);

/* ── TERMINAL ── */
let term, fit, ws;

function initTerm(){
    term = new Terminal({
        convertEol:true,scrollback:500,
        fontFamily:"'DM Mono',monospace",
        fontSize:15,lineHeight:1.45,
        scrollback:500,
        fontFamily:"'DM Mono',monospace",
        cursorBlink:false,disableStdin:true,
        convertEol:true,
        theme:{background:'#00000000',foreground:'#8899bb',
               green:'#22c55e',red:'#ef4444',yellow:'#f59e0b',
               cyan:'#22d3ee',brightBlack:'#374151'}
    });
    document.getElementById('termBox').style.padding='0 14px';
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('termBox'));
    setTimeout(()=>fit.fit(),80);
    new ResizeObserver(()=>fit.fit()).observe(document.getElementById('termBox'));
}

function setStatus(state){
    const dot=document.getElementById('statusDot');
    const lbl=document.getElementById('statusLbl');
    dot.className='';
    if(state==='connected'){dot.classList.add('connected');lbl.textContent='LIVE';}
    else if(state==='error')  {dot.classList.add('error');  lbl.textContent='ERROR';}
    else                      {lbl.textContent='OFFLINE';}
}

function connect(){
    if(ws){try{ws.close();}catch(e){}}
    setStatus('connecting');
    const proto=location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(`${proto}://${location.host}`);
    ws.onopen=()=>{
        setStatus('connected');
        term.clear();
        term.write('\x1b[32m[connected]\x1b[0m\r\n');
    };
    ws.onmessage=e=>{
        term.clear();
        term.write(e.data);
    };
    ws.onerror=()=>{
        setStatus('error');
        term.write('\r\n\x1b[31m[connection error]\x1b[0m');
    };
    ws.onclose=()=>{
        setStatus('offline');
        term.write('\r\n\x1b[33m[disconnected]\x1b[0m');
    };
}

document.getElementById('reconnectBtn').addEventListener('click',()=>{
    term.clear();
    connect();
});

/* ── RISK BAR ── */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

async function loadRisk(){
    let d={session_peak_pnl:0,current_net_pnl:0,active_exit_line:-3000};
    try{d=await fetch('./webrinkopxy.json?_='+Date.now()).then(r=>r.json());}catch{}
    const peak  = d.session_peak_pnl??0;
    const net   = d.current_net_pnl??0;
    const floor = d.active_exit_line??-3000;

    const fmtR = n=>(n>=0?'+':'')+Math.round(n).toLocaleString('en-IN');
    document.getElementById('rskPeak').textContent='₹'+Math.round(peak).toLocaleString('en-IN');
    document.getElementById('rskPeak').style.color=peak>=0?cssVar('--bull'):cssVar('--bear');
    document.getElementById('rskNet').textContent='₹'+Math.round(floor).toLocaleString('en-IN');
    document.getElementById('rskNet').style.color=cssVar('--bear');
    drawRiskCandle(floor,net,peak);
}

function drawRiskCandle(floor,net,peak){
    const canvas=document.getElementById('rskCanvas');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px'; canvas.style.height=rect.height+'px';
    ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    ctx.clearRect(0,0,W,H);
    const PADX=14,midY=H/2,bodyH=Math.max(10,H*0.45);
    const lo=-3000,hi=Math.max(peak,10),open=0,close=net;
    const range=hi-lo||1;
    const toX=v=>Math.max(PADX,Math.min(W-PADX,((v-lo)/range)*(W-PADX*2)+PADX));
    const lowX=toX(lo),highX=toX(hi),openX=toX(open),closeX=toX(close);
    const isBull=close>=open;
    const bodyColor=isBull?cssVar('--bull'):cssVar('--bear');
    const glowColor=isBull?'rgba(34,197,94,0.5)':'rgba(239,68,68,0.5)';
    // wick
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(lowX,midY);ctx.lineTo(highX,midY);ctx.stroke();
    // low tick
    ctx.strokeStyle=cssVar('--bear');ctx.lineWidth=2;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.moveTo(lowX,midY-bodyH/2);ctx.lineTo(lowX,midY+bodyH/2);ctx.stroke();
    // high tick
    ctx.strokeStyle=cssVar('--bull');
    ctx.beginPath();ctx.moveTo(highX,midY-bodyH/2);ctx.lineTo(highX,midY+bodyH/2);ctx.stroke();
    ctx.globalAlpha=1;
    // zero line
    if(openX>PADX+2&&openX<W-PADX-2){
        ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(openX,midY-bodyH/2);ctx.lineTo(openX,midY+bodyH/2);ctx.stroke();
        ctx.setLineDash([]);
    }
    // body
    const bx1=Math.min(openX,closeX),bx2=Math.max(openX,closeX),bW=Math.max(bx2-bx1,4);
    ctx.shadowColor=glowColor;ctx.shadowBlur=10;ctx.fillStyle=bodyColor;
    ctx.beginPath();ctx.roundRect(bx1,midY-bodyH/2,bW,bodyH,4);ctx.fill();
    ctx.shadowBlur=0;
    // shine
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath();ctx.roundRect(bx1+2,midY-bodyH/2+2,Math.max(bW-4,2),Math.max(bodyH*0.3,2),2);ctx.fill();
    // net label
    const netLabel=(net>=0?'+':'')+Math.round(net).toLocaleString('en-IN');
    const fontSize=Math.round(Math.min(14,Math.max(10,H*0.28)));
    ctx.font=`800 ${fontSize}px 'Syne',sans-serif`;
    ctx.fillStyle=isBull?'#06160d':'#ffffff';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(netLabel,(bx1+bx2)/2,midY);
    // danger glow
    const danger=net<=lo+Math.abs(lo)*0.15;
    document.getElementById('riskBar').style.boxShadow=danger
        ?'0 0 0 1px rgba(239,68,68,0.5),0 0 20px rgba(239,68,68,0.12)':'';
}

new ResizeObserver(loadRisk).observe(document.getElementById('riskBar'));
loadRisk();
setInterval(loadRisk,4000);

/* ── START ── */
initTerm();
connect();
</script>
<!-- ══ ACTIONS MENU (anchored to header right) ══ -->
<div id="actionsMenu" style="display:none;position:fixed;top:44px;right:0;z-index:9998;width:240px;background:rgba(11,15,26,0.92);backdrop-filter:blur(4px);border:1px solid var(--border2);border-radius:0 0 0 12px;padding:10px 8px;flex-direction:column;gap:6px;box-shadow:0 16px 40px rgba(0,0,0,0.6);">
    <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:11px;letter-spacing:0.08em;text-align:center;color:var(--text);padding:2px 0 6px;border-bottom:1px solid var(--border2);flex-shrink:0;">PXY<sup style="color:var(--accent);">®</sup> ACTIONS</div>
    <button class="amenu-btn sqrall" data-script="pxysqrall">⛔ SQUARE OFF ALL<span class="amenu-sub">Close all positions</span></button>
    <button class="amenu-btn ce"     data-script="pxybuyce" >✅ BUY CE<span class="amenu-sub">Force buy call option</span></button>
    <button class="amenu-btn ce"     data-script="pxysqrce" >⛔ SQUARE OFF CE<span class="amenu-sub">Close all call positions</span></button>
    <button class="amenu-btn pe"     data-script="pxybuype" >✅ BUY PE<span class="amenu-sub">Force buy put option</span></button>
    <button class="amenu-btn pe"     data-script="pxysqrpe" >⛔ SQUARE OFF PE<span class="amenu-sub">Close all put positions</span></button>
    <button class="amenu-btn config" data-script="pxyconfig">⚙️ PXYCONFIG<span class="amenu-sub">Open config on GitHub</span></button>
    <button class="amenu-btn update" data-script="pxyupdate">🔄 PXYUPDATE<span class="amenu-sub">Pull latest & reset</span></button>
    <button id="amenuClose" style="margin-top:4px;padding:7px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">✕ Close</button>
</div>

<!-- ══ PWD POPUP ══ -->
<div id="updPopup" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);align-items:center;justify-content:center;">
    <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:28px 32px;min-width:260px;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,0.6);">
        <div id="updTitle" style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.06em;">▶ script</div>
        <div style="font-size:10px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;">Enter neo password</div>
        <input type="password" id="updPwd" placeholder="password" maxlength="20"
               style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'DM Mono',monospace;font-size:16px;text-align:center;letter-spacing:0.14em;outline:none;"
               onkeydown="if(event.key==='Enter')confirmUpdate();if(event.key==='Escape')cancelUpdate();">
        <div style="display:flex;gap:10px;width:100%;">
            <button onclick="cancelUpdate()" style="flex:1;padding:9px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;">Cancel</button>
            <button onclick="confirmUpdate()" style="flex:1;padding:9px;border-radius:7px;border:1px solid var(--accent);background:rgba(59,130,246,0.12);color:var(--accent);font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;">Execute</button>
        </div>
    </div>
</div>

<!-- ══ OUTPUT TOAST ══ -->
<div id="actionOutput" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(90vw,380px);background:var(--bg2);border:1px solid var(--border2);border-radius:10px;z-index:9999;box-shadow:0 16px 48px rgba(0,0,0,0.6);overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--bg3);border-bottom:1px solid var(--border);">
        <span id="aoLabel" style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Output</span>
        <span onclick="document.getElementById('actionOutput').style.display='none'" style="cursor:pointer;color:var(--muted);font-size:12px;">✕</span>
    </div>
    <pre id="aoText" style="padding:10px 12px;font-size:11px;line-height:1.5;color:var(--text);max-height:140px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;font-family:'DM Mono',monospace;"></pre>
</div>

<style>
.amenu-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 10px;border-radius:7px;border:1px solid var(--border2);
    background:rgba(17,24,39,0.5);color:var(--text);font-family:'Syne',sans-serif;
    font-weight:700;font-size:11px;letter-spacing:0.03em;cursor:pointer;
    transition:all 0.15s;text-align:left;width:100%;
}
.amenu-btn:hover{background:rgba(17,24,39,0.85);}
.amenu-btn.sqrall{border-color:rgba(239,68,68,0.6);color:#ff6b6b;background:rgba(239,68,68,0.12);}
.amenu-btn.sqrall:hover{background:rgba(239,68,68,0.28);}
.amenu-btn.ce{border-color:rgba(34,197,94,0.3);color:var(--bull);}
.amenu-btn.ce:hover{background:rgba(34,197,94,0.18);}
.amenu-btn.pe{border-color:rgba(239,68,68,0.3);color:var(--bear);}
.amenu-btn.pe:hover{background:rgba(239,68,68,0.18);}
.amenu-btn.config{border-color:rgba(59,130,246,0.3);color:var(--accent);}
.amenu-btn.config:hover{background:rgba(59,130,246,0.18);}
.amenu-btn.update{border-color:rgba(245,158,11,0.4);color:var(--gold);}
.amenu-btn.update:hover{background:rgba(245,158,11,0.18);}
.amenu-sub{font-family:'DM Mono',monospace;font-size:8px;font-weight:400;opacity:0.65;letter-spacing:0.05em;}
</style>

<script>
/* ── ACTIONS MENU ── */
let pendingScript=null;
const logo=document.getElementById('logoRefresh');
const amenu=document.getElementById('actionsMenu');

logo.addEventListener('click',e=>{
    e.stopPropagation();
    amenu.style.display=amenu.style.display==='flex'?'none':'flex';
});
document.getElementById('amenuClose').addEventListener('click',()=>{ amenu.style.display='none'; });
document.addEventListener('click',e=>{ if(!amenu.contains(e.target)&&e.target!==logo) amenu.style.display='none'; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') amenu.style.display='none'; });

document.querySelectorAll('.amenu-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
        const script=btn.dataset.script;
        if(script==='pxyconfig'){
            window.open('https://github.com/kcbpcc/V1L58/tree/main','_blank');
            amenu.style.display='none';
            return;
        }
        pendingScript=script;
        amenu.style.display='none';
        document.getElementById('updTitle').textContent='▶ '+script;
        document.getElementById('updPwd').value='';
        document.getElementById('updPopup').style.display='flex';
        setTimeout(()=>document.getElementById('updPwd').focus(),80);
    });
});

function cancelUpdate(){
    document.getElementById('updPopup').style.display='none';
    document.getElementById('updPwd').value='';
    pendingScript=null;
}
function confirmUpdate(){
    const pwd=document.getElementById('updPwd').value.trim();
    if(!pwd||!pendingScript)return;
    const script=pendingScript;
    document.getElementById('updPopup').style.display='none';
    document.getElementById('updPwd').value='';
    pendingScript=null;
    const orig=logo.innerHTML;
    logo.innerHTML='⏳';
    fetch(`/run/${script}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pwd})})
    .then(r=>r.json())
    .then(d=>{
        logo.innerHTML=d.ok?'✓':'✗';
        setTimeout(()=>{logo.innerHTML=orig;},2500);
        const text=(d.output||'')+(d.error?'\n⚠ '+d.error:'');
        document.getElementById('aoLabel').textContent=d.ok?`✓ ${script}`:`✗ ${script}`;
        document.getElementById('aoText').textContent=text.trim()||'(no output)';
        document.getElementById('actionOutput').style.display='block';
    })
    .catch(e=>{
        logo.innerHTML='✗';
        setTimeout(()=>{logo.innerHTML=orig;},2500);
        document.getElementById('aoLabel').textContent=`✗ ${script}`;
        document.getElementById('aoText').textContent=e.message;
        document.getElementById('actionOutput').style.display='block';
    });
}
</script>
</body>
