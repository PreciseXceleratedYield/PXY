<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#181c26">
<title>PXY® — Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#181c26;--bg2:#181c26;--bg3:#20242e;
    --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.10);
    --text:#d5dae5;--muted:#7d8aa0;--accent:#3b82f6;
    --bull:#26a69a;--bear:#ef5350;--gold:#f0b429;
    --bull-dim:rgba(38,166,154,0.14);--bear-dim:rgba(239,83,80,0.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
    min-height:100dvh;background:var(--bg);color:var(--text);
    font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px 16px;overflow:hidden;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:0.03em;}
h1 sup{color:var(--gold);font-size:0.55em;}
#statusLine{font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}

/* ── ONE SHARED VERTICAL COURT — CE at top, PE at bottom, NET across the middle ── */
#courtWrap{position:relative;display:flex;align-items:center;gap:10px;}
#court{
    position:relative;width:140px;max-width:38vw;height:min(66vh,600px);
    background:linear-gradient(180deg,var(--bull-dim),var(--bg3) 50%,var(--bear-dim));
    border:1px solid var(--border2);border-radius:12px;overflow:visible;
    box-shadow:inset 0 0 0 1px var(--border);
}
.paddle{
    position:absolute;left:50%;transform:translateX(-50%);
    font-family:'Syne',sans-serif;font-weight:800;font-size:10px;
    letter-spacing:0.08em;color:var(--muted);white-space:nowrap;
}
.paddle.top{top:-20px;}
.paddle.bottom{bottom:-20px;}
.net{position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:rgba(255,255,255,0.16);transform:translateY(-50%);}
.net::after{
    content:'NET · 0';position:absolute;left:50%;top:-13px;transform:translateX(-50%);
    font-size:7px;color:var(--muted);white-space:nowrap;
}
.thr-line{position:absolute;left:0;right:0;height:0;border-top:1px dashed currentColor;opacity:0.7;}
.thr-lbl{position:absolute;font-size:7.5px;font-weight:700;white-space:nowrap;transform:translateY(-50%);}
.thr-lbl.side-l{right:calc(100% + 8px);text-align:right;}
.thr-lbl.side-r{left:calc(100% + 8px);}
.ce-c{color:var(--bull);}
.pe-c{color:var(--bear);}

.ball-wrap{position:absolute;left:50%;transition:top 0.8s cubic-bezier(.4,0,.2,1);}
.ball{
    position:relative;width:24px;height:24px;margin-left:-12px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Syne',sans-serif;font-weight:800;font-size:9px;color:#fff;
    box-shadow:0 0 0 3px var(--bg3),0 3px 10px rgba(0,0,0,0.5);
    animation:pingpong 1.05s ease-in-out infinite;
}
.ball.ce{animation-delay:0s;}
.ball.pe{animation-delay:0.5s;}
.ball.bull{background:var(--bull);}
.ball.bear{background:var(--bear);}
.ball.gold{background:var(--gold);color:#181c26;}
@keyframes pingpong{
    0%,100%{transform:translateY(-6px) scale(1);}
    50%{transform:translateY(6px) scale(0.92);}
}
.ball-val{
    position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
    font-size:8px;font-weight:700;color:var(--text);background:var(--bg2);
    padding:1px 5px;border-radius:4px;white-space:nowrap;border:1px solid var(--border2);
}
.ball-wrap.ce .ball-val{left:auto;right:calc(100% + 8px);}

#legend{display:flex;gap:14px;font-size:8.5px;color:var(--muted);flex-wrap:wrap;justify-content:center;}
#legend b{color:var(--text);}
#scoreRow{display:flex;gap:22px;}
.score-card{display:flex;flex-direction:column;align-items:center;gap:2px;}
.score-lbl{font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.score-val{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;padding:2px 9px;border-radius:8px;}
.score-val.win{color:var(--bull);background:var(--bull-dim);}
.score-val.out{color:var(--bear);background:var(--bear-dim);}
.score-val.play{color:var(--gold);background:rgba(240,180,41,0.12);}
</style>
</head>
<body>

<h1>PXY<sup>®</sup> · GAME</h1>
<div id="statusLine">connecting…</div>

<div id="courtWrap">
    <div id="court">
        <div class="paddle top">🏓 CE</div>
        <div class="net"></div>
        <div class="paddle bottom">🏓 PE</div>
    </div>
</div>

<div id="scoreRow">
    <div class="score-card"><span class="score-lbl">CE</span><span class="score-val play" id="ceScore">—</span></div>
    <div class="score-card"><span class="score-lbl">PE</span><span class="score-val play" id="peScore">—</span></div>
</div>

<div id="legend">
    <span>🟢 top zone = <b>TGT</b></span>
    <span>🔴 bottom zone = <b>LGT</b></span>
    <span>⚪ middle = <b>NET · 0</b></span>
</div>

<script>
const $=id=>document.getElementById(id);
const court=$('court');

// top of court (0%) = +extent (target zone), bottom (100%) = -extent (deadline zone), 50% = net/zero
function toPct(v,extent){
    return Math.max(3,Math.min(97,50-(v/extent)*50));
}

function clearDynamic(){
    court.querySelectorAll('.thr-line,.thr-lbl,.ball-wrap').forEach(n=>n.remove());
}

function addLine(val,colorCls,label,side,extent){
    const top=toPct(val,extent);
    const line=document.createElement('div');
    line.className='thr-line '+colorCls;
    line.style.top=top+'%';
    court.appendChild(line);

    const lbl=document.createElement('div');
    lbl.className='thr-lbl '+colorCls+' '+(side==='l'?'side-l':'side-r');
    lbl.style.top=top+'%';
    lbl.textContent=label+' '+val.toFixed(1);
    court.appendChild(lbl);
}

function addBall(val,lgt,tgt,label,cssSide,extent){
    const top=toPct(val,extent);
    let cls='gold',state='IN PLAY';
    if(val<=lgt){cls='bear';state='OUT';}
    else if(val>=tgt){cls='bull';state='WIN';}

    const wrap=document.createElement('div');
    wrap.className='ball-wrap '+cssSide;
    wrap.style.top=top+'%';
    wrap.innerHTML=`<div class="ball ${cls} ${cssSide}">${label}</div><div class="ball-val">${val.toFixed(1)}</div>`;
    court.appendChild(wrap);
    return state;
}

function setScore(elId,state){
    const el=$(elId);
    el.textContent=state==='WIN'?'🏆 WIN':state==='OUT'?'⛔ OUT':'▶ IN PLAY';
    el.className='score-val '+(state==='WIN'?'win':state==='OUT'?'out':'play');
}

async function loadGame(){
    let d=null;
    try{ d=await fetch('./webavgpxy.json?_='+Date.now()).then(r=>r.json()); }catch(e){}
    d=d||{};

    const ceLgt=Number(d.ce_lgt)||0, ceTgt=Number(d.ce_tgt)||0, ceRun=Number(d.ce_run_pct)||0;
    const peLgt=Number(d.pe_lgt)||0, peTgt=Number(d.pe_tgt)||0, peRun=Number(d.pe_run_pct)||0;

    const extent=Math.max(
        Math.abs(ceLgt),Math.abs(ceTgt),Math.abs(ceRun),
        Math.abs(peLgt),Math.abs(peTgt),Math.abs(peRun),
        3
    )*1.15;

    clearDynamic();
    addLine(ceTgt,'ce-c','CE TGT','l',extent);
    addLine(ceLgt,'ce-c','CE LGT','l',extent);
    addLine(peTgt,'pe-c','PE TGT','r',extent);
    addLine(peLgt,'pe-c','PE LGT','r',extent);

    const ceState=addBall(ceRun,ceLgt,ceTgt,'CE','ce',extent);
    const peState=addBall(peRun,peLgt,peTgt,'PE','pe',extent);

    setScore('ceScore',ceState);
    setScore('peScore',peState);
    $('statusLine').textContent='live · updates every 3s';
}

loadGame();
setInterval(loadGame,3000);
</script>
</body>
</html>
