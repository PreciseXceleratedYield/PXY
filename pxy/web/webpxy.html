<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PXY®">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080d">
<link rel="manifest" href="/web/manifest.json">
<link rel="apple-touch-icon" href="/web/icons/pxy192.png">
<title>PXY®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<style>
:root,[data-theme="dark"]{
    --bg:#181c26;--bg2:#181c26;--bg3:#20242e;
    --border:rgba(255,255,255,0.025);--border2:rgba(255,255,255,0.045);
    --text:#d5dae5;--muted:#7d8aa0;--accent:#3b82f6;
    --bull:#26a69a;--bear:#ef5350;--gold:#f0b429;
    --bull-dim:rgba(38,166,154,0.10);--bear-dim:rgba(239,83,80,0.10);
    --grid:rgba(255,255,255,0.02);--track-mid:rgba(255,255,255,0.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
body{
    height:100dvh;display:flex;flex-direction:column;
    font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);
    overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
@keyframes flashUp{0%{background:rgba(38,166,154,0.35);}100%{background:transparent;}}
@keyframes flashDown{0%{background:rgba(239,83,80,0.35);}100%{background:transparent;}}
.flash-up{animation:flashUp 0.6s ease-out;}
.flash-down{animation:flashDown 0.6s ease-out;}
*{scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px;border:1px solid var(--border2);}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* ── HEADER ── */
#hdr{
    height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;position:relative;
    background:var(--bg2);
    border-bottom:1px solid var(--border2);
}
#hdr::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:var(--accent);opacity:0.5;
}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:8px;}
.logo{
    font-family:'Syne',sans-serif;font-weight:800;font-size:17px;cursor:pointer;user-select:none;
    position:relative;padding-left:10px;color:var(--text);
}
.logo::before{
    content:'';position:absolute;left:0;top:1px;bottom:1px;width:3px;
    background:var(--accent);border-radius:2px;
}
.logo sup{font-size:0.5em;vertical-align:super;color:var(--gold);}
.sort-btn{transition:all 0.15s;}
.sort-btn:active{transform:scale(0.94);}
#statusDot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.3s;}
#statusDot.connected{background:var(--bull);}
#statusDot.error{background:var(--bear);}
#clk{font-variant-numeric:tabular-nums;}
.reconnect-btn{
    padding:3px 9px;border-radius:5px;border:1px solid var(--border2);
    background:var(--bg3);color:#ffffff;font-family:'DM Mono',monospace;
    font-size:11px;cursor:pointer;transition:all 0.2s;
}
.reconnect-btn:active{color:var(--accent);border-color:var(--accent);}
.pane-hdr.hdr-term{border-left:3px solid var(--accent);background:var(--bg2);}
.pane-hdr.hdr-chart{border-left:3px solid var(--gold);background:var(--bg2);}
.pane-hdr.hdr-pos{border-left:3px solid var(--bull);background:var(--bg2);}
.pane-hdr.hdr-trades{border-left:3px solid var(--bear);background:var(--bg2);}

/* ── SIGNAL BAR ── */
.sig-cell{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 2px;gap:1px;border-right:1px solid var(--border);
    position:relative;min-width:0;
}
.sig-cell:last-child{border-right:none;}
.sig-cell::after{display:none;}
.hdr-l::after,.hdr-r::after{display:none;}
.sig-cell.bull-cell::after{background:var(--bull);}
.sig-cell.bear-cell::after{background:var(--bear);}
.sig-cell.side-cell::after{background:#facc15;}
.sig-cell.gold-cell::after{background:var(--gold);}
.sc-lbl{font-size:6px;letter-spacing:0.06em;text-transform:uppercase;color:#ffffff;white-space:nowrap;}
.sc-val{font-family:'Syne',sans-serif;font-weight:800;font-size:10px;white-space:nowrap;color:#ffffff;line-height:1;}
.sc-val.bull{color:var(--bull);}
.sc-val.bear{color:var(--bear);}
.sc-val.dim{color:var(--muted);}
.sc-val.side{color:#facc15;}

/* ── TAB CONTENT ── */
#tabContent{flex:1;min-height:0;position:relative;overflow:hidden;}
.tab-pane{position:absolute;inset:0;display:none;flex-direction:column;}
.tab-pane.active{display:flex;}

/* ── DESKTOP: show all 3 panels side by side ── */
@media (min-width:900px){
    #tabContent{display:flex;flex-direction:row;}
    .tab-pane{position:relative;inset:auto;display:flex!important;flex-direction:column;height:100%;border-right:1px solid var(--border);}
    .tab-pane:last-child{border-right:none;}
    #paneTerminal{flex:0 0 28%;max-width:28%;}
    #panePositions{flex:0 0 24%;max-width:24%;}
    #paneChart{flex:1 1 auto;min-width:0;}
    #tabBar{display:none;}
}

/* TERMINAL TAB */
#termBox{flex:1;min-height:0;overflow:hidden;padding:0 15px;}
#termBox .xterm{height:100%!important;}
#termBox .xterm-viewport{background:transparent!important;}
#termBox .xterm-screen{background:transparent!important;}

/* POSITIONS TAB — 40/60 split */
#posPane{display:flex;flex-direction:column;height:100%;}
#posTop{height:40%;display:flex;flex-direction:column;border-bottom:1px solid var(--border2);position:relative;}
#posBot{height:60%;display:flex;flex-direction:column;}
.pane-hdr{
    height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--border);
    font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
}
#posScroll{
    flex:1;min-height:0;
    overflow-y:scroll;
    -webkit-overflow-scrolling:touch;
}
#tradeScroll{
    flex:1;min-height:0;
    overflow-y:scroll;
    -webkit-overflow-scrolling:touch;
}
.p-row{
    display:grid;grid-template-columns:auto 1fr auto auto;
    align-items:center;gap:6px;padding:8px 10px;
    border-bottom:1px solid var(--border);cursor:default;
    transition:background 0.25s,border-left-color 0.25s;
}
.t-row{
    display:grid;grid-template-columns:auto 1fr auto;
    align-items:center;gap:6px;padding:8px 10px;
    border-bottom:1px solid var(--border);cursor:default;
    transition:background 0.25s,border-left-color 0.25s;
}
.p-row.bull-r{border-left:2px solid var(--bull);background:rgba(38,166,154,0.05);}
.p-row.bear-r{border-left:2px solid var(--bear);background:rgba(239,83,80,0.05);}
.t-row.bull-r{border-left:2px solid var(--bull);background:rgba(38,166,154,0.05);}
.t-row.bear-r{border-left:2px solid var(--bear);background:rgba(239,83,80,0.05);}
.p-sym,.t-sym{font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-st{font-size:10px;color:#ffe135;font-weight:700;flex-shrink:0;white-space:nowrap;text-align:right;}
.t-meta{font-size:8px;color:var(--muted);margin-top:1px;}
.p-tag,.t-tag{font-size:9px;color:var(--accent);flex-shrink:0;font-weight:500;}
.p-pnl,.t-pnl{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;flex-shrink:0;text-align:right;}
.p-pnl.bull,.t-pnl.bull{color:var(--bull);}
.p-pnl.bear,.t-pnl.bear{color:var(--bear);}
.t-sym{color:var(--muted);}
.t-row.active{background:var(--bg3);border-left:2px solid var(--accent);padding-left:8px;}
.t-row.dimmed{opacity:0.3;}
.empty-msg{padding:20px;text-align:center;color:var(--muted);font-size:10px;}

/* CHART TAB */
#chartPane{display:flex;flex-direction:column;}
#momentumBar{
    width:56px;flex-shrink:0;display:flex;flex-direction:column;
    overflow:hidden;height:100%;
}
#momentumCanvasWrap{
    flex:1;width:100%;position:relative;
}
#momentumCanvasWrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;}
#chartBox{
    flex:1;position:relative;overflow:hidden;
    background:var(--bg);
}
#optOverlay{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);}
#optOverlay:empty{display:none;}
.opt-tbl{width:auto;margin:0 auto;table-layout:auto;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:12.6px;color:var(--text);}
.opt-tbl th{padding:2px 1px;color:var(--muted);font-weight:700;text-align:center;font-size:9.5px;letter-spacing:-1px;border-bottom:1px solid var(--border2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.opt-tbl td{padding:3px 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.opt-tbl tr.opt-ce td{border-bottom:1px solid var(--border);}
.grid-over{
    position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:40px 40px;
}
#chartBox canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:1;}

/* ── RISK BAR ── */
#riskBar{
    height:44px;flex-shrink:0;display:flex;align-items:center;
    padding:0 12px;gap:10px;background:var(--bg2);
    border-bottom:1px solid var(--border);overflow:hidden;
}
.rsk-grp{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.rsk-lbl{font-size:7px;letter-spacing:0.10em;text-transform:uppercase;color:#ffffff;white-space:nowrap;}
.rsk-val{font-family:'Syne',sans-serif;font-weight:800;font-size:12px;white-space:nowrap;color:#ffffff;}
.rsk-val.bull{color:var(--bull);}
.rsk-val.bear{color:var(--bear);}
.rsk-candle-wrap{flex:1;min-width:0;height:30px;position:relative;overflow:hidden;}
#rskCanvas{position:absolute;inset:0;width:100%!important;height:100%!important;}

/* ── TAB BAR ── */
#tabBar{
    height:22px;flex-shrink:0;display:flex;align-items:stretch;
    background:var(--bg2);border-top:1px solid var(--border);
}
.tab-btn{
    flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:0;border:none;background:transparent;color:var(--muted);
    font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.08em;
    text-transform:uppercase;cursor:pointer;transition:all 0.15s;
    border-top:1px solid transparent;
}
.tab-btn.active{color:var(--accent);border-top-color:var(--accent);}
.tab-btn:active{background:var(--bg3);}
.tab-icon{display:none;}

/* actions menu */
.amenu-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 10px;border-radius:7px;border:1px solid var(--border2);
    background:rgba(17,24,39,0.5);color:var(--text);font-family:'Syne',sans-serif;
    font-weight:700;font-size:11px;letter-spacing:0.03em;cursor:pointer;
    transition:all 0.15s;text-align:left;width:100%;
}
.amenu-btn:active{background:rgba(17,24,39,0.85);}
.amenu-btn.sqrall{border-color:rgba(239,83,80,0.6);color:#ff6b6b;background:rgba(239,83,80,0.12);}
.amenu-btn.ce{border-color:rgba(38,166,154,0.3);color:var(--bull);}
.amenu-btn.pe{border-color:rgba(239,83,80,0.3);color:var(--bear);}
.amenu-btn.config{border-color:rgba(59,130,246,0.3);color:var(--accent);}
.amenu-btn.update{border-color:rgba(245,158,11,0.4);color:var(--gold);}
.amenu-sub{font-family:'DM Mono',monospace;font-size:8px;font-weight:400;opacity:0.65;letter-spacing:0.05em;}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
    <div class="hdr-l">
        <span class="logo" id="logoRefresh">PXY<sup>®</sup></span>
    </div>
    <div style="flex:1;"></div>
    <div class="hdr-r">
        <span id="brandHdr" style="font-family:'Syne',sans-serif;font-weight:700;font-size:9px;letter-spacing:0.06em;white-space:nowrap;"><span style="color:var(--bull);">P</span><span style="color:var(--muted);">recise</span><span style="color:var(--bear);">X</span><span style="color:var(--muted);">celerated</span><span style="color:var(--bull);">Y</span><span style="color:var(--muted);">ield Pvt Ltd</span><sup style="color:var(--muted);">™</sup></span>
        <span id="clk" style="font-family:'DM Mono',monospace;font-size:9px;color:#fff;letter-spacing:0.03em;white-space:nowrap;cursor:pointer;" title="Clients">—</span>
        <div id="statusDot"></div>
        <button class="reconnect-btn" id="reconnectBtn" title="Reconnect">↺</button>
    </div>
</div>

<!-- ══ HOST BOOKMARKS MENU ══ -->
<div id="hostMenu" style="display:none;position:fixed;top:44px;right:0;z-index:9998;width:250px;max-height:70vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--border2);border-radius:0 0 0 12px;padding:10px 8px;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.3);">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0 6px;border-bottom:1px solid var(--border2);">
        <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:11px;letter-spacing:0.08em;color:var(--text);">🔗 CLIENTS</span>
        <span id="hmGear" title="Manage bookmarks" style="cursor:pointer;font-size:13px;padding:2px 4px;border-radius:5px;">⚙️</span>
    </div>

    <!-- MENU VIEW -->
    <div id="hostMenuList" style="display:flex;flex-direction:column;gap:4px;"></div>

    <!-- MANAGE VIEW -->
    <div id="hmManage" style="display:none;flex-direction:column;gap:6px;">
        <div id="hmManageList" style="display:flex;flex-direction:column;gap:4px;"></div>
        <div style="border-top:1px solid var(--border2);margin-top:4px;padding-top:8px;display:flex;flex-direction:column;gap:6px;">
            <input id="hmName" placeholder="Name" style="padding:7px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;outline:none;">
            <input id="hmUrl" placeholder="https://..." style="padding:7px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;outline:none;">
            <input id="hmNote" placeholder="Tooltip note" style="padding:7px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;outline:none;">
            <button id="hmAddBtn" style="padding:7px;border-radius:6px;border:1px solid var(--accent);background:rgba(59,130,246,0.12);color:var(--accent);font-family:'Syne',sans-serif;font-weight:700;font-size:11px;cursor:pointer;">+ Add Bookmark</button>
        </div>
    </div>

    <button id="hmClose" style="margin-top:2px;padding:6px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;">✕ Close</button>
</div>

<style>
.hbm-item{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:7px 9px;border-radius:6px;border:1px solid var(--border2);
    background:rgba(17,24,39,0.5);cursor:pointer;transition:background 0.15s;
}
.hbm-item:hover{background:rgba(17,24,39,0.85);}
.hbm-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.hbm-del{font-size:11px;color:var(--muted);cursor:pointer;flex-shrink:0;padding:0 2px;}
.hbm-del:hover{color:var(--bear);}
</style>

<!-- TAB CONTENT -->
<div id="tabContent">

    <!-- TERMINAL -->
    <div class="tab-pane active" id="paneTerminal">
        <div class="pane-hdr hdr-term">
            <span onclick="openPanelLink('terminal')" style="cursor:pointer;font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:var(--text);">🖥️ Terminal</span>
        </div>
        <div id="termBox"></div>
    </div>

    <!-- CHART -->
    <div class="tab-pane" id="paneChart">
        <div class="pane-hdr hdr-chart">
            <span onclick="openPanelLink('chart')" style="cursor:pointer;font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:var(--text);">📈 Chart</span>
            <span style="display:flex;gap:4px;">
                <span onclick="setChartMode('candle')" id="chartModeCandle" style="font-size:8px;color:var(--accent);cursor:pointer;padding:1px 6px;border-radius:3px;border:1px solid var(--accent);">Candles</span>
                <span onclick="setChartMode('line')" id="chartModeLine" style="font-size:8px;color:var(--muted);cursor:pointer;padding:1px 6px;border-radius:3px;border:1px solid var(--border);">Line</span>
            </span>
        </div>
        <div style="flex:1;min-height:0;display:flex;flex-direction:row;">
            <div id="chartBox" style="flex:1;">
                <div class="grid-over"></div>
                <canvas id="priceChart"></canvas>
            </div>
            <div id="momentumBar">
                <div id="momentumCanvasWrap"><canvas id="momentumCandle"></canvas></div>
            </div>
        </div>
    </div>

    <!-- POSITIONS + TRADES (40/60 split) -->
    <div class="tab-pane" id="panePositions">
        <div id="posPane">
            <div id="posTop">
                <div class="pane-hdr hdr-pos">
                    <span onclick="openPanelLink('positions')" style="cursor:pointer;font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:var(--text);">📍 Positions</span>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span id="posPnlLabel" style="font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:var(--bull);">—</span>
                        <span class="sort-btn" onclick="sortPos('tag')" id="posSortTag" style="font-size:8px;color:var(--muted);cursor:pointer;padding:1px 4px;border-radius:3px;border:1px solid var(--border);">#</span>
                        <span class="sort-btn" onclick="sortPos('pnl')" id="posSortPnl" style="font-size:8px;color:var(--accent);cursor:pointer;padding:1px 4px;border-radius:3px;border:1px solid var(--accent);">P&L↕</span>
                    </div>
                </div>
                <div class="pane-scroll" id="posScroll"><div class="empty-msg" id="posEmpty">No positions</div></div>

                <!-- Trade chart overlay — covers ONLY posTop (40%) -->
                <div id="tradeChartOverlay" style="display:none;position:absolute;inset:0;flex-direction:column;background:var(--bg);z-index:10;">
                    <div style="height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--border2);">
                        <span id="tradeChartLabel" style="font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">— trade —</span>
                        <span style="font-size:9px;color:var(--muted);flex-shrink:0;margin-left:6px;">2× close</span>
                    </div>
                    <div id="tradeChartBox" style="flex:1;position:relative;overflow:hidden;background:var(--bg);">
                        <div class="grid-over"></div>
                        <canvas id="tradeChart"></canvas>
                        <svg id="tradeMarkerLayer" style="position:absolute;inset:0;pointer-events:none;z-index:3;overflow:visible;"></svg>
                    </div>
                </div>
            </div>

            <div id="posBot">
                <div class="pane-hdr hdr-trades">
                    <span onclick="openPanelLink('trades')" style="cursor:pointer;font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:var(--text);">📋 Trades</span>
                    <div style="display:flex;align-items:center;gap:6px;">

<script>
'use strict';
const $=id=>document.getElementById(id);
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* ── HOSTNAME ── */
async function loadHostname(){
    try{
        const d=await fetch('/hostname').then(r=>r.json());
        const el=$('clk');
        if(el)el.textContent=String(d.hostname||'—').split('.')[0].toUpperCase();
    }catch(e){const el=$('clk');if(el)el.textContent='—';}
}
loadHostname();

/* ── HOST BOOKMARKS MENU ── */
const BM_KEY='pxy_bookmarks';
function bmLoad(){try{return JSON.parse(localStorage.getItem(BM_KEY)||'[]');}catch(e){return [];}}
function bmSave(arr){localStorage.setItem(BM_KEY,JSON.stringify(arr));}

function bmRenderMenu(){
    const list=$('hostMenuList');
    const items=bmLoad();
    list.innerHTML='';
    if(!items.length){
        list.innerHTML='<div style="text-align:center;color:var(--muted);font-size:10px;padding:8px 0;">No bookmarks yet — tap ⚙️ to add</div>';
        return;
    }
    items.forEach(it=>{
        const row=document.createElement('div');
        row.className='hbm-item';
        row.title=it.note||'';
        row.innerHTML=`<span class="hbm-label">${it.name||'(unnamed)'}</span>`;
        row.addEventListener('click',()=>{window.location.href=it.url;});
        list.appendChild(row);
    });
}

function bmRenderManage(){
    const list=$('hmManageList');
    const items=bmLoad();
    list.innerHTML='';
    items.forEach((it,i)=>{
        const row=document.createElement('div');
        row.className='hbm-item';
        row.style.cursor='default';
        row.title=it.note||'';
        row.innerHTML=`<span class="hbm-label">${it.name||'(unnamed)'}</span><span class="hbm-del" data-i="${i}" title="Delete">🗑️</span>`;
        row.querySelector('.hbm-del').addEventListener('click',(e)=>{
            e.stopPropagation();
            if(confirm(`Delete bookmark "${it.name||it.url}"?`)){
                const arr=bmLoad();arr.splice(i,1);bmSave(arr);
                bmRenderManage();bmRenderMenu();
            }
        });
        list.appendChild(row);
    });
}

const hostMenuEl=$('hostMenu');
$('clk').addEventListener('click',e=>{
    e.stopPropagation();
    $('hmManage').style.display='none';
    bmRenderMenu();
    hostMenuEl.style.display=hostMenuEl.style.display==='flex'?'none':'flex';
});
$('hmGear').addEventListener('click',e=>{
    e.stopPropagation();
    const manage=$('hmManage');
    const open=manage.style.display==='flex';
    manage.style.display=open?'none':'flex';
    if(!open)bmRenderManage();
});
$('hmClose').addEventListener('click',()=>{hostMenuEl.style.display='none';});
document.addEventListener('click',e=>{
    if(!hostMenuEl.contains(e.target)&&e.target!==$('clk'))hostMenuEl.style.display='none';
});
$('hmAddBtn').addEventListener('click',()=>{
    const name=$('hmName').value.trim();
    const url=$('hmUrl').value.trim();
    const note=$('hmNote').value.trim();
    if(!url)return;
    const full=/^https?:\/\//i.test(url)?url:'https://'+url;
    const arr=bmLoad();
    arr.push({name:name||full,url:full,note});
    bmSave(arr);
    $('hmName').value='';$('hmUrl').value='';$('hmNote').value='';
    bmRenderManage();bmRenderMenu();
});

/* ── HELPERS ── */
function fmt(n){return(n>=0?'+':'')+Math.round(n).toLocaleString('en-IN');}
function fmtK(n){
    const sign=n<0?'-':'';
    const abs=Math.abs(n);
    if(abs>=1000)return sign+Math.round(abs/1000)+'K';
    return sign+Math.round(abs).toLocaleString('en-IN');
}
function cls(v){
    const s=String(v||'').toUpperCase();
    if(['BULL','UP','BUY','CE','POSITIVE'].some(k=>s.includes(k)))return'bull';
    if(['BEAR','DOWN','SELL','PE','NEGATIVE'].some(k=>s.includes(k)))return'bear';
    if(s.includes('SIDE'))return'side';
    return'dim';
}
function emojifyEntry(v){
    const s=String(v||'').toUpperCase();
    if(s.includes('BUY')||s.includes('BULL'))return'🟢';
    if(s.includes('SELL')||s.includes('BEAR'))return'🔴';
    if(s==='NONE')return'—';
    return v;
}
function emojifyExit(v){
    const s=String(v||'').toUpperCase();
    if(s.includes('BUY')||s.includes('BULL'))return'▲';
    if(s.includes('SELL')||s.includes('BEAR'))return'▼';
    if(s.includes('SIDE'))return'●';
    if(s==='NONE')return'—';
    return v;
}
function emojifyTrend(v){
    const s=String(v||'').toUpperCase();
    if(s.includes('BUY')||s.includes('BULL'))return'🟩';
    if(s.includes('SELL')||s.includes('BEAR'))return'🟥';
    if(s.includes('SIDE'))return'🟨';
    if(s==='NONE')return'—';
    return v;
}
function shortSym(s){
    if(!s)return'—';
    return s;
}
function lotSz(s){return(s||'').includes('BANKNIFTY')?30:65;}

/* ── SORT STATE ── */
let psCol='pnl',psAsc=false;
let trCol='time',trAsc=false;

function sortPos(col){

    // update button highlight
    ['tag','pnl'].forEach(c=>{
        const btn=$('posSortTag');const btn2=$('posSortPnl');
        if(btn)btn.style.borderColor=psCol==='tag'?cssVar('--accent'):cssVar('--border');
        if(btn)btn.style.color=psCol==='tag'?cssVar('--accent'):cssVar('--muted');
        if(btn2)btn2.style.borderColor=psCol==='pnl'?cssVar('--accent'):cssVar('--border');
        if(btn2)btn2.style.color=psCol==='pnl'?cssVar('--accent'):cssVar('--muted');
    });
    loadPos();
}
function sortTrd(col){
    if(trCol===col)trAsc=!trAsc;else{trCol=col;trAsc=false;}
    const btn=$('trdSortTag');const btn2=$('trdSortPnl');const btn3=$('trdSortTime');
    if(btn)btn.style.borderColor=trCol==='tag'?cssVar('--accent'):cssVar('--border');
    if(btn)btn.style.color=trCol==='tag'?cssVar('--accent'):cssVar('--muted');
    if(btn3)btn3.style.borderColor=trCol==='time'?cssVar('--accent'):cssVar('--border');
    if(btn3)btn3.style.color=trCol==='time'?cssVar('--accent'):cssVar('--muted');
    if(btn2)btn2.style.borderColor=trCol==='pnl'?cssVar('--accent'):cssVar('--border');

/* ── TABS ── */
function switchTab(tabId){
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    $(tabId).classList.add('active');
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    // fit terminal if switching to it
    if(tabId==='paneTerminal'&&fit){setTimeout(()=>fit.fit(),50);if(term)term.clear();connect();}
    if(tabId==='paneChart'&&lastCandles)setTimeout(()=>{drawChart(lastCandles);drawMomentumBar(lastMoCandles);},50);
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
});

/* ── SWIPE UP/DOWN TO CYCLE TABS (circular) ── */
(function(){
    const tabOrder=['paneTerminal','paneChart','panePositions'];
    let sY=0,sX=0,sT=0;
    document.addEventListener('touchstart',e=>{
        if(e.touches.length!==1)return;
        sY=e.touches[0].clientY;sX=e.touches[0].clientX;sT=Date.now();
    },{passive:true});
    document.addEventListener('touchend',e=>{
        const t=e.changedTouches[0];if(!t)return;
        const dy=t.clientY-sY,dx=t.clientX-sX,dt=Date.now()-sT;
        if(Math.abs(dy)<60||Math.abs(dy)<Math.abs(dx)*1.3||dt>550)return;
        const activePane=document.querySelector('.tab-pane.active');
        let idx=tabOrder.indexOf(activePane?activePane.id:'paneTerminal');
        if(idx<0)idx=0;
        idx=dy<0?(idx+1)%tabOrder.length:(idx-1+tabOrder.length)%tabOrder.length;
        switchTab(tabOrder[idx]);
    },{passive:true});
})();

/* ── TERMINAL ── */
let term,fit,ws;
function initTerm(){
    term=new Terminal({
        convertEol:true,scrollback:500,fontFamily:"'DM Mono',monospace",
        fontSize:15,lineHeight:1.45,cursorBlink:false,disableStdin:true,
        theme:{background:'#00000000',foreground:'#8899bb',green:'#22c55e',
               red:'#ef4444',yellow:'#f59e0b',cyan:'#22d3ee',brightBlack:'#374151'}
    });
    fit=new FitAddon.FitAddon();
    term.loadAddon(fit);term.open($('termBox'));
    setTimeout(()=>fit.fit(),80);
    new ResizeObserver(()=>fit.fit()).observe($('termBox'));
}
function setStatus(state){
    const dot=$('statusDot');
    dot.className='';
    if(state==='connected'){dot.classList.add('connected');dot.title='LIVE';}
    else if(state==='error'){dot.classList.add('error');dot.title='ERROR';}
    else{dot.title='OFFLINE';}
}
function connect(){
    if(ws){try{ws.close();}catch(e){}}
    setStatus('connecting');
    const proto=location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(`${proto}://${location.host}`);
    ws.onopen=()=>{setStatus('connected');term.clear();term.write('\x1b[32m[connected]\x1b[0m\r\n');};
    ws.onmessage=e=>{term.write(e.data);term.scrollToBottom();};
    ws.onerror=()=>{setStatus('error');term.write('\r\n\x1b[31m[connection error]\x1b[0m');};
    ws.onclose=()=>{setStatus('offline');term.write('\r\n\x1b[33m[disconnected]\x1b[0m');};
}
$('reconnectBtn').addEventListener('click',()=>{term.clear();connect();});

/* ── SIGNAL DASH ── */
async function loadDash(){
    try{
        const d=await fetch('./webdashpxy.json?_='+Date.now()).then(r=>r.json());
        const setV=(id,val,c)=>{
            const el=$(id);if(!el)return;
            el.textContent=val??'—';
            if(c){el.className='sc-val';if(c!=='sc-val')el.classList.add(c);}
        };
        setV('hcEntry',emojifyEntry(d.entry??'NONE'),cls(d.entry||''));
        setV('hcExit', emojifyExit(d.exit??'NONE'), cls(d.exit||''));
        setV('hcTrend',emojifyTrend(d.supertrend),   cls(d.supertrend||''));
        setV('hcATR',  `${d.atr??'—'}`, 'sc-val');

        ['cellEntry','cellExit','cellTrend','cellATR'].forEach(id=>{
            const el=$(id);if(!el)return;
            el.className='sig-cell';
            const v=id==='cellEntry'?d.entry:id==='cellExit'?d.exit:id==='cellTrend'?d.supertrend:'';
            const c=cls(v||'');
            if(c==='bull')el.classList.add('bull-cell');
            else if(c==='bear')el.classList.add('bear-cell');
        });

        // Depth / Power
        const raw=d.candle_visual||'';
        const cePow=d.ce_power||1, pePow=d.pe_power||1;
        const re=/\u001b\[(\d+)m(\d+)\u001b\[0m/g;
        let m;const items=[];
        while((m=re.exec(raw))!==null)items.push({n:+m[2],bull:m[1]==='92'});
        if(items.length){
            const last=items[items.length-1];
            let si=items.length-1;
            while(si>0&&items[si-1].bull===last.bull)si--;
            const depth=items.length-si;
            const power=last.bull?cePow:pePow;
            const dpEl=$('dpText');
            if(dpEl){
                dpEl.textContent=`📊${depth} 🚦 ⚡${power}`;
                dpEl.className='sc-val '+(last.bull?'bull':'bear');
            }
            const cellDP=$('cellDP');
            if(cellDP){
                cellDP.className='sig-cell';
                cellDP.style.flex='2';
                cellDP.classList.add(last.bull?'bull-cell':'bear-cell');
            }
        }
    }catch(e){}
}

/* ── CHART ── */
let lastCandles=null,lastMoCandles=null;
let chartMode='candle';
function setChartMode(mode){
    chartMode=mode;
    const c=$('chartModeCandle'),l=$('chartModeLine');
    if(c){c.style.borderColor=mode==='candle'?cssVar('--accent'):cssVar('--border');c.style.color=mode==='candle'?cssVar('--accent'):cssVar('--muted');}
    if(l){l.style.borderColor=mode==='line'?cssVar('--accent'):cssVar('--border');l.style.color=mode==='line'?cssVar('--accent'):cssVar('--muted');}

function drawChart(candles){
    const canvas=$('priceChart');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    ctx.clearRect(0,0,W,H);
    if(!candles||!candles.length)return;

    const MAX=60;
    const vis=candles.slice(-MAX);
    const n=vis.length;
    if(!n)return;
    const startIdx=candles.length-n;

    let lo=Infinity,hi=-Infinity;
    vis.forEach(c=>{
        if(c.l!=null)lo=Math.min(lo,c.l);
        if(c.h!=null)hi=Math.max(hi,c.h);
        if(c.st_line!=null){lo=Math.min(lo,c.st_line);hi=Math.max(hi,c.st_line);}
        if(c.mirror_line!=null){lo=Math.min(lo,c.mirror_line);hi=Math.max(hi,c.mirror_line);}
    });
    if(!isFinite(lo)||!isFinite(hi))return;
    const pad=(hi-lo)*0.08||1;
    lo-=pad;hi+=pad;
    const range=hi-lo||1;

    const rightPad=40;
    const plotW=W-rightPad;
    const cw=plotW/n;
    const bodyW=Math.max(2,cw*0.6);
    const toY=v=>H-((v-lo)/range)*H;
    const toX=i=>i*cw+cw/2;

    // grid + price labels
    ctx.strokeStyle=cssVar('--grid');ctx.lineWidth=1;
    ctx.font="8px 'DM Mono',monospace";
    ctx.fillStyle=cssVar('--muted');
    ctx.textAlign='left';ctx.textBaseline='middle';
    const ticks=4;
    for(let t=0;t<=ticks;t++){
        const v=lo+(range*t/ticks);
        const y=toY(v);
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(plotW,y);ctx.stroke();
        ctx.fillText(Math.round(v),plotW+4,y);
    }

    // candles — flat matte bodies
    if(chartMode==='line'){
        ctx.beginPath();
        let started=false;
        vis.forEach((c,i)=>{
            if(c.c==null)return;
            const x=toX(i),y=toY(c.c);
            if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
        });
        ctx.strokeStyle='rgba(200,200,205,0.55)';ctx.lineWidth=1;ctx.stroke();
    }else{
    vis.forEach((c,i)=>{
        if(c.o==null||c.h==null||c.l==null||c.c==null)return;
        const x=toX(i);
        const prevClose=i>0?vis[i-1].c:(candles[startIdx-1]?.c??c.o);
        const isBull=prevClose!=null?c.c>=prevClose:c.c>=c.o;
        const color=isBull?cssVar('--bull'):cssVar('--bear');

        ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(x,toY(c.h));ctx.lineTo(x,toY(c.l));
        ctx.stroke();

        const yOpen=toY(c.o),yClose=toY(c.c);
        const bodyTop=Math.min(yOpen,yClose);
        const bodyH=Math.max(3,Math.abs(yClose-yOpen));
        const bx=x-bodyW/2;
        const r=Math.min(bodyW/2,2);

        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.roundRect(bx,bodyTop,bodyW,bodyH,r);
        ctx.fill();
    });
    }

    // ST_LINE — colored per-segment by trend (BULL/BEAR/SIDE)
    ctx.lineWidth=1.6;
    for(let i=1;i<n;i++){
        const c0=vis[i-1],c1=vis[i];
        if(c0.st_line==null||c1.st_line==null)continue;
        const trend=String(c1.trend||c0.trend||'SIDE').toUpperCase();
        ctx.strokeStyle=trend==='BULL'?cssVar('--bull'):trend==='BEAR'?cssVar('--bear'):'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.moveTo(toX(i-1),toY(c0.st_line));
        ctx.lineTo(toX(i),toY(c1.st_line));
        ctx.stroke();
    }

    // MIRROR_LINE — always neutral white
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;
    ctx.beginPath();
    let mStarted=false;
    vis.forEach((c,i)=>{
        if(c.mirror_line==null)return;
        const x=toX(i),y=toY(c.mirror_line);
        if(!mStarted){ctx.moveTo(x,y);mStarted=true;}else ctx.lineTo(x,y);
    });
    ctx.stroke();
}
function drawMomentumBar(candles){
    if(!candles||!candles.length)return;
    lastMoCandles=candles;
    const last=candles.at(-1);
    if(!last||last.c==null||last.st_line==null||last.mirror_line==null)return;
    const canvas=$('momentumCandle');
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    ctx.clearRect(0,0,W,H);
    if(W<4||H<10)return;
    const PADY=8,midX=W/2,bodyW=Math.max(8,W*0.45);
    const recent=candles.slice(-60);
    const all=recent.flatMap(c=>[c.c,c.st_line,c.mirror_line]).filter(v=>v!=null);
    const high=Math.max(...all),low=Math.min(...all),range=high-low||1;
    const toY=v=>H-PADY-((v-low)/range)*(H-PADY*2);

    // trend drives color: BULL/BEAR = breakout beyond both lines, SIDE = still inside the channel
    const trend=String(last.trend||'SIDE').toUpperCase();
    const bodyColor=trend==='BULL'?cssVar('--bull'):trend==='BEAR'?cssVar('--bear'):'#e5e7eb';
    const glowColor=trend==='BULL'?'rgba(38,166,154,0.35)':trend==='BEAR'?'rgba(239,83,80,0.35)':'rgba(229,231,235,0.3)';
    // track
    const tg=ctx.createLinearGradient(0,0,0,H);
    tg.addColorStop(0,'rgba(0,0,0,0)');tg.addColorStop(0.08,cssVar('--track-mid'));
    tg.addColorStop(0.92,cssVar('--track-mid'));tg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.strokeStyle=tg;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(midX,PADY);ctx.lineTo(midX,H-PADY);ctx.stroke();
    // wick = the st_line <-> mirror_line channel at the current bar
    const chHigh=Math.max(last.st_line,last.mirror_line),chLow=Math.min(last.st_line,last.mirror_line);
    const wy1=toY(chLow),wy2=toY(chHigh);
    ctx.strokeStyle=bodyColor;ctx.lineWidth=1.5;ctx.globalAlpha=0.45;
    ctx.beginPath();ctx.moveTo(midX,wy1);ctx.lineTo(midX,wy2);ctx.stroke();
    ctx.globalAlpha=1;
    const capW=Math.max(5,W*0.28);
    [wy1,wy2].forEach(y=>{ctx.beginPath();ctx.moveTo(midX-capW/2,y);ctx.lineTo(midX+capW/2,y);ctx.stroke();});
    // body = close <-> st_line (how far price has moved from the trend line, colored by trend state)
    const open=last.st_line,close=last.c;
    const by1=toY(Math.max(open,close)),by2=toY(Math.min(open,close)),bH=Math.max(by2-by1,4);
    ctx.fillStyle=bodyColor;
    ctx.beginPath();ctx.roundRect(midX-bodyW/2,by1,bodyW,bH,3);ctx.fill();
}

let tradeChart=null, tradeCandles=[], activeTrade=null;

function parseAnyTs(raw){
    if(raw==null)return NaN;
    let s=String(raw).trim().replace(' ','T');
    if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s))s+='+05:30';
    return new Date(s).getTime();
}
function tsToTradeIndex(ts){
    const tradeMs=parseAnyTs(ts);
    let best=0,bestDiff=Infinity;
    tradeCandles.forEach((c,i)=>{
        const t=c.t??c.time??c.timestamp??null;
        if(t==null)return;
        const d=Math.abs(parseAnyTs(t)-tradeMs);
        if(d<bestDiff){bestDiff=d;best=i;}
    });
    return best;
}
function indexToTradePixel(idx){
    const meta=tradeChart?.getDatasetMeta(0);
    const pt=meta?.data[idx];
    return pt?{x:pt.x,y:pt.y}:null;
}

async function openTradeChart(t){
    activeTrade=t;
    const isCE=(t.Symbol||'').toUpperCase().endsWith('CE');
    const pnl=t.PNL||0;
    $('tradeChartLabel').textContent=`${shortSym(t.Symbol)} · #${t.Tag||'—'} · ${pnl>=0?'+':''}${Math.round(pnl).toLocaleString('en-IN')}`;

    try{

            tradeCandles=data.map(r=>({t:r.time||r.timestamp||null,c:r.Close??r.close,st:r.st??null}));
        }else if(data.columns){
            const ci=k=>data.columns.indexOf(k);
            const C=ci('Close'),ST=ci('st');
            tradeCandles=data.index.map((ts,i)=>({t:ts,c:data.data[i][C],st:ST>=0?data.data[i][ST]:null}));
        }
    }catch(e){tradeCandles=[];}

    const closes=tradeCandles.map(d=>d.c);

    drawTradeChart(closes,st);
    setTimeout(()=>redrawTradeMarkers(),200);
    setTimeout(()=>redrawTradeMarkers(),500);
}

function drawTradeChart(closes,st){
    const pad=4;
    const labels=[...closes.map((_,i)=>i),...Array(pad).fill('')];
    const cp=[...closes,...Array(pad).fill(null)];
    const sp=[...st,...Array(pad).fill(null)];
    if(tradeChart){tradeChart.destroy();tradeChart=null;}
    tradeChart=new Chart($('tradeChart'),{
        type:'line',
        data:{labels,datasets:[
            {data:cp,borderColor:'rgba(255,255,255,0.75)',borderWidth:1.5,pointRadius:0,fill:true,tension:0.2,
             backgroundColor:ctx2=>{
                 const g=ctx2.chart.ctx.createLinearGradient(0,0,0,ctx2.chart.height);
                 g.addColorStop(0,'rgba(255,255,255,0.06)');g.addColorStop(1,'rgba(0,0,0,0)');return g;}},
            {data:sp,borderColor:'rgba(202,138,4,0.65)',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false,tension:0.2}
        ]},
        options:{animation:false,responsive:true,maintainAspectRatio:false,
            plugins:{legend:{display:false},tooltip:{enabled:false}},
            scales:{
                x:{display:false},
                y:{display:true,position:'right',
                   grid:{color:cssVar('--grid'),drawBorder:false},
                   ticks:{color:cssVar('--muted'),font:{family:"'DM Mono',monospace",size:9},maxTicksLimit:5}}
            }}
    });
}

function redrawTradeMarkers(){
    const svg=$('tradeMarkerLayer');
    svg.innerHTML='';
    if(!tradeChart||!activeTrade||!tradeCandles.length)return;
    const W=tradeChart.canvas.offsetWidth,H=tradeChart.canvas.offsetHeight;
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svg.style.width=W+'px';svg.style.height=H+'px';

    const t=activeTrade;
    const buyIdx=tsToTradeIndex(t.Buy_Time);
    const sellIdx=tsToTradeIndex(t.Exit_Time||t.Buy_Time);
    const buyPt=indexToTradePixel(buyIdx);
    const sellPt=indexToTradePixel(sellIdx);
    if(!buyPt||!sellPt)return;

    const isCE=(t.Symbol||'').toUpperCase().endsWith('CE');
    const isBull=(t.PNL||0)>=0;
    const lineC=isCE?cssVar('--bull'):cssVar('--bear');

    // connecting line
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',buyPt.x);line.setAttribute('y1',buyPt.y);
    line.setAttribute('x2',sellPt.x);line.setAttribute('y2',sellPt.y);
    line.setAttribute('stroke',lineC);line.setAttribute('stroke-width','2');line.setAttribute('opacity','0.4');
    svg.appendChild(line);

    // entry ✓ tick
    svg.appendChild(makeTradeMarker(buyPt.x,buyPt.y,true,cssVar('--bull')));
    // exit ✗ cross
    svg.appendChild(makeTradeMarker(sellPt.x,sellPt.y,false,isBull?cssVar('--bull'):cssVar('--bear')));
}

function makeTradeMarker(x,y,isBuy,color){
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const gap=14,s=6,sw=2.5;
    // glow circle
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',x);circle.setAttribute('cy',isBuy?y+gap:y-gap);
    circle.setAttribute('r',10);circle.setAttribute('fill',color);circle.setAttribute('opacity','0.12');
    g.appendChild(circle);
    if(isBuy){
        const cy=y+gap;
        const tick=document.createElementNS('http://www.w3.org/2000/svg','polyline');
        tick.setAttribute('points',`${x-s},${cy} ${x-1},${cy+s} ${x+s},${cy-s+1}`);
        tick.setAttribute('stroke',color);tick.setAttribute('stroke-width',sw);
        tick.setAttribute('fill','none');tick.setAttribute('stroke-linecap','round');tick.setAttribute('stroke-linejoin','round');
        g.appendChild(tick);
    }else{
        const cy=y-gap;
        ['1','2'].forEach((_,i)=>{
            const l=document.createElementNS('http://www.w3.org/2000/svg','line');
            l.setAttribute('x1',i===0?x-s:x+s);l.setAttribute('y1',cy-s);
            l.setAttribute('x2',i===0?x+s:x-s);l.setAttribute('y2',cy+s);
            l.setAttribute('stroke',color);l.setAttribute('stroke-width',sw);l.setAttribute('stroke-linecap','round');
            g.appendChild(l);
        });
    }
    return g;
}

let lastFloor=-3000,lastNet=0,lastPeak=10;
function drawRiskCandle(floor,net,peak){
    lastFloor=floor;lastNet=net;lastPeak=peak;
    const canvas=$('rskCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;ctx.clearRect(0,0,W,H);
    const PADX=12,midY=H/2,bodyH=Math.max(10,H*0.45);
    const lo=-3000,hi=Math.max(peak,10),open=0,close=net,range=hi-lo||1;
    const toX=v=>Math.max(PADX,Math.min(W-PADX,((v-lo)/range)*(W-PADX*2)+PADX));
    const lowX=toX(lo),highX=toX(hi),openX=toX(open),closeX=toX(close);
    const isBull=close>=open;
    const bodyColor=isBull?cssVar('--bull'):cssVar('--bear');
    const glowColor=isBull?'rgba(38,166,154,0.35)':'rgba(239,83,80,0.35)';
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(lowX,midY);ctx.lineTo(highX,midY);ctx.stroke();
    ctx.lineWidth=2;ctx.globalAlpha=0.8;
    ctx.strokeStyle=cssVar('--bear');ctx.beginPath();ctx.moveTo(lowX,midY-bodyH/2);ctx.lineTo(lowX,midY+bodyH/2);ctx.stroke();
    ctx.strokeStyle=cssVar('--bull');ctx.beginPath();ctx.moveTo(highX,midY-bodyH/2);ctx.lineTo(highX,midY+bodyH/2);ctx.stroke();
    ctx.globalAlpha=1;
    if(openX>PADX+2&&openX<W-PADX-2){
        ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(openX,midY-bodyH/2);ctx.lineTo(openX,midY+bodyH/2);ctx.stroke();
        ctx.setLineDash([]);
    }
    const netLabel='₹'+(net>=0?'+':'')+Math.round(net).toLocaleString('en-IN');
    const fz=Math.round(Math.min(18,Math.max(13,H*0.4)));
    ctx.font=`800 ${fz}px 'Syne',sans-serif`;
    const textW=ctx.measureText(netLabel).width+14;
    let bx1=Math.min(openX,closeX),bx2=Math.max(openX,closeX);
    const midX=(bx1+bx2)/2;
    let bW=Math.max(bx2-bx1,textW);
    bx1=midX-bW/2;bx2=midX+bW/2;
    if(bx1<PADX){bx2+=PADX-bx1;bx1=PADX;}
    if(bx2>W-PADX){bx1-=bx2-(W-PADX);bx2=W-PADX;}
    bx1=Math.max(PADX,bx1);bW=bx2-bx1;
    ctx.fillStyle=bodyColor;
    ctx.beginPath();ctx.roundRect(bx1,midY-bodyH/2,bW,bodyH,4);ctx.fill();
    ctx.fillStyle=isBull?'#06160d':'#ffffff';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(netLabel,(bx1+bx2)/2,midY);
    const danger=net<=lo+Math.abs(lo)*0.15;
    $('riskBar').style.boxShadow=danger?'0 0 0 1px rgba(239,83,80,0.5)':'';
}

const logo=$('logoRefresh'),amenu=$('actionsMenu');

$('amenuClose').addEventListener('click',()=>{amenu.style.display='none';});

            $('updPwd').value='';
            $('updPopup').style.display='flex';

        }
        pendingScript=script;amenu.style.display='none';

function cancelUpdate(){$('updPopup').style.display='none';$('updPwd').value='';pendingScript=null;}
function confirmUpdate(){
    const pwd=$('updPwd').value.trim();if(!pwd||!pendingScript)return;
    if(pwd!=='1'){
        const inp=$('updPwd');
        inp.style.borderColor=cssVar('--bear');inp.value='';inp.placeholder='wrong password';
        setTimeout(()=>{inp.style.borderColor='var(--border2)';inp.placeholder='password';},1000);
        inp.focus();
        return;
    }

    // special path: viewing pxyconfig — password required just to open it
    if(pendingScript==='__pxyconfig_view__'){
        $('updPopup').style.display='none';$('updPwd').value='';pendingScript=null;
        openConfigModal();
        return;
    }

    // special path: saving pxyconfig fields
    if(pendingScript==='__pxyconfig_save__'){
        $('updPopup').style.display='none';$('updPwd').value='';pendingScript=null;
        const values={};
        CFG_FIELDS.forEach(f=>{values[f.key]=$('cfgInput_'+f.key).value;});
        $('cfgStatus').textContent='saving...';
        fetch('/pxyconfig-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pwd,values})})
        .then(r=>r.json())
        .then(d=>{
            if(d.ok){
                $('cfgStatus').textContent='✓ saved';
                setTimeout(()=>{$('cfgModal').style.display='none';},900);
            }else{
                $('cfgStatus').textContent='✗ '+(d.error||'save failed');
            }
        })
        .catch(e=>{$('cfgStatus').textContent='✗ '+e.message;});
        return;
    }

    const script=pendingScript;$('updPopup').style.display='none';$('updPwd').value='';pendingScript=null;
    const orig=logo.innerHTML;logo.innerHTML='⏳';
    fetch(`/run/${script}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pwd})})
    .then(r=>r.json())
    .then(d=>{
        logo.innerHTML=d.ok?'✓':'✗';setTimeout(()=>{logo.innerHTML=orig;},2500);
        const text=(d.output||'')+(d.error?'\n⚠ '+d.error:'');
        $('aoLabel').textContent=d.ok?`✓ ${script}`:`✗ ${script}`;
        $('aoText').textContent=text.trim()||'(no output)';$('actionOutput').style.display='block';
    })
    .catch(e=>{logo.innerHTML='✗';setTimeout(()=>{logo.innerHTML=orig;},2500);
        $('aoLabel').textContent=`✗ ${script}`;$('aoText').textContent=e.message;$('actionOutput').style.display='block';});
}

/* ── PXYCONFIG EDITOR ── */
const CFG_FIELDS=[
    {key:'CONSUMER_KEY',    label:'Consumer Key',   masked:true},
    {key:'CONSUMER_SECRET', label:'Consumer Secret',masked:true},
    {key:'MOBILE_NUMBER',   label:'Mobile Number',  masked:false},
    {key:'UCC',             label:'UCC',            masked:false},
    {key:'MPIN',            label:'MPIN',           masked:true},
    {key:'TOTP_SECRET_KEY', label:'TOTP Secret Key',masked:true},
    {key:'ENVIRONMENT',     label:'Environment',    masked:false}
];
function buildConfigFields(values){
    const box=$('cfgFields');
    box.innerHTML='';
    CFG_FIELDS.forEach(f=>{
        const wrap=document.createElement('div');
        wrap.className='cfg-field';
        const val=(values&&values[f.key])||'';
        wrap.innerHTML=`
            <span class="cfg-label">${f.label}</span>
            <div class="cfg-row">
                <input class="cfg-input" id="cfgInput_${f.key}" type="${f.masked?'password':'text'}" value="${val.replace(/"/g,'&quot;')}">
                ${f.masked?`<span class="cfg-toggle" data-key="${f.key}">👁</span>`:''}
            </div>`;
        box.appendChild(wrap);
    });
    box.querySelectorAll('.cfg-toggle').forEach(t=>{
        t.addEventListener('click',()=>{
            const inp=$('cfgInput_'+t.dataset.key);
            inp.type=inp.type==='password'?'text':'password';
        });
    });
}
function openConfigModal(){
    $('cfgModal').style.display='flex';
    $('cfgStatus').textContent='loading...';
    $('cfgFields').innerHTML='';
    fetch('/pxyconfig-read').then(r=>r.json()).then(d=>{
        if(d.ok){
            buildConfigFields(d.values);
            $('cfgStatus').textContent='';
        }else{
            $('cfgStatus').textContent='✗ '+(d.error||'read failed');
        }
    }).catch(e=>{$('cfgStatus').textContent='✗ '+e.message;});
}
$('cfgCancel').addEventListener('click',()=>{$('cfgModal').style.display='none';});
$('cfgSave').addEventListener('click',()=>{
    pendingScript='__pxyconfig_save__';
    $('updTitle').textContent='▶ Save PXYCONFIG';
    $('updPwd').value='';
    $('updPopup').style.display='flex';
    setTimeout(()=>$('updPwd').focus(),80);
});

let optLegendOpen=false;
async function loadOptSummary(){
    let d=null;try{d=await fetch('./webavgpxy.json?_='+Date.now()).then(r=>r.json());}catch{}
    d=d||{};
    const ov=$('optOverlay');
    const colMeta=[
        {emoji:'📦🔢',label:'LOT',desc:'Lots traded'},
        {emoji:'💰🏦',label:'INV',desc:'Invested amount'},
        {emoji:'🏃⚡',label:'RUN',desc:'(Loss threshold) Running P&L (Target)'},
        {emoji:'💹⚖️',label:'PNL',desc:'Profit &amp; Loss'}
    ];
    const toK=n=>Math.round((n||0)/1000)+'k';
    const rnd=n=>Math.round(n||0);
    const plainSign=n=>(Number(n||0)>=0?'+':'')+Math.round(n||0);
    const pad2=n=>{const r=Math.round(n||0);const a=Math.min(Math.abs(r),99);return (r<0?'-':'')+String(a).padStart(2,'0');};
    const buildRow=(lots,pnl,inv,lgt,runPct,aligned,decision)=>{
        const tgtNum=aligned?99:1.4;
        const runColor=Number(runPct)<Number(lgt)?'var(--bear)':Number(runPct)>tgtNum?'var(--bull)':null;
        const row=[lots??'—', toK(inv), `(${pad2(lgt)})${pad2(runPct)}(${pad2(tgtNum)})`, plainSign(pnl)];
        return {row,runColor};
    };
    const ceRes=buildRow(d.ce_lots,d.ce_pnl,d.ce_investment,d.ce_lgt,d.ce_run_pct,d.ce_aligned,d.ce_decision);
    const peRes=buildRow(d.pe_lots,d.pe_pnl,d.pe_investment,d.pe_lgt,d.pe_run_pct,d.pe_aligned,d.pe_decision);
    const ceRow=ceRes.row,peRow=peRes.row;
    let html='<div style="position:relative;padding:3px 0;">';
    html+=`<button id="optInfoBtn" style="position:absolute;top:1px;right:2px;z-index:2;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:1px 4px;line-height:1;">ⓘ</button>`;
    html+=`<div id="optLegend" style="display:${optLegendOpen?'block':'none'};position:absolute;top:16px;right:2px;z-index:3;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 9px;font-size:9.5px;color:var(--text);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3);text-align:left;line-height:1.7;">`;
    html+=colMeta.map(c=>`${c.emoji}&nbsp;<b>${c.label}</b> — ${c.desc}`).join('<br>');
    html+='</div>';
    html+='<table class="opt-tbl"><tbody><tr class="opt-ce">';
    ceRow.forEach((v,i)=>{
        let style=i===0?'color:var(--bull);font-weight:700;':(i===2&&ceRes.runColor?`color:${ceRes.runColor};font-weight:700;`:'');
        html+=`<td style="${style}" title="${colMeta[i].label}: ${colMeta[i].desc}">${v}</td>`;
    });
    html+='</tr><tr class="opt-pe">';
    peRow.forEach((v,i)=>{
        let style=i===0?'color:var(--bear);font-weight:700;':(i===2&&peRes.runColor?`color:${peRes.runColor};font-weight:700;`:'');
        html+=`<td style="${style}" title="${colMeta[i].label}: ${colMeta[i].desc}">${v}</td>`;
    });
    html+='</tr></tbody></table></div>';
    ov.innerHTML=html;
    ov.style.display='block';
    const infoBtn=$('optInfoBtn');
    if(infoBtn)infoBtn.onclick=e=>{e.stopPropagation();optLegendOpen=!optLegendOpen;const lg=$('optLegend');if(lg)lg.style.display=optLegendOpen?'block':'none';};
}
