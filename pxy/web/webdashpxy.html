<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080d">
<title>PXY® — Signal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root,[data-theme="dark"]{
    --bg:#06080d;--bg2:#0c101a;--bg3:#111827;
    --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.13);
    --text:#e8ecf4;--muted:#5b6478;--accent:#3b82f6;
    --bull:#22c55e;--bear:#ef4444;--gold:#f59e0b;
    --bull-dim:rgba(34,197,94,0.12);--bear-dim:rgba(239,68,68,0.12);
    --grid:rgba(255,255,255,0.035);
    --hero-h:52px;--candle-h:56px;--bottom-h:36px;
}
[data-theme="light"]{
    --bg:#f1f5fb;--bg2:#fff;--bg3:#eef1f8;
    --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.14);
    --text:#0f172a;--muted:#94a3b8;--accent:#2563eb;
    --bull:#16a34a;--bear:#dc2626;--gold:#d97706;
    --bull-dim:rgba(22,163,74,0.11);--bear-dim:rgba(220,38,38,0.11);
    --grid:rgba(0,0,0,0.04);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
body{
    height:100dvh;display:flex;flex-direction:column;
    font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);
    transition:background 0.35s,color 0.35s;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;overflow:hidden;
}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
::-webkit-scrollbar{width:2px;height:2px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ══ CANDLE BAR (top) ══ */
#candleBar{
    height:var(--candle-h);flex-shrink:0;
    display:flex;align-items:center;
    background:var(--bg2);border-bottom:1px solid var(--border);
    padding:0 8px;gap:0;overflow:hidden;
    transition:background 0.35s,border-color 0.35s;
}

/* ══ HERO BAR (below candles) ══ */
#heroBar{
    height:var(--hero-h);flex-shrink:0;
    display:flex;align-items:stretch;
    background:var(--bg2);border-bottom:1px solid var(--border);
    overflow:hidden;transition:background 0.35s,border-color 0.35s,box-shadow 0.5s;
}

.hero-cell{
    display:flex;flex-direction:column;justify-content:center;
    padding:0 clamp(8px,1.5vw,18px);
    border-right:1px solid var(--border);
    flex:1;min-width:0;gap:1px;
}
.hero-cell:last-child{border-right:none;}
.hero-cell.narrow{flex:0.5;}

.hc-label{font-size:7px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.hc-val{
    font-family:'Syne',sans-serif;font-weight:800;
    font-size:clamp(13px,1.8vw,20px);letter-spacing:-0.3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
}
.hc-val.bull{color:var(--bull);}
.hc-val.bear{color:var(--bear);}
.hc-val.gold{color:var(--gold);}
.hc-val.blue{color:var(--accent);}
.hc-val.neutral{color:var(--text);}
.hc-val.muted{color:var(--muted);}

/* nav */
.hero-nav{display:flex;align-items:center;gap:6px;padding:0 clamp(8px,1.5vw,14px);flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:4px;padding:3px 9px;border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-size:10px;text-decoration:none;font-family:'DM Mono',monospace;transition:all 0.2s;white-space:nowrap;}
.back-btn:hover{color:var(--text);background:var(--bg3);}
.dv{width:1px;height:16px;background:var(--border2);flex-shrink:0;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;white-space:nowrap;}
.logo sup{font-size:0.5em;vertical-align:super;color:var(--accent);}
.theme-toggle{display:flex;align-items:center;cursor:pointer;user-select:none;}
.toggle-track{width:28px;height:15px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);position:relative;transition:background 0.35s;}
[data-theme="light"] .toggle-track{background:var(--accent);border-color:var(--accent);}
.toggle-thumb{position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--muted);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
[data-theme="light"] .toggle-thumb{transform:translateX(13px);background:#fff;}

/* candle seq */
.candle-seq{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;padding:6px 4px 4px;overflow:hidden;}
.cs-unit{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;gap:1px;}
.cs-bar{width:100%;max-width:16px;border-radius:2px 2px 0 0;height:24px;flex-shrink:0;}
.cs-bar.bull{background:var(--bull);opacity:0.85;}
.cs-bar.bear{background:var(--bear);opacity:0.85;}
.cs-num{font-size:8px;font-weight:500;white-space:nowrap;}
.cs-num.bull{color:var(--bull);}
.cs-num.bear{color:var(--bear);}
.candle-label{font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;text-orientation:mixed;padding:0 4px;flex-shrink:0;}

/* ══ MIDDLE ══ */
#middle{flex:1;display:flex;overflow:hidden;min-height:0;}

.side-candle{width:clamp(24px,3vw,40px);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:4px;transition:background 0.35s,border-color 0.35s;}
.side-candle.right{border-right:none;border-left:1px solid var(--border);}
.side-lbl{font-size:7px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;flex-shrink:0;}
.side-candle-wrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0;gap:1px;overflow:hidden;}
.sc-seg{width:clamp(8px,1.5vw,14px);border-radius:1px;flex-shrink:0;}

/* ══ 3 PANELS ══ */
#panels{flex:1;display:flex;overflow:hidden;min-width:0;}
.panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;transition:border-color 0.35s;min-width:0;}
.panel:last-child{border-right:none;}
.panel-top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:32px;background:var(--bg2);border-bottom:1px solid var(--border);transition:background 0.35s,border-color 0.35s;gap:8px;overflow:hidden;}
.pt-label{font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
.pt-val{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(12px,1.4vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pt-val.bull{color:var(--bull);}
.pt-val.bear{color:var(--bear);}

#chartPanel{position:relative;flex:1;overflow:hidden;background:var(--bg);}
#chartPanel .grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:50px 50px;}
#chartPanel canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:1;}

#posPanel{flex:1;overflow-y:auto;}
.pos-row-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--border);gap:8px;transition:background 0.12s;}
.pos-row-item:hover{background:var(--bg3);}
.pri-left{display:flex;flex-direction:column;gap:1px;min-width:0;}
.pri-sym{font-size:clamp(9px,0.9vw,11px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pri-meta{font-size:8px;color:var(--muted);}
.pri-pnl{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(11px,1.2vw,14px);flex-shrink:0;}
.pri-pnl.bull{color:var(--bull);}
.pri-pnl.bear{color:var(--bear);}
.pri-type{font-size:8px;padding:1px 5px;border-radius:2px;flex-shrink:0;}
.pri-type.ce{background:var(--bull-dim);color:var(--bull);}
.pri-type.pe{background:var(--bear-dim);color:var(--bear);}
#posEmpty{padding:24px 10px;text-align:center;color:var(--muted);font-size:11px;}

#tradePanel{flex:1;overflow-y:auto;}
.trade-row-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--border);gap:8px;transition:background 0.12s;}
.trade-row-item:hover{background:var(--bg3);}
.tri-left{display:flex;flex-direction:column;gap:1px;min-width:0;}
.tri-sym{font-size:clamp(9px,0.9vw,11px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tri-meta{font-size:8px;color:var(--muted);}
.tri-pnl{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(11px,1.2vw,14px);flex-shrink:0;}
.tri-pnl.bull{color:var(--bull);}
.tri-pnl.bear{color:var(--bear);}
#tradeEmpty{padding:24px 10px;text-align:center;color:var(--muted);font-size:11px;}

/* ══ BOTTOM BAR ══ */
#bottomBar{height:var(--bottom-h);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-top:1px solid var(--border);transition:background 0.35s,border-color 0.35s;position:relative;overflow:hidden;}
#brandName{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(11px,1.4vw,16px);letter-spacing:0.1em;color:var(--text);transition:color 0.35s;text-align:center;}
#brandName sup{font-size:0.55em;vertical-align:super;color:var(--accent);}
@keyframes bosFlashGreen{0%,100%{color:var(--bull);text-shadow:0 0 20px rgba(34,197,94,0.8);}50%{color:rgba(34,197,94,0.3);text-shadow:none;}}
@keyframes bosFlashRed{0%,100%{color:var(--bear);text-shadow:0 0 20px rgba(239,68,68,0.8);}50%{color:rgba(239,68,68,0.3);text-shadow:none;}}
#brandName.bos-bull{animation:bosFlashGreen 0.8s infinite;}
#brandName.bos-bear{animation:bosFlashRed 0.8s infinite;}
#btClock{position:absolute;right:12px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ══ RESPONSIVE ══ */
@media(max-width:900px){
    .side-candle{display:none;}
    #panels{flex-direction:column;}
    .panel{border-right:none;border-bottom:1px solid var(--border);min-height:200px;}
    .panel:last-child{border-bottom:none;}
}
@media(max-width:640px){
    :root{--hero-h:44px;--candle-h:48px;--bottom-h:28px;}
    .hero-cell{padding:0 6px;}
    .hc-val{font-size:12px;}
}
@media(min-width:1920px){
    :root{--hero-h:64px;--candle-h:70px;--bottom-h:44px;}
    .hc-val{font-size:24px;}
    .cs-bar{height:32px;max-width:20px;}
    .cs-num{font-size:9px;}
}
</style>
</head>
<body>

<!-- ══ ROW 1: CANDLE SEQUENCE ══ -->
<div id="candleBar">
    <div class="hero-nav">
        <a class="back-btn" href="webpxy.html">← PXY</a>
        <div class="dv"></div>
        <span class="logo">PXY<sup>®</sup></span>
        <div class="dv"></div>
        <div class="theme-toggle" id="themeToggle">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
        <div class="dv"></div>
    </div>
    <span class="candle-label">Candles</span>
    <div class="candle-seq" id="candleSeq"></div>
</div>

<!-- ══ ROW 2: HERO BAR ══ -->
<div id="heroBar">
    <div class="hero-cell narrow">
        <span class="hc-label">🟢</span>
        <span class="hc-val bull" id="hcCEDep">—</span>
    </div>
    <div class="hero-cell narrow">
        <span class="hc-label">🟨</span>
        <span class="hc-val bull" id="hcCEPow">—</span>
    </div>
    <div class="hero-cell">
        <span class="hc-label">🛫</span>
        <span class="hc-val" id="hcEntry">—</span>
    </div>
    <div class="hero-cell">
        <span class="hc-label">🛬</span>
        <span class="hc-val" id="hcExit">—</span>
    </div>
    <div class="hero-cell narrow">
        <span class="hc-label">ATR / KATR</span>
        <span class="hc-val gold" id="hcATR">—</span>
    </div>
    <div class="hero-cell">
        <span class="hc-label">📉</span>
        <span class="hc-val" id="hcTrend">—</span>
    </div>
    <div class="hero-cell narrow">
        <span class="hc-label">🟨</span>
        <span class="hc-val bear" id="hcPEPow">—</span>
    </div>
    <div class="hero-cell narrow">
        <span class="hc-label">🔴</span>
        <span class="hc-val bear" id="hcPEDep">—</span>
    </div>
</div>

<!-- ══ MIDDLE ══ -->
<div id="middle">

    <!-- 42min candle — far left -->
    <div class="side-candle" id="sideLeft">
        <span class="side-lbl">42m</span>
        <div class="side-candle-wrap" id="side42"></div>
    </div>

    <!-- 3 panels -->
    <div id="panels">

        <!-- CHART -->
        <div class="panel">
            <div class="panel-top">
                <span class="pt-label">Chart · NIFTY</span>
                <span class="pt-val" id="ptPrice">—</span>
            </div>
            <div id="chartPanel">
                <div class="grid-overlay"></div>
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- POSITIONS -->
        <div class="panel">
            <div class="panel-top">
                <span class="pt-label">Positions</span>
                <span class="pt-val" id="ptPosPnl">—</span>
            </div>
            <div id="posPanel">
                <div id="posEmpty">No open positions</div>
            </div>
        </div>

        <!-- TRADES -->
        <div class="panel">
            <div class="panel-top">
                <span class="pt-label">Trades</span>
                <span class="pt-val" id="ptTradesPnl">—</span>
            </div>
            <div id="tradePanel">
                <div id="tradeEmpty">No trades today</div>
            </div>
        </div>

    </div>

    <!-- Day candle — far right -->
    <div class="side-candle right" id="sideRight">
        <span class="side-lbl">Day</span>
        <div class="side-candle-wrap" id="sideDay"></div>
    </div>

</div>

<!-- ══ BOTTOM BAR ══ -->
<div id="bottomBar">
    <div id="brandName">PreciseXceleratedYield Pvt Ltd<sup>™</sup></div>
    <span id="btClock">—</span>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* ── THEME ── */
$('themeToggle').addEventListener('click',()=>{
    const dark=document.documentElement.getAttribute('data-theme')!=='light';
    document.documentElement.setAttribute('data-theme',dark?'light':'dark');
    if(chart)updateChartTheme();
});

/* ── CLOCK ── */
function tick(){$('btClock').textContent=new Date().toLocaleTimeString('en-IN',{hour12:false});}
tick();setInterval(tick,1000);

/* ── HELPERS ── */
function stripAnsi(s){return String(s||'').replace(/\u001b\[[0-9;]*m/g,'');}
function fmt(n){return(n>=0?'+':'')+Math.round(n).toLocaleString('en-IN');}
function bullBear(v){
    const s=String(v||'').toUpperCase();
    if(['BULL','UP','BUY','CE','POSITIVE'].some(k=>s.includes(k)))return'bull';
    if(['BEAR','DOWN','SELL','PE','NEGATIVE'].some(k=>s.includes(k)))return'bear';
    if(s==='NONE')return'muted';
    return'gold';
}
function emojify(v){
    const s=String(v||'').toUpperCase();
    if(s.includes('BUY')||s.includes('BULL'))return'🟢';
    if(s.includes('SELL')||s.includes('BEAR'))return'🔴';
    if(s==='NONE')return'⚪';
    return v;
}
function set(id,val,cls){
    const el=$(id);if(!el)return;
    el.textContent=val??'—';
    if(cls)el.className=el.className.replace(/\b(bull|bear|gold|blue|neutral|muted)\b/g,'')+' '+cls;
}
function shortSym(s){
    if(!s)return'—';
    const m=s.match(/([A-Z]+)\d{2}([A-Z]{3})\d{2}(C|P)(\d+)/i);
    if(m)return`${m[1]} ${m[2]} ${m[4]} ${m[3]==='C'?'CE':'PE'}`;
    return s.length>18?s.slice(0,16)+'…':s;
}
function lotSize(s){return(s||'').includes('BANKNIFTY')?30:65;}

/* ── LOAD: webdashpxy.json ── */
async function loadDash(){
    try{
        const r=await fetch('./webdashpxy.json?_='+Date.now());
        const d=await r.json();
        renderDash(d);
    }catch(e){console.error('dash',e);}
}

function renderDash(d){
    set('hcATR',   `${d.atr??'—'} / ${d.katr??'—'}`, 'gold');
    set('hcTrend', emojify(d.supertrend), bullBear(d.supertrend));
    set('hcEntry', emojify(d.entry??'NONE'), d.entry&&d.entry!=='NONE'?bullBear(d.entry):'muted');
    set('hcExit',  emojify(d.exit??'NONE'),  d.exit&&d.exit!=='NONE'?bullBear(d.exit):'muted');
    set('hcCEDep', d.hkin_ce_depth, 'bull');
    set('hcPEDep', d.hkin_pe_depth, 'bear');
    set('hcCEPow', d.ce_power,      'bull');
    set('hcPEPow', d.pe_power,      'bear');
    set('ptPrice', d.price,         bullBear(d.direction));

    // hero bar glow
    const isUp=String(d.direction||'').toUpperCase()==='UP';
    $('heroBar').style.boxShadow=isUp?'0 1px 0 rgba(34,197,94,0.3)':'0 1px 0 rgba(239,68,68,0.3)';

    // candle sequence
    renderCandleSeq(d.candle_visual||'');

    // BOS flash
    const bosVal=stripAnsi(d.bos_val||'NONE').trim().toUpperCase();
    const brand=$('brandName');
    brand.className='';
    if(bosVal!=='NONE'&&bosVal!==''){
        brand.classList.add(bullBear(bosVal)==='bull'?'bos-bull':'bos-bear');
    }

    // day candle
    renderSideCandle('sideDay', d.day_candle||'');
}

/* ── CANDLE SEQUENCE ── */
function renderCandleSeq(raw){
    const seq=$('candleSeq');
    seq.innerHTML='';
    const re=/\u001b\[(\d+)m(\d+)\u001b\[0m/g;
    let m;
    const items=[];
    while((m=re.exec(raw))!==null){items.push({n:+m[2],bull:m[1]==='92'});}
    if(!items.length)return;
    items.forEach(c=>{
        const unit=document.createElement('div');unit.className='cs-unit';
        const bar=document.createElement('div');bar.className=`cs-bar ${c.bull?'bull':'bear'}`;
        const num=document.createElement('div');num.className=`cs-num ${c.bull?'bull':'bear'}`;
        num.textContent=c.n;
        unit.appendChild(bar);unit.appendChild(num);
        seq.appendChild(unit);
    });
}

/* ── SIDE CANDLE ── */
function renderSideCandle(id, raw){
    const wrap=$(id);if(!wrap)return;
    wrap.innerHTML='';
    const re=/\u001b\[(\d+)m([^\u001b]+)\u001b\[0m/g;
    let m;const segs=[];
    while((m=re.exec(raw))!==null){segs.push({code:m[1],len:m[2].length});}
    if(!segs.length){
        const div=document.createElement('div');
        div.className='sc-seg';div.style.flex='1';div.style.background='var(--muted)';
        wrap.appendChild(div);return;
    }
    segs.forEach(sg=>{
        const div=document.createElement('div');div.className='sc-seg';
        div.style.flex=sg.len;
        div.style.background=sg.code==='31'?'var(--bear)':sg.code==='32'?'var(--bull)':'var(--bg3)';
        div.style.width='100%';
        wrap.appendChild(div);
    });
}

/* ── CHART ── */
let chart;
async function loadChart(){
    try{
        const r=await fetch('./webchrtpxy.json?_='+Date.now());
        const data=await r.json();
        const closes=Array.isArray(data)?data.map(d=>d.close||d.Close):[];
        const st=Array.isArray(data)?data.map(d=>d.st):[];
        if(closes.length)drawChart(closes,st);
    }catch(e){}
}

function drawChart(closes,st){
    const MAX=60,pad=4;
    const c=closes.slice(-MAX),s=st.slice(-MAX);
    const labels=[...c.map((_,i)=>i),...Array(pad).fill('')];
    const cp=[...c,...Array(pad).fill(null)];
    const sp=[...s,...Array(pad).fill(null)];
    const isBull=(c.at(-1)??0)>=(c.at(-2)??0);
    const lc=isBull?cssVar('--bull'):cssVar('--bear');
    if(!chart){
        chart=new Chart($('priceChart'),{
            type:'line',
            data:{labels,datasets:[
                {data:cp,borderColor:lc,borderWidth:1.5,pointRadius:0,fill:true,tension:0.35,
                 backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,ctx.chart.height);g.addColorStop(0,isBull?'rgba(34,197,94,0.10)':'rgba(239,68,68,0.10)');g.addColorStop(1,'rgba(0,0,0,0)');return g;}},
                {data:sp,borderColor:'rgba(202,138,4,0.75)',borderWidth:1.2,borderDash:[4,4],pointRadius:0,fill:false,tension:0.3}
            ]},
            options:{animation:false,responsive:true,maintainAspectRatio:false,
                plugins:{legend:{display:false},tooltip:{enabled:false}},
                scales:{x:{display:false},
                    y:{display:true,position:'right',grid:{color:cssVar('--grid'),drawBorder:false},
                       ticks:{color:cssVar('--muted'),font:{family:"'DM Mono',monospace",size:9},maxTicksLimit:5}}}}
        });
    }else{
        chart.data.labels=labels;
        chart.data.datasets[0].data=cp;chart.data.datasets[0].borderColor=lc;
        chart.data.datasets[1].data=sp;chart.update('none');
    }
}
function updateChartTheme(){
    if(!chart)return;
    chart.options.scales.y.grid.color=cssVar('--grid');
    chart.options.scales.y.ticks.color=cssVar('--muted');
    chart.update('none');
}

/* ── POSITIONS ── */
async function loadPos(){
    let data=[];
    try{const r=await fetch('./webpospxy.json?_='+Date.now());data=await r.json();}catch{}
    const open=data.filter(d=>(d.STATUS||'OPEN')==='OPEN');
    const total=open.reduce((s,d)=>s+(d.PNL||0),0);
    const bull=total>=0;
    set('ptPosPnl',fmt(total),bull?'bull':'bear');
    const panel=$('posPanel');
    panel.querySelectorAll('.pos-row-item').forEach(r=>r.remove());
    if(!open.length){$('posEmpty').style.display='block';return;}
    $('posEmpty').style.display='none';
    open.forEach(d=>{
        const pnl=d.PNL||0,pbull=pnl>=0;
        const isCE=(d.SYMBOL||'').toUpperCase().endsWith('CE');
        const qty=d.QTY??'—';
        const lots=qty!=='—'?Math.round(Math.abs(qty)/lotSize(d.SYMBOL)):'—';
        const row=document.createElement('div');row.className='pos-row-item';
        row.innerHTML=`<div class="pri-left"><span class="pri-sym">${shortSym(d.SYMBOL)}</span><span class="pri-meta">Qty ${qty} · ${lots} lots</span></div><span class="pri-type ${isCE?'ce':'pe'}">${isCE?'CE':'PE'}</span><span class="pri-pnl ${pbull?'bull':'bear'}">${fmt(pnl)}</span>`;
        panel.appendChild(row);
    });
}

/* ── TRADES ── */
async function loadTrades(){
    let data=[];
    try{const r=await fetch('./webpnlpxy.json?_='+Date.now());data=await r.json();}catch{}
    const total=data.reduce((s,d)=>s+(d.PNL||0),0);
    const bull=total>=0;
    set('ptTradesPnl',fmt(total),bull?'bull':'bear');
    const panel=$('tradePanel');
    panel.querySelectorAll('.trade-row-item').forEach(r=>r.remove());
    if(!data.length){$('tradeEmpty').style.display='block';return;}
    $('tradeEmpty').style.display='none';
    const sorted=[...data].sort((a,b)=>new Date(b.Exit_Time)-new Date(a.Exit_Time));
    sorted.forEach(t=>{
        const pnl=t.PNL||0,pbull=pnl>=0;
        const entry=String(t.Buy_Time||'').slice(11,16);
        const exit=String(t.Exit_Time||'').slice(11,16);
        const row=document.createElement('div');row.className='trade-row-item';
        row.innerHTML=`<div class="tri-left"><span class="tri-sym">${shortSym(t.Symbol)} #${t.Tag||'—'}</span><span class="tri-meta">${entry}→${exit} · Qty ${t.Qty??'—'}</span></div><span class="tri-pnl ${pbull?'bull':'bear'}">${fmt(pnl)}</span>`;
        panel.appendChild(row);
    });
}

/* ── RESIZE ── */
const ro=new ResizeObserver(()=>{if(chart)chart.resize();});
ro.observe($('chartPanel'));

/* ── START ── */
loadDash();loadChart();loadPos();loadTrades();
setInterval(loadDash,  3000);
setInterval(loadChart, 3000);
setInterval(loadPos,   3000);
setInterval(loadTrades,5000);
</script>
