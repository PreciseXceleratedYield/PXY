<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080d">
<title>PXY® — Signal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<style>

/* ══════════════════════════════════════════
   CONFIGURABLE PANEL WIDTHS  (must sum to 100)
   SMA left candle is fixed 28px, excluded from % calc
══════════════════════════════════════════ */
:root {
    --w-chart:    50%;   /* Chart */
    --w-terminal: 25%;   /* Terminal */
    --w-trades:   15%;   /* Positions + Trades */
    --w-candles:   5%;   /* Depth/Power histogram */
    /* remaining ~5% is SMA fixed candle (28px) */
}

:root,[data-theme="dark"]{
    --bg:#06080d;--bg2:#0b0f1a;--bg3:#111827;
    --border:rgba(255,255,255,0.055);--border2:rgba(255,255,255,0.12);
    --text:#e2e8f4;--muted:#4a5568;--accent:#3b82f6;
    --bull:#22c55e;--bear:#ef4444;--gold:#f59e0b;
    --bull-dim:rgba(34,197,94,0.10);--bear-dim:rgba(239,68,68,0.10);
    --grid:rgba(255,255,255,0.028);
    --hdr:52px;--bot:32px;
}
[data-theme="light"]{
    --bg:#f0f4fb;--bg2:#ffffff;--bg3:#e8eef8;
    --border:rgba(0,0,0,0.065);--border2:rgba(0,0,0,0.13);
    --text:#0f172a;--muted:#94a3b8;--accent:#2563eb;
    --bull:#16a34a;--bear:#dc2626;--gold:#d97706;
    --bull-dim:rgba(22,163,74,0.10);--bear-dim:rgba(220,38,38,0.10);
    --grid:rgba(0,0,0,0.035);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
body{
    height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);
    transition:background 0.3s,color 0.3s;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
::-webkit-scrollbar{width:2px;height:2px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ══ TOP BAR ══ */
#topBar{
    height:var(--hdr);flex-shrink:0;
    display:flex;align-items:stretch;
    background:var(--bg2);border-bottom:1px solid var(--border2);
    transition:background 0.3s,border-color 0.3s,box-shadow 0.5s;
    position:relative;z-index:10;
}

.nav-sec{
    display:flex;align-items:center;gap:8px;
    padding:0 clamp(10px,1.5vw,18px);
    border-right:1px solid var(--border);flex-shrink:0;
}
.back-btn{
    display:flex;align-items:center;gap:4px;padding:3px 9px;
    border:1px solid var(--border2);border-radius:5px;
    color:var(--muted);font-size:10px;letter-spacing:0.05em;
    text-decoration:none;font-family:'DM Mono',monospace;transition:all 0.2s;
}
.back-btn:hover{color:var(--text);background:var(--bg3);}
.dv{width:1px;height:16px;background:var(--border2);flex-shrink:0;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}
.logo sup{font-size:0.5em;vertical-align:super;color:var(--accent);}
.theme-toggle{display:flex;align-items:center;cursor:pointer;user-select:none;}
.toggle-track{width:28px;height:15px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);position:relative;transition:background 0.3s;}
[data-theme="light"] .toggle-track{background:var(--accent);border-color:var(--accent);}
.toggle-thumb{position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--muted);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
[data-theme="light"] .toggle-thumb{transform:translateX(13px);background:#fff;}

/* SIGNAL CELLS */
.sig-cell{
    flex:1;min-width:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 8px;gap:2px;
    border-right:1px solid var(--border);
    position:relative;overflow:hidden;cursor:default;transition:background 0.2s;
}
.sig-cell:last-child{border-right:none;}
.sig-cell:hover{background:rgba(255,255,255,0.015);}
.sig-cell::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0;
    transition:background 0.3s;
}
.sig-cell.bull-cell::after{background:var(--bull);box-shadow:0 0 8px var(--bull);}
.sig-cell.bear-cell::after{background:var(--bear);box-shadow:0 0 8px var(--bear);}
.sig-cell.gold-cell::after{background:var(--gold);}

/* 4× label size */
.sc-lbl{
    font-size:clamp(9px,1vw,13px);letter-spacing:0.12em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;font-family:'DM Mono',monospace;
}
.sc-val{
    font-family:'Syne',sans-serif;font-weight:800;
    font-size:clamp(14px,2vw,24px);
    letter-spacing:-0.2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;line-height:1;
}
.sc-val.bull{color:var(--bull);}
.sc-val.bear{color:var(--bear);}
.sc-val.gold{color:var(--gold);}
.sc-val.dim {color:var(--muted);}

/* DEPTH/POWER histogram cell — wider */
.sig-cell.dp-cell{flex:2;padding:0 4px;}
#dpHistogram{
    display:flex;align-items:flex-end;
    gap:2px;height:32px;width:100%;overflow:hidden;
    padding:0 2px;
}
.dp-bar{
    flex:1;border-radius:2px 2px 0 0;min-width:4px;
    transition:height 0.4s ease;
}
.dp-bar.bull{background:var(--bull);opacity:0.85;}
.dp-bar.bear{background:var(--bear);opacity:0.85;}
.dp-bar.latest{box-shadow:0 0 8px currentColor;opacity:1;}

/* ══ BODY ══ */
#body{flex:1;display:flex;overflow:hidden;min-height:0;}

/* SMA candle left — fixed */
#smaSide{
    width:28px;flex-shrink:0;
    background:var(--bg2);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;
    padding:6px 3px;gap:3px;transition:background 0.3s,border-color 0.3s;
}
.side-lbl{
    font-size:6px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--muted);writing-mode:vertical-rl;flex-shrink:0;
}
#smaSide .sc-wrap{
    flex:1;width:100%;display:flex;flex-direction:column;
    align-items:center;padding:2px 0;gap:1px;overflow:hidden;
}
.sma-seg{width:14px;border-radius:1px;flex-shrink:0;}

/* CHART */
#chartWrap{
    width:var(--w-chart);flex-shrink:0;
    display:flex;flex-direction:column;
    border-right:1px solid var(--border);min-width:0;overflow:hidden;
}
#chartBox{
    flex:1;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 80%,rgba(15,25,50,0.4) 0%,transparent 70%),var(--bg);
}
.grid-over{
    position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:48px 48px;
}
#chartBox canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:1;}

/* POSITIONS + TRADES */
#rightWrap{
    width:var(--w-trades);flex-shrink:0;
    display:flex;flex-direction:column;
    border-right:1px solid var(--border);min-width:0;overflow:hidden;
}
#posSection{flex:1;display:flex;flex-direction:column;border-bottom:1px solid var(--border2);overflow:hidden;min-height:0;}
#posScroll{flex:1;overflow-y:auto;}
#tradeSection{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
#tradeScroll{flex:1;overflow-y:auto;}

.pw-hdr{
    height:26px;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-around;
    padding:0 6px;background:var(--bg2);border-bottom:1px solid var(--border);
    gap:3px;overflow:hidden;transition:background 0.3s,border-color 0.3s;
}
.pw-sort{
    font-size:7px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--muted);cursor:pointer;flex:1;text-align:center;
    padding:1px 3px;border-radius:3px;transition:all 0.15s;border:1px solid transparent;
}
.pw-sort:hover{color:var(--accent);border-color:rgba(59,130,246,0.3);}

.p-row,.t-row{
    display:grid;grid-template-columns:auto 1fr auto;
    align-items:center;gap:6px;
    padding:5px 8px;border-bottom:1px solid var(--border);
    transition:background 0.12s;cursor:default;
}
.p-row:hover,.t-row:hover{background:var(--bg3);}
.p-row.bull-r{border-left:2px solid var(--bull);}
.p-row.bear-r{border-left:2px solid var(--bear);}
.p-sym,.t-sym{font-size:clamp(8px,0.8vw,10px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-meta,.t-meta{font-size:7px;color:var(--muted);margin-top:1px;}
.t-tag,.p-tag{font-size:clamp(8px,0.8vw,10px);color:var(--accent);flex-shrink:0;font-weight:500;}
.p-pnl,.t-pnl{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(10px,1vw,12px);flex-shrink:0;text-align:right;}
.p-pnl.bull,.t-pnl.bull{color:var(--bull);}
.p-pnl.bear,.t-pnl.bear{color:var(--bear);}
#tradeScroll .t-sym{color:var(--muted);}
#tradeScroll .t-meta{color:rgba(91,100,120,0.7);}
.empty-msg{padding:20px 8px;text-align:center;color:var(--muted);font-size:10px;letter-spacing:0.06em;}

/* TERMINAL */
#termWrap{
    width:var(--w-terminal);flex-shrink:0;
    display:flex;flex-direction:column;
    border-right:1px solid var(--border);
    background:#000;overflow:hidden;
}
.term-hdr{
    height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg2);border-bottom:1px solid var(--border);
    font-size:7px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);
}
#termBox{flex:1;overflow:hidden;}
#termBox .xterm{height:100%!important;}
#termBox .xterm-viewport{background:transparent!important;}

/* DEPTH/POWER candle panel */
#dpPanel{
    width:var(--w-candles);flex-shrink:0;
    display:flex;flex-direction:column;
    background:var(--bg2);overflow:hidden;
}
.dp-hdr{
    height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--border);
    font-size:6px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);
}
#dpBody{
    flex:1;display:flex;flex-direction:column;
    align-items:center;padding:4px 3px;gap:2px;overflow:hidden;
}
.dp-item{
    display:flex;align-items:center;gap:2px;width:100%;flex-shrink:0;
}
.dp-dot{border-radius:2px;flex-shrink:0;}
.dp-num{font-size:10px;font-weight:700;line-height:1;}

/* BOTTOM */
#botBar{
    height:var(--bot);flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg2);border-top:1px solid var(--border2);
    padding:0 clamp(10px,2vw,20px);gap:12px;
    transition:background 0.3s,border-color 0.3s;
}
#botLeft,#botRight{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.bot-lbl{font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.bot-pnl{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(12px,1.4vw,16px);}
.bot-pnl.bull{color:var(--bull);}
.bot-pnl.bear{color:var(--bear);}
#brand{
    flex:1;font-family:'Syne',sans-serif;font-weight:800;
    font-size:clamp(10px,1.2vw,14px);letter-spacing:0.12em;
    color:var(--muted);text-align:center;transition:all 0.3s;
}
#brand sup{font-size:0.5em;vertical-align:super;color:var(--accent);}
@keyframes flashG{0%,100%{color:var(--bull);text-shadow:0 0 16px rgba(34,197,94,0.7);}50%{color:rgba(34,197,94,0.25);text-shadow:none;}}
@keyframes flashR{0%,100%{color:var(--bear);text-shadow:0 0 16px rgba(239,68,68,0.7);}50%{color:rgba(239,68,68,0.25);text-shadow:none;}}
#brand.bos-bull{animation:flashG 0.9s infinite;}
#brand.bos-bear{animation:flashR 0.9s infinite;}
#clk{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;}

@media(max-width:900px){
    #smaSide,#dpPanel,#termWrap{display:none;}
    #chartWrap{width:60%;}
    #rightWrap{width:40%;}
}
@media(max-width:640px){
    :root{--hdr:44px;--bot:26px;}
    .sc-val{font-size:14px;}
    #chartWrap,#rightWrap{width:50%;}
}
@media(min-width:1920px){
    :root{--hdr:64px;--bot:40px;}
    .sc-val{font-size:28px;}
    .sc-lbl{font-size:14px;}
}
</style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<div id="topBar">
    <div class="nav-sec">
        <a class="back-btn" href="webpxy.html">← PXY</a>
        <div class="dv"></div>
        <span class="logo">PXY<sup>®</sup></span>
        <div class="dv"></div>
        <div class="theme-toggle" id="themeToggle">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
    </div>

    <div class="sig-cell" id="cellEntry">
        <span class="sc-lbl">🛫 Entry</span>
        <span class="sc-val" id="hcEntry">—</span>
    </div>
    <div class="sig-cell" id="cellExit">
        <span class="sc-lbl">🛬 Exit</span>
        <span class="sc-val" id="hcExit">—</span>
    </div>
    <div class="sig-cell" id="cellATR">
        <span class="sc-lbl">📐 ATR / KATR</span>
        <span class="sc-val gold" id="hcATR">—</span>
    </div>
    <div class="sig-cell" id="cellTrend">
        <span class="sc-lbl">🚀 Trend</span>
        <span class="sc-val" id="hcTrend">—</span>
    </div>

    <!-- DEPTH/POWER histogram -->
    <div class="sig-cell dp-cell" id="cellDP">
        <span class="sc-lbl">Depth · Power</span>
        <div id="dpHistogram"></div>
    </div>
</div>

<!-- ══ BODY ══ -->
<div id="body">

    <!-- SMA CANDLE left -->
    <div id="smaSide">
        <span class="side-lbl">SMA</span>
        <div class="sc-wrap" id="smaWrap"></div>
    </div>

    <!-- CHART -->
    <div id="chartWrap">
        <div id="chartBox">
            <div class="grid-over"></div>
            <canvas id="priceChart"></canvas>
        </div>
    </div>

    <!-- POSITIONS + TRADES -->
    <div id="rightWrap">
        <div id="posSection">
            <div class="pw-hdr">
                <span class="pw-sort" onclick="sortPos('tag')">#Tag ↕</span>
                <span class="pw-sort" onclick="sortPos('sym')">Sym ↕</span>
                <span class="pw-sort" onclick="sortPos('pnl')">P&amp;L ↕</span>
            </div>
            <div id="posScroll"><div class="empty-msg" id="posEmpty">No positions</div></div>
        </div>
        <div id="tradeSection">
            <div class="pw-hdr">
                <span class="pw-sort" onclick="sortTrd('tag')">#Tag ↕</span>
                <span class="pw-sort" onclick="sortTrd('sym')">Sym ↕</span>
                <span class="pw-sort" onclick="sortTrd('pnl')">P&amp;L ↕</span>
            </div>
            <div id="tradeScroll"><div class="empty-msg" id="tradeEmpty">No trades</div></div>
        </div>
    </div>

    <!-- TERMINAL -->
    <div id="termWrap">
        <div class="term-hdr">Terminal</div>
        <div id="termBox"></div>
    </div>

    <!-- DEPTH/POWER vertical panel -->
    <div id="dpPanel">
        <div class="dp-hdr">Depth · Power</div>
        <div id="dpBody"></div>
    </div>

</div>

<!-- ══ BOTTOM ══ -->
<div id="botBar">
    <div id="botLeft">
        <span class="bot-lbl">Running P&amp;L</span>
        <span class="bot-pnl" id="ptPosPnl">—</span>
    </div>
    <div id="brand">PreciseXceleratedYield Pvt Ltd<sup>™</sup></div>
    <div id="botRight">
        <span class="bot-lbl">Booked P&amp;L</span>
        <span class="bot-pnl" id="ptTradesPnl">—</span>
    </div>
    <span id="clk">—</span>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* ── THEME ── */
$('themeToggle').addEventListener('click',()=>{
    const dark=document.documentElement.getAttribute('data-theme')!=='light';
    document.documentElement.setAttribute('data-theme',dark?'light':'dark');
    if(chart)updateChartColors();
});

/* ── CLOCK ── */
function tick(){$('clk').textContent=new Date().toLocaleTimeString('en-IN',{hour12:false});}
tick();setInterval(tick,1000);

/* ── HELPERS ── */
function strip(s){return String(s||'').replace(/\u001b\[[0-9;]*m/g,'');}
function fmt(n){return(n>=0?'+':'')+Math.round(n).toLocaleString('en-IN');}
function cls(v){
    const s=String(v||'').toUpperCase();
    if(['BULL','UP','BUY','CE','POSITIVE'].some(k=>s.includes(k)))return'bull';
    if(['BEAR','DOWN','SELL','PE','NEGATIVE'].some(k=>s.includes(k)))return'bear';
    if(s==='NONE')return'dim';
    return'gold';
}
function emojify(v){
    const s=String(v||'').toUpperCase();
    if(s.includes('BUY')||s.includes('BULL'))return'🟢';
    if(s.includes('SELL')||s.includes('BEAR'))return'🔴';
    if(s==='NONE')return'—';
    return v;
}
function setVal(id,val,c){
    const el=$(id);if(!el)return;
    el.textContent=val??'—';
    if(c){el.className=el.className.replace(/\b(bull|bear|gold|blue|dim|white)\b/g,'').trim();el.classList.add(c);}
}
function shortSym(s){
    if(!s)return'—';
    const m=s.match(/([A-Z]+)\d{2}([A-Z]{3})\d{2}(C|P)(\d+)/i);
    if(m)return`${m[1]} ${m[2]} ${m[4]} ${m[3]==='C'?'CE':'PE'}`;
    return s.length>18?s.slice(0,16)+'…':s;
}
function lotSz(s){return(s||'').includes('BANKNIFTY')?30:65;}

/* ── SIGNAL DASH ── */
async function loadDash(){
    try{
        const d=await fetch('./webdashpxy.json?_='+Date.now()).then(r=>r.json());

        setVal('hcEntry', emojify(d.entry??'NONE'), d.entry&&d.entry!=='NONE'?cls(d.entry):'dim');
        setVal('hcExit',  emojify(d.exit??'NONE'),  d.exit&&d.exit!=='NONE'?cls(d.exit):'dim');
        setVal('hcATR',   `${d.atr??'—'} / ${d.katr??'—'}`, 'gold');
        setVal('hcTrend', emojify(d.supertrend), cls(d.supertrend));

        // cell accent lines
        [{id:'cellEntry',v:d.entry},{id:'cellExit',v:d.exit},
         {id:'cellTrend',v:d.supertrend},{id:'cellATR',v:'gold'}
        ].forEach(({id,v})=>{
            const el=$(id);if(!el)return;
            el.className='sig-cell';
            const c=cls(v||'');
            if(c==='bull')el.classList.add('bull-cell');
            else if(c==='bear')el.classList.add('bear-cell');
            else if(c==='gold')el.classList.add('gold-cell');
        });
        $('cellDP').className='sig-cell dp-cell';
        if(cls(d.supertrend)==='bull')$('cellDP').classList.add('bull-cell');
        else $('cellDP').classList.add('bear-cell');

        // header glow
        const up=String(d.direction||'').toUpperCase()==='UP';
        $('topBar').style.boxShadow=up
            ?'0 1px 0 rgba(34,197,94,0.3),0 0 20px rgba(34,197,94,0.04)'
            :'0 1px 0 rgba(239,68,68,0.3),0 0 20px rgba(239,68,68,0.04)';

        // BOS flash
        const bos=strip(d.bos_val||'NONE').trim().toUpperCase();
        const brand=$('brand');brand.className='';
        if(bos!=='NONE'&&bos!==''){brand.classList.add(cls(bos)==='bull'?'bos-bull':'bos-bear');}

        // Depth/Power histogram — latest continuous streak only, bar height = power
        renderDPHistogram(d.candle_visual||'', d.ce_power||1, d.pe_power||1);

        // SMA side candle from day_candle
        renderSmaCandle(d.day_candle||'');
    }catch(e){console.error('dash',e);}
}

/* ── DEPTH/POWER HISTOGRAM ── */
function renderDPHistogram(raw, cePow, pePow){
    const hist=$('dpHistogram');hist.innerHTML='';
    const dpBody=$('dpBody');dpBody.innerHTML='';

    const re=/\u001b\[(\d+)m(\d+)\u001b\[0m/g;
    let m;const items=[];
    while((m=re.exec(raw))!==null)items.push({n:+m[2],bull:m[1]==='92'});
    if(!items.length)return;

    // find latest streak
    const last=items[items.length-1];
    let si=items.length-1;
    while(si>0&&items[si-1].bull===last.bull)si--;
    const streak=items.slice(si);
    const power=last.bull?cePow:pePow;
    const BASE_H=28;

    // TOP BAR histogram — equal height bars, number = power value, latest glows
    streak.forEach((c,i)=>{
        const isLatest=(i===streak.length-1);
        const bar=document.createElement('div');
        bar.className=`dp-bar ${c.bull?'bull':'bear'}${isLatest?' latest':''}`;
        bar.style.height=BASE_H+'px';
        bar.style.color=c.bull?'var(--bull)':'var(--bear)';
        if(isLatest){
            bar.style.height=Math.min(BASE_H*power,BASE_H)+'px';
            bar.title=`Power: ${power}`;
        }
        hist.appendChild(bar);
    });

    // RIGHT PANEL — vertical streak with dot + power number
    const toRender=[...streak].reverse();
    const opposite=si>0?items[si-1]:null;
    if(opposite)toRender.push(opposite);

    toRender.forEach((c,i)=>{
        const isLatest=i===0;
        const isOpp=opposite&&i===toRender.length-1;
        const sz=isLatest?Math.round(16*Math.min(power,2)):16;
        const item=document.createElement('div');
        item.className='dp-item';
        item.style.opacity=isOpp?'0.35':'1';
        const dot=document.createElement('div');
        dot.className='dp-dot';
        dot.style.width=sz+'px';dot.style.height=sz+'px';
        dot.style.background=c.bull?'var(--bull)':'var(--bear)';
        if(isLatest)dot.style.boxShadow=c.bull?'0 0 8px var(--bull)':'0 0 8px var(--bear)';
        const num=document.createElement('span');
        num.className='dp-num';
        num.style.color=c.bull?'var(--bull)':'var(--bear)';
        num.style.fontSize=isLatest?Math.round(10*Math.min(power,2))+'px':'10px';
        num.textContent=isLatest?power:c.n;
        item.appendChild(dot);item.appendChild(num);
        dpBody.appendChild(item);
    });
}

/* ── SMA SIDE CANDLE ── */
function renderSmaCandle(raw){
    const wrap=$('smaWrap');wrap.innerHTML='';
    const re=/\u001b\[(\d+)m([^\u001b]+)\u001b\[0m/g;
    let m;const segs=[];
    while((m=re.exec(raw))!==null)segs.push({code:m[1],len:m[2].length});
    if(!segs.length){
        const d=document.createElement('div');d.className='sma-seg';
        d.style.flex='1';d.style.background='var(--muted)';wrap.appendChild(d);return;
    }
    segs.forEach(sg=>{
        const d=document.createElement('div');d.className='sma-seg';
        d.style.flex=sg.len;d.style.width='100%';
        d.style.background=sg.code==='31'?'var(--bear)':sg.code==='32'?'var(--bull)':'var(--bg3)';
        wrap.appendChild(d);
    });
}

/* ── CHART ── */
let chart;
async function loadChart(){
    try{
        const data=await fetch('./webchrtpxy.json?_='+Date.now()).then(r=>r.json());
        const closes=Array.isArray(data)?data.map(d=>d.close||d.Close):[];
        const st=Array.isArray(data)?data.map(d=>d.st):[];
        if(closes.length)drawChart(closes,st);
    }catch{}
}
function drawChart(closes,st){
    const MAX=60,pad=4;
    const c=closes.slice(-MAX),s=st.slice(-MAX);
    const isBull=(c.at(-1)??0)>=(c.at(-2)??0);
    const lc=isBull?cssVar('--bull'):cssVar('--bear');
    const labels=[...c.map((_,i)=>i),...Array(pad).fill('')];
    const cp=[...c,...Array(pad).fill(null)];
    const sp=[...s,...Array(pad).fill(null)];
    if(!chart){
        chart=new Chart($('priceChart'),{
            type:'line',
            data:{labels,datasets:[
                {data:cp,borderColor:lc,borderWidth:1.5,pointRadius:0,fill:true,tension:0.35,
                 backgroundColor:ctx=>{
                     const g=ctx.chart.ctx.createLinearGradient(0,0,0,ctx.chart.height);
                     g.addColorStop(0,isBull?'rgba(34,197,94,0.08)':'rgba(239,68,68,0.08)');
                     g.addColorStop(1,'rgba(0,0,0,0)');return g;}},
                {data:sp,borderColor:'rgba(202,138,4,0.65)',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false,tension:0.3}
            ]},
            options:{animation:false,responsive:true,maintainAspectRatio:false,
                plugins:{legend:{display:false},tooltip:{enabled:false}},
                scales:{
                    x:{display:false},
                    y:{display:true,position:'right',
                       grid:{color:cssVar('--grid'),drawBorder:false},
                       ticks:{color:cssVar('--muted'),font:{family:"'DM Mono',monospace",size:9},maxTicksLimit:5}}
                }}
        });
    }else{
        chart.data.labels=labels;
        chart.data.datasets[0].data=cp;chart.data.datasets[0].borderColor=lc;
        chart.data.datasets[1].data=sp;chart.update('none');
    }
}
function updateChartColors(){
    if(!chart)return;
    chart.options.scales.y.grid.color=cssVar('--grid');
    chart.options.scales.y.ticks.color=cssVar('--muted');
    chart.update('none');
}

/* ── SMA from websmapxy.json ── */
async function loadSma(){
    try{
        const data=await fetch('./websmapxy.json?_='+Date.now()).then(r=>r.json());
        if(!Array.isArray(data)||!data.length)return;
        const wrap=$('smaWrap');wrap.innerHTML='';
        data.forEach(c=>{
            const bull=c.C>=c.O,range=c.H-c.L||1;
            const uw=((c.H-Math.max(c.O,c.C))/range)*100;
            const bh=Math.max(6,(Math.abs(c.C-c.O)/range)*100);
            const lw=((Math.min(c.O,c.C)-c.L)/range)*100;
            const mk=(fl,bg,w)=>{
                const d=document.createElement('div');d.className='sma-seg';
                d.style.flex=Math.max(2,fl);d.style.background=bg;
                d.style.width=w;d.style.borderRadius='1px';wrap.appendChild(d);
            };
            if(uw>1)mk(uw,'var(--muted)','3px');
            mk(bh,bull?'var(--bull)':'var(--bear)','100%');
            if(lw>1)mk(lw,'var(--muted)','3px');
        });
    }catch{}
}

/* ── POSITIONS ── */
let psCol='pnl',psAsc=false;
function sortPos(col){psCol===col?psAsc=!psAsc:(psCol=col,psAsc=false);loadPos();}

async function loadPos(){
    let data=[];
    try{data=await fetch('./webpospxy.json?_='+Date.now()).then(r=>r.json());}catch{}
    const open=data.filter(d=>(d.STATUS||'OPEN')==='OPEN');
    const total=open.reduce((s,d)=>s+(d.PNL||0),0);
    const bull=total>=0;
    const pe=$('ptPosPnl');pe.textContent=fmt(total);pe.className='bot-pnl '+(bull?'bull':'bear');
    const scroll=$('posScroll');
    scroll.querySelectorAll('.p-row').forEach(r=>r.remove());
    if(!open.length){$('posEmpty').style.display='block';return;}
    $('posEmpty').style.display='none';
    open.sort((a,b)=>{
        const v=psCol==='pnl'?(a.PNL||0)-(b.PNL||0)
               :psCol==='tag'?String(a.Tag||a.SYMBOL||'').localeCompare(String(b.Tag||b.SYMBOL||''))
               :(a.SYMBOL||'').localeCompare(b.SYMBOL||'');
        return psAsc?v:-v;
    });
    open.forEach(d=>{
        const pnl=d.PNL||0,pb=pnl>=0,isCE=(d.SYMBOL||'').toUpperCase().endsWith('CE');
        const qty=d.QTY??'—',lots=qty!=='—'?Math.round(Math.abs(qty)/lotSz(d.SYMBOL)):'—';
        const row=document.createElement('div');
        row.className=`p-row ${pb?'bull-r':'bear-r'}`;
        row.innerHTML=`
            <span class="p-tag">#${d.Tag||'—'}</span>
            <div><div class="p-sym">${shortSym(d.SYMBOL)}</div>
                 <div class="p-meta">Qty ${qty}·${lots}L·${isCE?'CE':'PE'}</div></div>
            <span class="p-pnl ${pb?'bull':'bear'}">${fmt(pnl)}</span>`;
        scroll.appendChild(row);
    });
}

/* ── TRADES ── */
let trCol='pnl',trAsc=false;
function sortTrd(col){trCol===col?trAsc=!trAsc:(trCol=col,trAsc=false);loadTrades();}

async function loadTrades(){
    let data=[];
    try{data=await fetch('./webpnlpxy.json?_='+Date.now()).then(r=>r.json());}catch{}
    const total=data.reduce((s,d)=>s+(d.PNL||0),0);
    const bull=total>=0;
    const te=$('ptTradesPnl');te.textContent=fmt(total);te.className='bot-pnl '+(bull?'bull':'bear');
    const scroll=$('tradeScroll');
    scroll.querySelectorAll('.t-row').forEach(r=>r.remove());
    if(!data.length){$('tradeEmpty').style.display='block';return;}
    $('tradeEmpty').style.display='none';
    data.sort((a,b)=>{
        const v=trCol==='pnl'?(a.PNL||0)-(b.PNL||0)
               :trCol==='tag'?String(a.Tag||'').localeCompare(String(b.Tag||''))
               :(a.Symbol||'').localeCompare(b.Symbol||'');
        return trAsc?v:-v;
    });
    data.forEach(t=>{
        const pnl=t.PNL||0,pb=pnl>=0;
        const entry=String(t.Buy_Time||'').slice(11,16);
        const exit=String(t.Exit_Time||'').slice(11,16);
        const row=document.createElement('div');row.className='t-row';
        row.innerHTML=`
            <span class="t-tag">#${t.Tag||'—'}</span>
            <div><div class="t-sym">${shortSym(t.Symbol)}</div>
                 <div class="t-meta">${entry}→${exit}·Qty ${t.Qty??'—'}</div></div>
            <span class="t-pnl ${pb?'bull':'bear'}">${fmt(pnl)}</span>`;
        scroll.appendChild(row);
    });
}

/* ── TERMINAL ── */
function initTerminal(){
    const term=new Terminal({
        convertEol:true,scrollback:200,fontFamily:"'DM Mono',monospace",
        fontSize:10,lineHeight:1.4,cursorBlink:false,disableStdin:true,
        theme:{background:'#000000',foreground:'#e8ecf4',green:'#22c55e',
               red:'#ef4444',yellow:'#f59e0b',cyan:'#22d3ee',brightBlack:'#374151'}
    });
    const fit=new FitAddon.FitAddon();
    term.loadAddon(fit);term.open($('termBox'));
    setTimeout(()=>fit.fit(),80);
    new ResizeObserver(()=>fit.fit()).observe($('termBox'));
    const proto=location.protocol==='https:'?'wss':'ws';
    const ws=new WebSocket(`${proto}://${location.host}`);
    ws.onmessage=e=>{term.clear();term.write(e.data);};
    ws.onerror=()=>term.write('\r\n\x1b[31m[connection error]\x1b[0m');
}

/* ── RESIZE ── */
new ResizeObserver(()=>{if(chart)chart.resize();}).observe($('chartBox'));

/* ── START ── */
loadDash();loadChart();loadPos();loadTrades();loadSma();initTerminal();
setInterval(loadDash,  3000);
setInterval(loadChart, 3000);
setInterval(loadPos,   3000);
setInterval(loadTrades,5000);
setInterval(loadSma,   5000);
</script>
