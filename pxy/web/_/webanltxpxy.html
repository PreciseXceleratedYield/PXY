<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080d" id="themeColorMeta">
<title>PXY® — SIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
:root, [data-theme="dark"] {
    --bg:       #06080d;
    --bg2:      #0c101a;
    --bg3:      #111827;
    --border:   rgba(255,255,255,0.06);
    --border2:  rgba(255,255,255,0.13);
    --text:     #e8ecf4;
    --muted:    #5b6478;
    --accent:   #3b82f6;
    --bull:     #22c55e;
    --bear:     #ef4444;
    --bull-dim: rgba(34,197,94,0.13);
    --bear-dim: rgba(239,68,68,0.13);
    --gold:     #f59e0b;
    --shadow:   rgba(0,0,0,0.6);
    --grid:     rgba(255,255,255,0.035);
    --header-h: 48px;
}
[data-theme="light"] {
    --bg:       #f1f5fb;
    --bg2:      #ffffff;
    --bg3:      #e8eef8;
    --border:   rgba(0,0,0,0.07);
    --border2:  rgba(0,0,0,0.14);
    --text:     #0f172a;
    --muted:    #94a3b8;
    --accent:   #2563eb;
    --bull:     #16a34a;
    --bear:     #dc2626;
    --bull-dim: rgba(22,163,74,0.11);
    --bear-dim: rgba(220,38,38,0.11);
    --gold:     #d97706;
    --shadow:   rgba(0,0,0,0.12);
    --grid:     rgba(0,0,0,0.04);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background 0.35s, color 0.35s;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
}

* { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ══ HEADER ══ */
#topHeader {
    height: var(--header-h);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(12px, 2vw, 20px);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    gap: 10px;
    transition: background 0.35s, border-color 0.35s;
    z-index: 50;
}

.hdr-left, .hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.back-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 11px;
    border: 1px solid var(--border2); border-radius: 6px;
    color: var(--muted); font-size: 11px; letter-spacing: 0.06em;
    text-decoration: none; font-family: 'DM Mono', monospace;
    transition: all 0.2s; white-space: nowrap;
}
.back-btn:hover { color: var(--text); background: var(--bg3); }

.divider-v { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }

.page-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(13px, 1.5vw, 16px);
    font-weight: 800; letter-spacing: 0.06em;
}

/* OHLC strip center */
#ohlcStrip {
    flex: 1; display: flex; align-items: center;
    gap: clamp(8px, 1.8vw, 20px);
    justify-content: center; overflow: hidden;
}
.ohlc-item { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.ohlc-lbl { font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
.ohlc-val { font-size: 12px; font-variant-numeric: tabular-nums; }
.ohlc-val.bull { color: var(--bull); }
.ohlc-val.bear { color: var(--bear); }
.ohlc-val.gold { color: var(--gold); }

.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(14px, 1.4vw, 17px); }
.logo sup { font-size: 0.55em; vertical-align: super; color: var(--accent); }

.theme-toggle { display: flex; align-items: center; cursor: pointer; user-select: none; }
.toggle-track {
    width: 34px; height: 18px; border-radius: 9px;
    background: var(--bg3); border: 1px solid var(--border2);
    position: relative; transition: background 0.35s, border-color 0.35s;
}
[data-theme="light"] .toggle-track { background: var(--accent); border-color: var(--accent); }
.toggle-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.35s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
}
[data-theme="light"] .toggle-thumb { transform: translateX(16px); background: #fff; }

/* ══ SUMMARY BAR ══ */
#summaryBar {
    flex-shrink: 0;
    display: flex; align-items: center;
    gap: clamp(6px, 1.2vw, 16px);
    padding: 6px clamp(12px, 2vw, 20px);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
    transition: background 0.35s, border-color 0.35s;
}
#summaryBar::-webkit-scrollbar { display: none; }

.chip {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 4px;
    border: 1px solid var(--border2); background: var(--bg3);
    font-size: clamp(9px, 0.85vw, 11px); white-space: nowrap; flex-shrink: 0;
    transition: background 0.35s, border-color 0.35s;
}
.chip-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.chip-dot.bull { background: var(--bull); box-shadow: 0 0 4px var(--bull); }
.chip-dot.bear { background: var(--bear); box-shadow: 0 0 4px var(--bear); }
.chip-dot.gold { background: var(--gold); }
.chip-dot.blue { background: var(--accent); }
.chip-lbl { color: var(--muted); }
.chip-val { font-weight: 500; }
.chip-val.bull { color: var(--bull); }
.chip-val.bear { color: var(--bear); }
.chip-val.gold { color: var(--gold); }
.chip-val.blue { color: var(--accent); }

/* ══ MAIN BODY ══ */
#body {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
}

/* ══ LEFT PANEL — trade list ══ */
#leftPanel {
    width: 300px;
    min-width: 220px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
    transition: border-color 0.35s;
}

#panelHeader {
    height: 32px;
    display: flex; align-items: center;
    padding: 0 14px; gap: 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0;
    transition: background 0.35s, border-color 0.35s;
}
.panel-dot { width: 5px; height: 5px; border-radius: 50%; }
.panel-dot.g { background: var(--bull); box-shadow: 0 0 4px var(--bull); }
.panel-dot.a { background: var(--gold); box-shadow: 0 0 4px var(--gold); }
.panel-dot.c { background: #22d3ee; box-shadow: 0 0 4px #22d3ee; }
.panel-lbl { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

#tradeListPanel {
    flex: 1; overflow-y: auto; overflow-x: hidden;
}

/* trade row */
.trade-row {
    display: flex; flex-direction: column; gap: 4px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
}
.trade-row:hover   { background: var(--bg3); }
.trade-row.active  { background: var(--bg3); border-left: 2px solid var(--accent); padding-left: 12px; }
.trade-row.dimmed  { opacity: 0.35; }

.tr-top { display: flex; justify-content: space-between; align-items: center; }
.tr-sym {
    font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 160px;
}
.tr-pnl {
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.tr-pnl.bull { color: var(--bull); }
.tr-pnl.bear { color: var(--bear); }

.tr-mid { display: flex; justify-content: space-between; align-items: center; }
.tr-tag { font-size: 10px; color: var(--accent); letter-spacing: 0.04em; }
.tr-type {
    font-size: 9px; padding: 1px 6px; border-radius: 3px;
    letter-spacing: 0.06em; font-weight: 500;
}
.tr-type.ce { background: var(--bull-dim); color: var(--bull); }
.tr-type.pe { background: var(--bear-dim); color: var(--bear); }

.tr-bot { display: flex; justify-content: space-between; }
.tr-meta { font-size: 9px; color: var(--muted); }

/* divider */
#divider {
    width: 5px; cursor: col-resize; flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--border);
    position: relative; transition: background 0.2s;
}
#divider:hover { background: var(--bg3); }
#divider::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 2px; height: 36px; background: var(--border2); border-radius: 2px;
}

/* ══ RIGHT — chart ══ */
#rightPanel {
    flex: 1; position: relative; overflow: hidden;
    background: var(--bg); transition: background 0.35s; min-width: 0;
}

.grid-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: clamp(40px,6vw,80px) clamp(40px,5vh,70px);
}

canvas#btChart {
    position: absolute; inset: 0;
    width: 100% !important; height: 100% !important; z-index: 1;
}

svg#markerLayer {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 3; overflow: visible;
}
svg#markerLayer g { pointer-events: all; }

/* tooltip — pinned top-right */
#tooltip {
    display: none;
    position: absolute;
    top: 12px; right: 12px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 11px;
    box-shadow: 0 8px 32px var(--shadow);
    z-index: 20;
    min-width: 200px;
    max-width: 260px;
    pointer-events: auto;
    transition: background 0.35s;
}
.tt-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px; gap: 8px;
}
.tt-sym {
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    line-height: 1.3; word-break: break-all;
}
.tt-close {
    font-size: 11px; color: var(--muted); cursor: pointer;
    flex-shrink: 0; padding: 0 2px;
    transition: color 0.15s;
}
.tt-close:hover { color: var(--bear); }
.tt-row {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 4px; font-size: 10px; color: var(--muted);
}
.tt-val { color: var(--text); font-size: 10px; text-align: right; }
.tt-pnl {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 18px; margin-top: 10px; letter-spacing: -0.5px;
}
.tt-pnl.bull { color: var(--bull); }
.tt-pnl.bear { color: var(--bear); }

/* loading */
#loadMsg {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); font-size: 12px; letter-spacing: 0.08em;
    z-index: 10; background: var(--bg);
}
#loadMsg.hidden { display: none; }
.spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ MOBILE ══ */
@media (max-width: 640px) {
    :root { --header-h: 44px; }
    #body { flex-direction: column; }
    #leftPanel { width: 100%; height: 42%; border-right: none; border-bottom: 1px solid var(--border); }
    #divider { display: none; }
    #ohlcStrip .ohlc-item:nth-child(n+4) { display: none; }
}

@media (min-width: 1920px) {
    :root { --header-h: 60px; }
    #leftPanel { width: 360px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="topHeader">
    <div class="hdr-left">
        <a class="back-btn" href="webpxy.html">← DASHBOARD</a>
        <div class="divider-v"></div>
        <span class="page-title">SIM</span>
    </div>

    <div id="ohlcStrip">
        <div class="ohlc-item"><span class="ohlc-lbl">O</span><span class="ohlc-val" id="hO">—</span></div>
        <div class="ohlc-item"><span class="ohlc-lbl">H</span><span class="ohlc-val bull" id="hH">—</span></div>
        <div class="ohlc-item"><span class="ohlc-lbl">L</span><span class="ohlc-val bear" id="hL">—</span></div>
        <div class="ohlc-item"><span class="ohlc-lbl">C</span><span class="ohlc-val" id="hC">—</span></div>
        <div class="ohlc-item"><span class="ohlc-lbl">Vol</span><span class="ohlc-val gold" id="hV">—</span></div>
        <div class="ohlc-item"><span class="ohlc-lbl">T</span><span class="ohlc-val" id="hT">—</span></div>
    </div>

    <div class="hdr-right">
        <div class="theme-toggle" id="themeToggle">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
        <div class="divider-v"></div>
        <span class="logo">PXY<sup>®</sup></span>
    </div>
</header>

<!-- SUMMARY BAR -->
<div id="summaryBar">
    <div class="chip"><div class="chip-dot bull"></div><span class="chip-lbl">P&amp;L</span><span class="chip-val" id="cTotal">—</span></div>
    <div class="chip"><div class="chip-dot bull"></div><span class="chip-lbl">Win</span><span class="chip-val bull" id="cWin">—</span></div>
    <div class="chip"><div class="chip-dot bear"></div><span class="chip-lbl">Loss</span><span class="chip-val bear" id="cLoss">—</span></div>
    <div class="chip"><div class="chip-dot gold"></div><span class="chip-lbl">Rate</span><span class="chip-val gold" id="cRate">—</span></div>
    <div class="chip"><div class="chip-dot blue"></div><span class="chip-lbl">Trades</span><span class="chip-val blue" id="cCount">—</span></div>
    <div class="chip" style="margin-left:auto"><div class="chip-dot"></div><span class="chip-lbl">Candles</span><span class="chip-val" id="cCandles">—</span></div>
</div>

<!-- BODY -->
<div id="body">

    <!-- LEFT: trade list -->
    <div id="leftPanel">
        <div id="panelHeader">
            <div class="panel-dot g"></div>
            <div class="panel-dot a"></div>
            <div class="panel-dot c"></div>
            <span class="panel-lbl" style="margin-left:4px">Trades</span>
        </div>
        <div id="tradeListPanel"></div>
    </div>

    <div id="divider"></div>

    <!-- RIGHT: chart -->
    <div id="rightPanel">
        <div id="loadMsg"><div class="spinner"></div><span>Loading…</span></div>
        <div class="grid-overlay"></div>
        <canvas id="btChart"></canvas>
        <svg id="markerLayer"></svg>
        <div id="tooltip"></div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
'use strict';

/* ── THEME ── */
const html = document.documentElement;
document.getElementById('themeToggle').addEventListener('click', () => {
    const dark = html.getAttribute('data-theme') !== 'light';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    document.getElementById('themeColorMeta').setAttribute('content', dark ? '#f1f5fb' : '#06080d');
    if (btChart) { updateChartColors(); redrawMarkers(); }
});
function cssVar(n) { return getComputedStyle(html).getPropertyValue(n).trim(); }

/* ── DIVIDER DRAG ── */
const divider = document.getElementById('divider');
const leftPanel = document.getElementById('leftPanel');
let dragging = false;
divider.addEventListener('mousedown', () => dragging = true);
window.addEventListener('mouseup',   () => dragging = false);
window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const pct = (e.clientX / window.innerWidth) * 100;
    if (pct < 15 || pct > 55) return;
    leftPanel.style.width = e.clientX + 'px';
});

/* ── PARSE JSON (split or array) ── */
function parseSplit(raw) {
    if (Array.isArray(raw)) {
        return raw.map(r => ({
            t: r.time || r.timestamp || null,
            o: r.Open  ?? r.open  ?? r.Close ?? r.close,
            h: r.High  ?? r.high  ?? r.Close ?? r.close,
            l: r.Low   ?? r.low   ?? r.Close ?? r.close,
            c: r.Close ?? r.close,
            v: r.Volume ?? r.volume ?? 0
        }));
    }
    const { columns, index, data } = raw;
    const ci = k => columns.indexOf(k);
    const O=ci('Open'),H=ci('High'),L=ci('Low'),C=ci('Close'),V=ci('Volume');
    return index.map((ts,i) => ({
        t: ts, o: data[i][O], h: data[i][H],
        l: data[i][L], c: data[i][C], v: data[i][V] ?? 0
    }));
}

/* ── STATE ── */
let candles = [], trades = [], btChart = null, activeTrade = null;

/* ── LOAD ── */
async function load() {
    const [cr, pr] = await Promise.allSettled([
        fetch('/api/web-data/webdaypxy?_=' + Date.now()),
        fetch('/api/web-data/webpnlpxy?_='        + Date.now())
    ]);
    if (cr.status === 'fulfilled' && cr.value.ok) candles = parseSplit(await cr.value.json());
    if (pr.status === 'fulfilled' && pr.value.ok) trades  = await pr.value.json();

    document.getElementById('loadMsg').classList.add('hidden');
    buildSummary();
    buildTradeList();
    drawChart();
}

/* ── SUMMARY ── */
function fmt(n) { return (n >= 0 ? '+' : '') + n.toLocaleString('en-IN'); }

function buildSummary() {
    const total = trades.reduce((s,t) => s + (t.PNL||0), 0);
    const wins  = trades.filter(t => (t.PNL||0) > 0);
    const loss  = trades.filter(t => (t.PNL||0) < 0);
    const rate  = trades.length ? ((wins.length/trades.length)*100).toFixed(0)+'%' : '—';
    const bull  = total >= 0;

    const s = id => document.getElementById(id);
    s('cTotal').textContent = fmt(total);
    s('cTotal').className   = 'chip-val ' + (bull ? 'bull' : 'bear');
    s('cWin').textContent   = fmt(wins.reduce((a,t)=>a+t.PNL,0));
    s('cLoss').textContent  = fmt(loss.reduce((a,t)=>a+t.PNL,0));
    s('cRate').textContent  = rate;
    s('cCount').textContent = trades.length;
    s('cCandles').textContent = candles.length;
}

/* ── LEFT PANEL ROWS ── */
function buildTradeList() {
    const panel = document.getElementById('tradeListPanel');
    panel.innerHTML = '';

    const sorted = [...trades].sort((a,b) => new Date(a.Buy_Time) - new Date(b.Buy_Time));

    sorted.forEach((t, i) => {
        const pnl   = t.PNL || 0;
        const bull  = pnl >= 0;
        const isCE  = (t.Symbol||'').toUpperCase().endsWith('CE');
        const dur   = calcDur(t.Buy_Time, t.Exit_Time);
        const entry = timeOnly(t.Buy_Time);
        const exit  = timeOnly(t.Exit_Time);

        const row = document.createElement('div');
        row.className = 'trade-row';
        row.dataset.tag = t.Tag || i;
        row.innerHTML = `
            <div class="tr-top">
                <span class="tr-sym" title="${t.Symbol||''}">${shortSym(t.Symbol)}</span>
                <span class="tr-pnl ${bull?'bull':'bear'}">${fmt(pnl)}</span>
            </div>
            <div class="tr-mid">
                <span class="tr-tag">#${t.Tag || '—'}</span>
                <span class="tr-type ${isCE?'ce':'pe'}">${isCE?'CALL':'PUT'}</span>
            </div>
            <div class="tr-bot">
                <span class="tr-meta">${entry} → ${exit}</span>
                <span class="tr-meta">${dur} · Qty ${t.Qty??'—'}</span>
            </div>`;

        row.addEventListener('click', () => selectTrade(t));
        panel.appendChild(row);
    });
}

function shortSym(s) {
    if (!s) return '—';
    const m = s.match(/NIFTY\d{2}(\d{2})(\d{2})(\d+)(CE|PE)/i);
    if (m) return `NIFTY ${m[2]}${m[3]} ${m[3]}${m[4]}`;
    return s.length > 22 ? s.slice(0,20)+'…' : s;
}
function timeOnly(dt) {
    if (!dt || dt === 'OPEN') return 'OPEN';
    return String(dt).slice(11,16);
}
function calcDur(buy, sell) {
    if (!buy || !sell || sell === 'OPEN') return 'OPEN';
    const ms = new Date(sell) - new Date(buy);
    if (isNaN(ms)||ms<0) return '—';
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return h > 0 ? `${h}h${m}m` : `${m}m`;
}

/* ── CHART ── */
function drawChart() {
    if (!candles.length) return;
    const labels = candles.map(c => {
        const d = new Date(c.t);
        return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Kolkata' });
    });
    const closes = candles.map(c => c.c);
    const highs  = candles.map(c => c.h);
    const lows   = candles.map(c => c.l);
    const isBull = closes.at(-1) >= closes[0];
    const lineC  = 'rgba(255,255,255,0.7)';

    if (btChart) { btChart.destroy(); btChart = null; }

    btChart = new Chart(document.getElementById('btChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    data: closes, borderColor: lineC, borderWidth: 1.5,
                    pointRadius: 0, pointHoverRadius: 4,
                    pointHoverBackgroundColor: cssVar('--accent'),
                    fill: true, tension: 0.2, order: 1,
                    backgroundColor: ctx2 => {
                        const g = ctx2.chart.ctx.createLinearGradient(0,0,0,ctx2.chart.height);
                        g.addColorStop(0, isBull ? 'rgba(34,197,94,0.10)' : 'rgba(239,68,68,0.10)');
                        g.addColorStop(1, 'rgba(0,0,0,0)');
                        return g;
                    }
                },
                {
                    data: highs, borderColor: 'rgba(34,197,94,0.18)', borderWidth:1,
                    borderDash:[2,4], pointRadius:0, fill:false, tension:0.2, order:2
                },
                {
                    data: lows, borderColor: 'rgba(239,68,68,0.18)', borderWidth:1,
                    borderDash:[2,4], pointRadius:0, fill:false, tension:0.2, order:2
                }
            ]
        },
        options: {
            animation: false, responsive: true, maintainAspectRatio: false,
            interaction: { mode:'index', intersect:false },
            plugins: { legend:{display:false}, tooltip:{enabled:false} },
            scales: {
                x: {
                    display:true,
                    grid:{ color: cssVar('--grid'), drawBorder:false },
                    ticks:{ color:cssVar('--muted'), font:{family:"'DM Mono',monospace",size:9},
                            maxTicksLimit:10, maxRotation:0 }
                },
                y: {
                    display:true, position:'right',
                    grid:{ color:cssVar('--grid'), drawBorder:false },
                    ticks:{ color:cssVar('--muted'), font:{family:"'DM Mono',monospace",size:10}, maxTicksLimit:6 }
                }
            }
        }
    });

    // OHLC on hover
    document.getElementById('btChart').addEventListener('mousemove', e => {
        const pts = btChart.getElementsAtEventForMode(e,'index',{intersect:false},true);
        if (!pts.length) return;
        const c = candles[pts[0].index]; if (!c) return;
        document.getElementById('hO').textContent = c.o?.toFixed(2) ?? '—';
        document.getElementById('hH').textContent = c.h?.toFixed(2) ?? '—';
        document.getElementById('hL').textContent = c.l?.toFixed(2) ?? '—';
        document.getElementById('hC').textContent = c.c?.toFixed(2) ?? '—';
        document.getElementById('hV').textContent = c.v ? Math.round(c.v).toLocaleString('en-IN') : '—';
        document.getElementById('hT').textContent = new Date(c.t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Kolkata'});
    });

    setTimeout(redrawMarkers, 80);
}

function updateChartColors() {
    if (!btChart) return;
    const isBull = candles.at(-1)?.c >= candles[0]?.c;
    btChart.data.datasets[0].borderColor = isBull ? cssVar('--bull') : cssVar('--bear');
    btChart.options.scales.x.grid.color  = cssVar('--grid');
    btChart.options.scales.x.ticks.color = cssVar('--muted');
    btChart.options.scales.y.grid.color  = cssVar('--grid');
    btChart.options.scales.y.ticks.color = cssVar('--muted');
    btChart.update('none');
}

/* ── MARKER HELPERS ── */
function tsToIndex(ts) {
    // pnl.json times are IST with no tz info → parse as IST by appending +05:30
    const tradeStr  = String(ts).trim().replace(' ', 'T');
    const tradeMs   = new Date(tradeStr.includes('+') ? tradeStr : tradeStr + '+05:30').getTime();

    let best = 0, bestDiff = Infinity;
    candles.forEach((c, i) => {
        // chart timestamps are UTC (Z suffix) — convert to ms directly
        const candleMs = new Date(c.t).getTime();
        const d = Math.abs(candleMs - tradeMs);
        if (d < bestDiff) { bestDiff = d; best = i; }
    });
    return best;
}
function indexToPixel(idx) {
    const meta = btChart?.getDatasetMeta(0);
    const pt   = meta?.data[idx];
    return pt ? { x:pt.x, y:pt.y } : null;
}

/* ── DRAW MARKERS ── */
function redrawMarkers() {
    const svg = document.getElementById('markerLayer');
    svg.innerHTML = '';
    if (!btChart || !trades.length) return;
    if (!activeTrade) return; // nothing selected — show clean chart

    const W = btChart.canvas.offsetWidth;
    const H = btChart.canvas.offsetHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.style.width  = W + 'px';
    svg.style.height = H + 'px';

    const bull = cssVar('--bull'), bear = cssVar('--bear');

    // only draw the active trade
    const t = activeTrade;
    const buyIdx  = tsToIndex(t.Buy_Time);
    const sellIdx = tsToIndex(t.Exit_Time);
    const buyPt   = indexToPixel(buyIdx);
    const sellPt  = indexToPixel(sellIdx);
    if (!buyPt || !sellPt) return;

    const isCE   = (t.Symbol||'').toUpperCase().endsWith('CE');
    const isBull = (t.PNL||0) >= 0;
    const lineC  = isBull ? bull : bear;

    // connecting line
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', buyPt.x);  line.setAttribute('y1', buyPt.y);
    line.setAttribute('x2', sellPt.x); line.setAttribute('y2', sellPt.y);
    line.setAttribute('stroke', isCE ? '#22c55e' : '#ef4444');
    line.setAttribute('stroke-width', '2.5');
    line.setAttribute('stroke-dasharray', 'none');
    line.setAttribute('opacity', '0.45');
    svg.appendChild(line);

    const enLabel = isCE ? 'CEn' : 'PEn';
    const exLabel = isCE ? 'CEx' : 'PEx';

    svg.appendChild(makeMark(buyPt.x,  buyPt.y,  enLabel, bull,              0, t, true,  '1'));
    svg.appendChild(makeMark(sellPt.x, sellPt.y, exLabel, isBull ? bull : bear, 0, t, false, '1'));
}

function makeMark(x, y, label, color, ti, trade, isBuy, opacity) {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = 'pointer';
    g.setAttribute('opacity', opacity);

    const gap  = 14;   // distance from candle line
    const s    = 5;    // symbol half-size
    const white = isBuy ? '#22c55e' : '#ef4444';
    const stroke = 1.8;

    if (isBuy) {
        // ✓ tick BELOW entry candle
        const cy = y + gap;
        const tick = document.createElementNS('http://www.w3.org/2000/svg','polyline');
        tick.setAttribute('points', `${x-s},${cy} ${x-1},${cy+s} ${x+s},${cy-s+1}`);
        tick.setAttribute('stroke', white);
        tick.setAttribute('stroke-width', stroke);
        tick.setAttribute('fill', 'none');
        tick.setAttribute('stroke-linecap', 'round');
        tick.setAttribute('stroke-linejoin', 'round');
        g.appendChild(tick);
    } else {
        // ✗ cross ABOVE exit candle
        const cy = y - gap;
        const l1 = document.createElementNS('http://www.w3.org/2000/svg','line');
        l1.setAttribute('x1', x-s); l1.setAttribute('y1', cy-s);
        l1.setAttribute('x2', x+s); l1.setAttribute('y2', cy+s);
        l1.setAttribute('stroke', white);
        l1.setAttribute('stroke-width', stroke);
        l1.setAttribute('stroke-linecap', 'round');
        g.appendChild(l1);

        const l2 = document.createElementNS('http://www.w3.org/2000/svg','line');
        l2.setAttribute('x1', x+s); l2.setAttribute('y1', cy-s);
        l2.setAttribute('x2', x-s); l2.setAttribute('y2', cy+s);
        l2.setAttribute('stroke', white);
        l2.setAttribute('stroke-width', stroke);
        l2.setAttribute('stroke-linecap', 'round');
        g.appendChild(l2);
    }

    g.addEventListener('click', e => { e.stopPropagation(); selectTrade(trade); });
    return g;
}

/* ── SELECT TRADE ── */
function selectTrade(t) {
    activeTrade = t;

    // update left panel rows
    document.querySelectorAll('.trade-row').forEach(row => {
        const match = row.dataset.tag === String(t.Tag);
        row.classList.toggle('active',  match);
        row.classList.toggle('dimmed', !match);
        if (match) row.scrollIntoView({ block:'nearest', behavior:'smooth' });
    });

    // NO zoom — keep full chart context
    setTimeout(() => { redrawMarkers(); }, 30);
}

function clearSelection() {
    activeTrade = null;
    document.querySelectorAll('.trade-row').forEach(r => {
        r.classList.remove('active','dimmed');
    });
    document.getElementById('tooltip').style.display = 'none';
    setTimeout(redrawMarkers, 30);
}

// click chart bg to clear
document.getElementById('rightPanel').addEventListener('click', clearSelection);

/* ── PINNED TOOLTIP ── */
function showTooltip(t) {
    const tt   = document.getElementById('tooltip');
    const pnl  = t.PNL || 0;
    const bull = pnl >= 0;
    const isCE = (t.Symbol||'').toUpperCase().endsWith('CE');
    const dur  = calcDur(t.Buy_Time, t.Exit_Time);

    tt.innerHTML = `
        <div class="tt-header">
            <span class="tt-sym">${t.Symbol || '—'}</span>
            <span class="tt-close" id="ttClose">✕</span>
        </div>
        <div class="tt-row"><span>Tag</span><span class="tt-val" style="color:var(--accent)">#${t.Tag||'—'}</span></div>
        <div class="tt-row"><span>Type</span><span class="tt-val">${isCE?'CALL (CE)':'PUT (PE)'}</span></div>
        <div class="tt-row"><span>Qty</span><span class="tt-val">${t.Qty??'—'}</span></div>
        <div class="tt-row"><span>${isCE?'CEn':'PEn'} entry</span><span class="tt-val">${(+t.Buy_Prc).toFixed(2)} <span style="color:var(--muted)">${timeOnly(t.Buy_Time)}</span></span></div>
        <div class="tt-row"><span>${isCE?'CEx':'PEx'} exit</span><span class="tt-val">${(+t.Sell_Prc).toFixed(2)} <span style="color:var(--muted)">${timeOnly(t.Exit_Time)}</span></span></div>
        <div class="tt-row"><span>Duration</span><span class="tt-val">${dur}</span></div>
        <div class="tt-pnl ${bull?'bull':'bear'}">${fmt(pnl)}</div>`;

    tt.style.display = 'block';
    document.getElementById('ttClose').addEventListener('click', e => {
        e.stopPropagation(); clearSelection();
    });
}

/* ── RESIZE ── */
const ro = new ResizeObserver(() => {
    if (btChart) { btChart.resize(); setTimeout(redrawMarkers, 60); }
});
ro.observe(document.getElementById('rightPanel'));

/* ── START ── */
load();
</script>
