<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PXY® — Trade Commentary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg:      #06080d;
    --bg2:     #0c101a;
    --bg3:     #111827;
    --border:  rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text:    #e8ecf4;
    --muted:   #5b6478;
    --accent:  #3b82f6;
    --bull:    #22c55e;
    --bear:    #ef4444;
    --gold:    #f59e0b;
    --header-h: 52px;
}
[data-theme="light"] {
    --bg:      #f1f5fb; --bg2: #ffffff; --bg3: #e8eef8;
    --border:  rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.14);
    --text:    #0f172a; --muted: #94a3b8; --accent: #2563eb;
    --bull:    #16a34a; --bear:  #dc2626; --gold: #d97706;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { height:100%; }
body {
    min-height:100dvh; font-family:'DM Mono',monospace;
    background:var(--bg); color:var(--text);
    transition:background 0.35s,color 0.35s;
    overscroll-behavior:none;
}
* { scrollbar-width:thin; scrollbar-color:var(--border2) transparent; }
::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* ── HEADER ── */
#topHeader {
    position:sticky; top:0; z-index:100;
    height:var(--header-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 clamp(12px,2.5vw,24px);
    background:var(--bg2); border-bottom:1px solid var(--border);
    gap:10px; transition:background 0.35s,border-color 0.35s;
}
.hdr-left,.hdr-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.back-btn {
    display:flex; align-items:center; gap:5px; padding:4px 11px;
    border:1px solid var(--border2); border-radius:6px;
    color:var(--muted); font-size:11px; letter-spacing:0.06em;
    text-decoration:none; font-family:'DM Mono',monospace; transition:all 0.2s;
}
.back-btn:hover { color:var(--text); background:var(--bg3); }
.divider-v { width:1px; height:18px; background:var(--border2); flex-shrink:0; }
.page-title {
    font-family:'Syne',sans-serif; font-size:clamp(13px,1.6vw,17px);
    font-weight:800; letter-spacing:0.05em;
}
.logo { font-family:'Syne',sans-serif; font-weight:800; font-size:16px; }
.logo sup { font-size:0.55em; vertical-align:super; color:var(--accent); }
.theme-toggle { display:flex; align-items:center; cursor:pointer; user-select:none; }
.toggle-track {
    width:34px; height:18px; border-radius:9px;
    background:var(--bg3); border:1px solid var(--border2);
    position:relative; transition:background 0.35s;
}
[data-theme="light"] .toggle-track { background:var(--accent); border-color:var(--accent); }
.toggle-thumb {
    position:absolute; top:3px; left:3px; width:10px; height:10px;
    border-radius:50%; background:var(--muted);
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),background 0.35s;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
}
[data-theme="light"] .toggle-thumb { transform:translateX(16px); background:#fff; }

/* ── SUMMARY BANNER ── */
#banner {
    display:flex; align-items:stretch; gap:0;
    border-bottom:1px solid var(--border);
    background:var(--bg2); overflow-x:auto; scrollbar-width:none;
    transition:background 0.35s,border-color 0.35s;
}
#banner::-webkit-scrollbar { display:none; }
.banner-cell {
    display:flex; flex-direction:column; justify-content:center;
    padding:12px clamp(14px,2.5vw,28px); gap:3px;
    border-right:1px solid var(--border); flex-shrink:0;
}
.banner-label { font-size:8px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
.banner-val {
    font-family:'Syne',sans-serif; font-size:clamp(16px,2vw,22px);
    font-weight:800; letter-spacing:-0.5px;
}
.banner-val.bull { color:var(--bull); }
.banner-val.bear { color:var(--bear); }
.banner-val.gold { color:var(--gold); }
.banner-val.blue { color:var(--accent); }

/* ── MAIN LAYOUT ── */
#main {
    display:grid;
    grid-template-columns: 1fr 1fr;   /* desktop/TV: 50% / 50% */
    grid-template-rows: 1fr;
    height:calc(100dvh - var(--header-h) - 56px);
    overflow:hidden;
}

/* ── LEFT: REPLAY PLAYER ── */
#player {
    display:flex; flex-direction:column;
    border-right:1px solid var(--border);
    overflow:hidden; background:var(--bg);
    transition:background 0.35s;
}

/* ── RESPONSIVE ── */
@media (max-width:900px) {
    /* mobile: vertical split — 70% tile / 30% script */
    #main {
        grid-template-columns: 1fr;
        grid-template-rows: 70% 30%;
    }
    #player { border-right:none; border-bottom:1px solid var(--border); }
}
@media (max-width:640px) {
    #main { grid-template-rows: 70% 30%; }
}
#stage {
    flex:1; position:relative; overflow:hidden;
    background:radial-gradient(ellipse at 50% 60%, rgba(15,25,50,0.8), var(--bg));
    display:flex; align-items:center; justify-content:center;
}

/* trade card shown in replay */
#tradeCard {
    width:clamp(280px,55%,420px);
    background:var(--bg2); border:1px solid var(--border2);
    border-radius:20px; padding:clamp(20px,3vw,36px);
    box-shadow:0 24px 80px rgba(0,0,0,0.6);
    display:flex; flex-direction:column; gap:14px;
    opacity:0; transform:translateY(24px) scale(0.96);
    transition:opacity 0.45s ease, transform 0.45s ease;
    position:relative; overflow:hidden;
}
#tradeCard.visible { opacity:1; transform:none; }
#tradeCard::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--card-accent, var(--bull));
    border-radius:20px 20px 0 0;
}

.card-badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 10px; border-radius:4px; font-size:10px;
    font-weight:600; letter-spacing:0.1em; align-self:flex-start;
}
.card-badge.bull { background:var(--bull-dim,rgba(34,197,94,0.13)); color:var(--bull); }
.card-badge.bear { background:var(--bear-dim,rgba(239,68,68,0.13)); color:var(--bear); }

.card-symbol {
    font-family:'Syne',sans-serif; font-weight:800;
    font-size:clamp(14px,2vw,18px); line-height:1.2;
    word-break:break-all;
}

.card-pnl {
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(42px,7vw,72px); letter-spacing:-1px; line-height:1;
    margin:4px 0;
}
.card-pnl.bull { color:var(--bull); text-shadow:0 0 30px rgba(34,197,94,0.3); }
.card-pnl.bear { color:var(--bear); text-shadow:0 0 30px rgba(239,68,68,0.3); }

.card-meta {
    display:grid; grid-template-columns:1fr 1fr;
    gap:10px; border-top:1px solid var(--border); padding-top:12px;
}
.meta-item { display:flex; flex-direction:column; gap:2px; }
.meta-label { font-size:8px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
.meta-val   { font-size:12px; color:var(--text); }

.card-commentary {
    font-size:clamp(11px,1.1vw,13px); color:var(--muted);
    line-height:1.6; border-top:1px solid var(--border); padding-top:12px;
    font-style:italic;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
}

/* progress bar */
#progressBar {
    height:3px; background:var(--bg3); flex-shrink:0;
    transition:background 0.35s;
}
#progressFill {
    height:100%; background:var(--accent);
    width:0%; transition:width 0.4s ease;
}

/* controls */
#controls {
    display:flex; align-items:center; gap:8px;
    padding:10px clamp(12px,2vw,20px);
    background:var(--bg2); border-top:1px solid var(--border);
    flex-shrink:0; transition:background 0.35s,border-color 0.35s;
}

.ctrl-btn {
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px;
    border:1px solid var(--border2); background:transparent;
    color:var(--text); cursor:pointer; font-size:14px;
    transition:all 0.15s; font-family:'DM Mono',monospace;
}
.ctrl-btn:hover { background:var(--bg3); border-color:var(--accent); color:var(--accent); }
.ctrl-btn.primary {
    background:var(--accent); border-color:var(--accent); color:#fff;
    width:40px; height:40px; font-size:16px;
}
.ctrl-btn.primary:hover { opacity:0.85; }

.ctrl-counter {
    font-size:11px; color:var(--muted); margin-left:4px;
    flex-shrink:0; font-variant-numeric:tabular-nums;
}

.ctrl-speed {
    margin-left:auto;
    display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted);
}
.speed-btn {
    padding:3px 8px; border-radius:4px;
    border:1px solid var(--border2); background:transparent;
    color:var(--muted); font-size:10px; cursor:pointer;
    font-family:'DM Mono',monospace; transition:all 0.15s;
}
.speed-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── RIGHT: SCRIPT ── */
#scriptPanel {
    display:flex; flex-direction:column; overflow:hidden;
}

#scriptHeader {
    height:40px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid var(--border);
    background:var(--bg2); flex-shrink:0;
    transition:background 0.35s,border-color 0.35s;
}
.script-title { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }

.copy-btn {
    padding:3px 10px; border-radius:4px;
    border:1px solid var(--border2); background:transparent;
    color:var(--muted); font-size:10px; cursor:pointer;
    font-family:'DM Mono',monospace; transition:all 0.15s;
}
.copy-btn:hover { color:var(--text); background:var(--bg3); }
.copy-btn.copied { color:var(--bull); border-color:var(--bull); }

#scriptFeed {
    flex:1; overflow-y:auto; padding:12px 0;
}

.script-item {
    padding:10px 16px; border-bottom:1px solid var(--border);
    cursor:pointer; transition:background 0.15s;
}
.script-item:hover { background:var(--bg3); }
.script-item.active {
    background:var(--bg3); border-left:2px solid var(--accent);
    padding-left:14px;
}
.script-num { font-size:9px; color:var(--muted); letter-spacing:0.1em; margin-bottom:4px; }
.script-line { font-size:12px; line-height:1.6; color:var(--text); }
.script-line .bull { color:var(--bull); }
.script-line .bear { color:var(--bear); }
.script-line .gold { color:var(--gold); }

/* ── BOTTOM ── */
#bottomBar {
    display:flex; align-items:center; gap:12px;
    padding:0 clamp(12px,2.5vw,24px);
    height:56px; background:var(--bg2); border-top:1px solid var(--border);
    transition:background 0.35s,border-color 0.35s;
}
.yt-btn {
    display:flex; align-items:center; gap:7px;
    padding:7px 18px; border-radius:8px;
    background:#ff0000; border:none; color:#fff;
    font-family:'Syne',sans-serif; font-size:13px; font-weight:700;
    letter-spacing:0.05em; cursor:pointer; transition:opacity 0.2s;
}
.yt-btn:hover { opacity:0.85; }
.yt-icon { font-size:15px; }

.export-btn {
    display:flex; align-items:center; gap:6px;
    padding:7px 16px; border-radius:8px;
    border:1px solid var(--border2); background:transparent;
    color:var(--muted); font-size:12px; cursor:pointer;
    font-family:'DM Mono',monospace; transition:all 0.2s;
}
.export-btn:hover { color:var(--text); background:var(--bg3); }

.bottom-hint { font-size:10px; color:var(--muted); margin-left:auto; line-height:1.4; }

</style>
</head>
<body>

<header id="topHeader">
    <div class="hdr-left">
        <a class="back-btn" href="webpxy.html">← DASHBOARD</a>
        <div class="divider-v"></div>
        <span class="page-title">Trade Commentary</span>
    </div>
    <div class="hdr-right">
        <div class="theme-toggle" id="themeToggle">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
        <div class="divider-v"></div>
        <span class="logo">PXY<sup>®</sup></span>
    </div>
</header>

<!-- SUMMARY BANNER -->
<div id="banner">
    <div class="banner-cell">
        <span class="banner-label">Total P&amp;L</span>
        <span class="banner-val" id="bTotal">—</span>
    </div>
    <div class="banner-cell">
        <span class="banner-label">Trades</span>
        <span class="banner-val blue" id="bCount">—</span>
    </div>
    <div class="banner-cell">
        <span class="banner-label">Win Rate</span>
        <span class="banner-val gold" id="bRate">—</span>
    </div>
    <div class="banner-cell">
        <span class="banner-label">Best</span>
        <span class="banner-val bull" id="bBest">—</span>
    </div>
    <div class="banner-cell">
        <span class="banner-label">Worst</span>
        <span class="banner-val bear" id="bWorst">—</span>
    </div>
    <div class="banner-cell">
        <span class="banner-label">Date</span>
        <span class="banner-val" id="bDate" style="font-size:clamp(12px,1.2vw,15px)">—</span>
    </div>
</div>

<!-- MAIN -->
<div id="main">

    <!-- LEFT: visual replay -->
    <div id="player">
        <div id="stage">
            <div id="tradeCard">
                <div class="card-badge bull" id="cardBadge">CALL · CE</div>
                <div class="card-symbol" id="cardSym">—</div>
                <div class="card-pnl bull" id="cardPnl">—</div>
                <div class="card-meta">
                    <div class="meta-item">
                        <span class="meta-label">Entry</span>
                        <span class="meta-val" id="cardEntry">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Exit</span>
                        <span class="meta-val" id="cardExit">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Buy @ </span>
                        <span class="meta-val" id="cardBuy">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Sell @</span>
                        <span class="meta-val" id="cardSell">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Qty</span>
                        <span class="meta-val" id="cardQty">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Duration</span>
                        <span class="meta-val" id="cardDur">—</span>
                    </div>
                </div>
                <div class="card-commentary" id="cardComment">—</div>
            </div>
        </div>

        <div id="progressBar"><div id="progressFill"></div></div>

        <div id="controls">
            <button class="ctrl-btn" id="btnPrev" title="Previous">◀</button>
            <button class="ctrl-btn primary" id="btnPlay" title="Play / Pause">▶</button>
            <button class="ctrl-btn" id="btnNext" title="Next">▶</button>
            <span class="ctrl-counter" id="counter">0 / 0</span>
            <div class="ctrl-speed">
                <span>Speed</span>
                <button class="speed-btn" data-s="3000">0.5×</button>
                <button class="speed-btn active" data-s="1800">1×</button>
                <button class="speed-btn" data-s="900">2×</button>
                <button class="speed-btn" data-s="400">4×</button>
            </div>
        </div>
    </div>

    <!-- RIGHT: script -->
    <div id="scriptPanel">
        <div id="scriptHeader">
            <span class="script-title">📝 YouTube Script</span>
            <button class="copy-btn" id="copyBtn">Copy All</button>
        </div>
        <div id="scriptFeed"></div>
    </div>

</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
    <button class="yt-btn" id="ytBtn">
        <span class="yt-icon">▶</span> Export Script
    </button>
    <button class="export-btn" id="exportTxt">↓ .TXT</button>
    <span class="bottom-hint">
        Record your screen while playing the replay<br>
        + read the script = instant YouTube video
    </span>
</div>

<script>
'use strict';

/* ── THEME ── */
const html = document.documentElement;
document.getElementById('themeToggle').addEventListener('click', () => {
    const dark = html.getAttribute('data-theme') !== 'light';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
});

/* ── STATE ── */
let trades    = [];
let scripts   = [];
let current   = -1;
let playing   = false;
let playTimer = null;
let speed     = 1800;

/* ── LOAD ── */
async function load() {
    try {
        const res = await fetch('/api/web-data/webpnlpxy?_=' + Date.now());
        trades = await res.json();
    } catch { trades = []; }

    if (!trades.length) {
        document.getElementById('cardComment').textContent = 'No trades found in pnl.json.';
        return;
    }

    // sort by entry time
    trades.sort((a,b) => new Date(a.Buy_Time) - new Date(b.Buy_Time));

    buildBanner();
    buildScripts();
    buildScriptPanel();
    showTrade(0);
}

/* ── BANNER ── */
function fmt(n) { return (n >= 0 ? '+' : '') + n.toLocaleString('en-IN'); }

function buildBanner() {
    const total  = trades.reduce((s,t) => s+(t.PNL||0), 0);
    const wins   = trades.filter(t => (t.PNL||0) > 0);
    const rate   = trades.length ? ((wins.length/trades.length)*100).toFixed(0)+'%' : '—';
    const best   = Math.max(...trades.map(t => t.PNL||0));
    const worst  = Math.min(...trades.map(t => t.PNL||0));
    const date   = trades[0]?.Buy_Time?.slice(0,10) || '—';

    const el = id => document.getElementById(id);
    el('bTotal').textContent = fmt(total);
    el('bTotal').className   = 'banner-val ' + (total >= 0 ? 'bull' : 'bear');
    el('bCount').textContent = trades.length;
    el('bRate').textContent  = rate;
    el('bBest').textContent  = fmt(best);
    el('bWorst').textContent = fmt(worst);
    el('bDate').textContent  = date;
}

/* ── GENERATE SCRIPTS ── */
function buildScripts() {
    const total    = trades.reduce((s,t) => s+(t.PNL||0), 0);
    const wins     = trades.filter(t => (t.PNL||0) > 0).length;
    const date     = trades[0]?.Buy_Time?.slice(0,10) || 'today';
    const bull     = total >= 0;

    scripts = [];

    // INTRO
    scripts.push({
        tradeIdx: -1,
        type: 'intro',
        line: `Welcome back to PXY trading. Today is ${date}. ` +
              `We took ${trades.length} trades today, and I'm going to walk you through every single one — ` +
              `what happened, why we entered, and what the result was. ` +
              `Total P&L for the day: ${fmt(total)}. Let's get into it.`
    });

    // PER TRADE
    trades.forEach((t, i) => {
        const pnl    = t.PNL || 0;
        const bull   = pnl >= 0;
        const isCE   = (t.Symbol||'').toUpperCase().endsWith('CE');
        const type   = isCE ? 'Call option' : 'Put option';
        const dir    = isCE ? 'bullish' : 'bearish';
        const entry  = t.Buy_Time?.slice(11,16) || '—';
        const exit   = t.Exit_Time?.slice(11,16) || '—';
        const dur    = calcDur(t.Buy_Time, t.Exit_Time);
        const tag    = t.Tag || i+1;
        const sym    = t.Symbol || 'Unknown';
        const qty    = t.Qty || 1;
        const buy    = (+t.Buy_Prc).toFixed(2);
        const sell   = (+t.Sell_Prc).toFixed(2);
        const result = bull
            ? `We booked a profit of ₹${pnl.toLocaleString('en-IN')}. Clean trade.`
            : `This one went against us. Loss of ₹${Math.abs(pnl).toLocaleString('en-IN')}.`;

        const mood = pnl >= 500  ? 'This was our best trade of the session — beautifully timed.' :
                     pnl >= 200  ? 'A solid winner. The setup played out well.' :
                     pnl >= 0    ? 'Small profit — took what the market gave us.' :
                     pnl >= -200 ? 'A small loss — cut quickly, no damage done.' :
                     pnl >= -500 ? 'This one stung a bit. Market moved against us fast.' :
                                   'Our biggest loss today. These happen — risk is managed.';

        scripts.push({
            tradeIdx: i,
            type: bull ? 'win' : 'loss',
            short: `${isCE?'Call':'Put'} ${sym.slice(-8)} · ${entry}→${exit} · ${dur}. ${result}`,
            line: `Trade ${i+1} of ${trades.length}. Tag ${tag}. ` +
                  `We bought a ${type} — ${sym} — at ${buy}, quantity ${qty}. ` +
                  `This was a ${dir} view, entered at ${entry}. ` +
                  `We exited at ${exit}, selling at ${sell}. Held for ${dur}. ` +
                  `${result} ${mood}`
        });
    });

    // OUTRO
    const topTrade = trades.reduce((a,b) => (a.PNL||0) > (b.PNL||0) ? a : b);
    scripts.push({
        tradeIdx: -1,
        type: 'outro',
        line: `That wraps up today's session. ${trades.length} trades. ` +
              `${wins} winners, ${trades.length - wins} losers. ` +
              `Total P&L: ${fmt(total)}. ` +
              `Best trade of the day: ${topTrade.Symbol} at ₹${(topTrade.PNL||0).toLocaleString('en-IN')}. ` +
              `If you found this useful, hit like and subscribe. ` +
              `See you tomorrow at market open. Stay disciplined.`
    });
}

/* ── SCRIPT PANEL ── */
function buildScriptPanel() {
    const feed = document.getElementById('scriptFeed');
    feed.innerHTML = '';

    scripts.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'script-item';
        item.dataset.idx = i;

        const label = s.type === 'intro' ? 'INTRO'
                    : s.type === 'outro' ? 'OUTRO'
                    : `TRADE ${s.tradeIdx + 1}`;

        const colorClass = s.type === 'intro' ? '' :
                           s.type === 'outro' ? '' :
                           s.type === 'win'   ? 'bull' : 'bear';

        item.innerHTML = `
            <div class="script-num">${label}</div>
            <div class="script-line ${colorClass}">${s.line}</div>`;
        item.addEventListener('click', () => {
            if (s.tradeIdx >= 0) showTrade(s.tradeIdx);
            setActiveScript(i);
        });
        feed.appendChild(item);
    });
}

function setActiveScript(idx) {
    document.querySelectorAll('.script-item').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.script-item[data-idx="${idx}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
}

/* ── SHOW TRADE CARD ── */
function showTrade(idx) {
    if (idx < 0 || idx >= trades.length) return;
    current = idx;

    const t     = trades[idx];
    const pnl   = t.PNL || 0;
    const bull  = pnl >= 0;
    const isCE  = (t.Symbol||'').toUpperCase().endsWith('CE');
    const card  = document.getElementById('tradeCard');

    // animate out then in
    card.classList.remove('visible');
    setTimeout(() => {
        card.style.setProperty('--card-accent', bull ? 'var(--bull)' : 'var(--bear)');

        document.getElementById('cardBadge').textContent = isCE ? 'CALL · CE' : 'PUT · PE';
        document.getElementById('cardBadge').className   = `card-badge ${bull?'bull':'bear'}`;
        document.getElementById('cardSym').textContent   = t.Symbol || '—';
        document.getElementById('cardPnl').textContent   = (bull?'+':'') + pnl.toLocaleString('en-IN');
        document.getElementById('cardPnl').className     = `card-pnl ${bull?'bull':'bear'}`;
        document.getElementById('cardEntry').textContent = t.Buy_Time?.slice(11,16) || '—';
        document.getElementById('cardExit').textContent  = t.Exit_Time?.slice(11,16) || '—';
        document.getElementById('cardBuy').textContent   = (+t.Buy_Prc).toFixed(2);
        document.getElementById('cardSell').textContent  = (+t.Sell_Prc).toFixed(2);
        document.getElementById('cardQty').textContent   = t.Qty || '—';
        document.getElementById('cardDur').textContent   = calcDur(t.Buy_Time, t.Exit_Time);

        // find matching script line — use short for card, full for script panel
        const sc = scripts.find(s => s.tradeIdx === idx);
        document.getElementById('cardComment').textContent = sc ? (sc.short || sc.line) : '—';

        // progress
        document.getElementById('progressFill').style.width = ((idx+1)/trades.length*100) + '%';
        document.getElementById('counter').textContent = `${idx+1} / ${trades.length}`;

        card.classList.add('visible');

        // highlight script
        const scIdx = scripts.findIndex(s => s.tradeIdx === idx);
        if (scIdx >= 0) setActiveScript(scIdx);
    }, 200);
}

/* ── PLAYBACK ── */
function playNext() {
    if (current < trades.length - 1) {
        showTrade(current + 1);
    } else {
        stopPlay();
        // show outro
        setActiveScript(scripts.length - 1);
    }
}

function startPlay() {
    playing = true;
    document.getElementById('btnPlay').textContent = '⏸';
    document.getElementById('btnPlay').title = 'Pause';
    playTimer = setInterval(playNext, speed);
}

function stopPlay() {
    playing = false;
    clearInterval(playTimer);
    document.getElementById('btnPlay').textContent = '▶';
    document.getElementById('btnPlay').title = 'Play';
}

document.getElementById('btnPlay').addEventListener('click', () => {
    if (playing) stopPlay();
    else {
        if (current >= trades.length - 1) showTrade(0);
        startPlay();
    }
});

document.getElementById('btnPrev').addEventListener('click', () => {
    stopPlay();
    if (current > 0) showTrade(current - 1);
    else {
        // show intro
        setActiveScript(0);
    }
});

document.getElementById('btnNext').addEventListener('click', () => {
    stopPlay();
    if (current < trades.length - 1) showTrade(current + 1);
});

document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        speed = +btn.dataset.s;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (playing) { stopPlay(); startPlay(); }
    });
});

/* ── COPY / EXPORT ── */
function fullScript() {
    return scripts.map((s,i) => {
        const label = s.type==='intro' ? '--- INTRO ---' :
                      s.type==='outro' ? '--- OUTRO ---' :
                      `--- TRADE ${s.tradeIdx+1} ---`;
        return label + '\n' + s.line;
    }).join('\n\n');
}

document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(fullScript()).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✓ Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy All'; btn.classList.remove('copied'); }, 2000);
    });
});

document.getElementById('ytBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(fullScript()).then(() => {
        alert('Script copied! Paste it into Notion, Google Docs, or a teleprompter app while screen recording the replay.');
    });
});

document.getElementById('exportTxt').addEventListener('click', () => {
    const blob = new Blob([fullScript()], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'pxy-trade-commentary.txt';
    a.click(); URL.revokeObjectURL(url);
});

/* ── HELPERS ── */
function calcDur(buy, sell) {
    if (!buy || !sell || sell === 'OPEN') return '—';
    const ms = new Date(sell) - new Date(buy);
    if (isNaN(ms)||ms<0) return '—';
    const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
    return h>0 ? `${h}h ${m}m` : `${m}m`;
}

/* ── START ── */
load();
</script>
