<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PXY">
<meta name="application-name" content="PXY Dashboard">
<meta name="theme-color" content="#06080d" id="themeColorMeta">
<title>PXY® Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

<style>
/* ══════════════════════════════════════════
   TOKENS
══════════════════════════════════════════ */
:root,
[data-theme="dark"] {
    --bg:          #06080d;
    --bg2:         #0c101a;
    --bg3:         #111827;
    --border:      rgba(255,255,255,0.06);
    --border2:     rgba(255,255,255,0.13);
    --text:        #e8ecf4;
    --muted:       #5b6478;
    --accent:      #3b82f6;
    --bull:        #22c55e;
    --bear:        #ef4444;
    --bull-dim:    rgba(34,197,94,0.13);
    --bear-dim:    rgba(239,68,68,0.13);
    --gold:        #f59e0b;
    --grid:        rgba(255,255,255,0.035);
    --shadow:      rgba(0,0,0,0.55);
    --chart-grid:  rgba(255,255,255,0.04);
    --chart-tick:  #374151;
    --toggle-bg:   #1e293b;
    --track-mid:   rgba(255,255,255,0.09);
    --scanline:    rgba(255,255,255,0.011);
    --header-h:    48px;
    --stats-h:     36px;
    --bottom-h:    52px;
    --term-bg:     #06080d;
}

[data-theme="light"] {
    --bg:          #f1f5fb;
    --bg2:         #ffffff;
    --bg3:         #e8eef8;
    --border:      rgba(0,0,0,0.07);
    --border2:     rgba(0,0,0,0.14);
    --text:        #0f172a;
    --muted:       #94a3b8;
    --accent:      #2563eb;
    --bull:        #16a34a;
    --bear:        #dc2626;
    --bull-dim:    rgba(22,163,74,0.11);
    --bear-dim:    rgba(220,38,38,0.11);
    --gold:        #d97706;
    --grid:        rgba(0,0,0,0.04);
    --shadow:      rgba(0,0,0,0.14);
    --chart-grid:  rgba(0,0,0,0.05);
    --chart-tick:  #94a3b8;
    --toggle-bg:   #dde4f0;
    --track-mid:   rgba(0,0,0,0.07);
    --scanline:    rgba(0,0,0,0.005);
    --term-bg:     #f8fafc;
}

/* ══════════════════════════════════════════
   RESET + BASE
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
    height: 100%;
    /* fill safe areas on notched phones */
    padding: env(safe-area-inset-top)
             env(safe-area-inset-right)
             env(safe-area-inset-bottom)
             env(safe-area-inset-left);
}

body {
    height: 100%;
    overflow: hidden;
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    transition: background 0.35s, color 0.35s;
    /* prevent pull-to-refresh on mobile */
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}

/* ── scrollbars ── */
* { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ══════════════════════════════════════════
   LAYOUT SHELL  (header / main / bottom)
══════════════════════════════════════════ */
#app {
    display: grid;
    grid-template-rows: var(--header-h) 1fr var(--bottom-h);
    height: 100dvh;   /* dynamic viewport for mobile browsers */
    width: 100%;
}

/* ══════════════════════════════════════════
   HEADER
══════════════════════════════════════════ */
#topHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(10px, 2vw, 20px);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    transition: background 0.35s, box-shadow 0.5s, border-color 0.35s;
    gap: 8px;
    overflow: hidden;
}

#headerLeft, #headerRight {
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.2vw, 14px);
    flex-shrink: 0;
}

#headerCenter {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 1;
    overflow: hidden;
}

/* logo */
.logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(15px, 2vw, 20px);
    letter-spacing: -0.5px;
    color: var(--text);
    white-space: nowrap;
    transition: color 0.35s;
}
.logo sup {
    font-size: 0.55em;
    vertical-align: super;
    color: var(--accent);
}

.company-name {
    font-size: clamp(7px, 0.9vw, 10px);
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 0.35s;
}
.company-name sup {
    font-size: 0.75em;
    vertical-align: super;
    color: var(--accent);
}

/* price */
.price-display {
    font-family: 'Syne', sans-serif;
    font-size: clamp(14px, 2.2vw, 22px);
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    white-space: nowrap;
    transition: color 0.35s;
}

.price-change {
    font-size: clamp(9px, 1vw, 11px);
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    transition: all 0.4s;
}
.price-change.bull { background: var(--bull-dim); color: var(--bull); }
.price-change.bear { background: var(--bear-dim); color: var(--bear); }

/* divider */
.divider-v {
    width: 1px; height: 20px;
    background: var(--border2);
    flex-shrink: 0;
    transition: background 0.35s;
}

/* theme toggle */
.theme-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--toggle-bg);
    transition: background 0.35s, border-color 0.35s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
.theme-toggle:hover { border-color: var(--accent); }
.theme-toggle:active { opacity: 0.75; }

.toggle-emoji { font-size: 11px; line-height: 1; transition: opacity 0.3s, transform 0.4s; }
[data-theme="dark"]  .toggle-emoji-sun  { opacity: 0.35; transform: rotate(30deg) scale(0.85); }
[data-theme="light"] .toggle-emoji-moon { opacity: 0.35; transform: rotate(-30deg) scale(0.85); }

.toggle-track {
    width: 30px; height: 16px;
    border-radius: 8px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    position: relative;
    flex-shrink: 0;
    transition: background 0.35s;
}
.toggle-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.35s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
[data-theme="light"] .toggle-thumb { transform: translateX(14px); background: var(--gold); }

/* hamburger menu */
#menu { position: relative; }
.menu-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border: 1px solid var(--border2);
    border-radius: 6px;
    font-size: clamp(9px, 0.9vw, 11px);
    letter-spacing: 0.07em;
    color: var(--muted);
    background: transparent;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    white-space: nowrap;
}
.menu-btn:hover, .menu-btn:active { color: var(--text); background: var(--bg3); }
.menu-icon { display: flex; flex-direction: column; gap: 3px; }
.menu-icon span { display: block; width: 13px; height: 1px; background: currentColor; }

#dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    overflow: hidden;
    display: none;
    min-width: 180px;
    box-shadow: 0 16px 40px var(--shadow);
    z-index: 200;
    transition: background 0.35s;
}
#menu.open #dropdown { display: block; }

.nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    transition: background 0.15s, color 0.15s;
    cursor: pointer;
}
.nav-item:last-child { border-bottom: none; }
.nav-item:hover, .nav-item:active { background: var(--bg3); }

.nav-icon  { font-size: 14px; flex-shrink: 0; }
.nav-label {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    flex: 1;
}
.nav-arrow {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.2s;
}
.nav-item:hover .nav-arrow { transform: translateX(3px); color: var(--accent); }

/* ══════════════════════════════════════════
   MAIN BODY  (terminal | chart)
══════════════════════════════════════════ */
#main {
    display: flex;
    overflow: hidden;
    position: relative;
}

/* ── TERMINAL PANEL ── */
#terminalPanel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    transition: border-color 0.35s, width 0.25s ease;
    flex-shrink: 0;
    /* default desktop: 32% */
    width: 32%;
    min-width: 0;
}

.panel-header {
    height: 30px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 7px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    transition: background 0.35s, border-color 0.35s;
}
.panel-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
}
.panel-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.panel-dot.g { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
.panel-dot.a { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
.panel-dot.c { background: #22d3ee; box-shadow: 0 0 5px #22d3ee; }

#terminal {
    flex: 1;
    overflow: hidden;
    padding: 4px;
    background: var(--term-bg);
    transition: background 0.35s;
}

/* ── DRAG DIVIDER ── */
#divider {
    width: 5px;
    cursor: col-resize;
    background: var(--bg);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    transition: background 0.2s, border-color 0.35s;
    touch-action: none;
}
#divider:hover { background: var(--bg3); }
#divider::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 2px; height: 36px;
    background: var(--border2);
    border-radius: 2px;
}

/* ── RIGHT PANEL ── */
#right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
}

/* chart */
#chartWrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    transition: background 0.35s;
}
#chartWrap::after {
    content: '';
    position: absolute; inset: 0;
    background:
        linear-gradient(to right,  transparent 93%, var(--bg) 100%),
        linear-gradient(to bottom, transparent 88%, var(--bg) 100%);
    pointer-events: none;
    z-index: 2;
}
.grid-overlay {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: clamp(40px,5vw,70px) clamp(40px,5vh,70px);
}
canvas#priceChart {
    position: absolute; inset: 0;
    width: 100% !important; height: 100% !important;
    z-index: 1;
}

/* ══════════════════════════════════════════
   BOTTOM BAR (momentum candle)
══════════════════════════════════════════ */
#bottomBar {
    display: flex;
    align-items: center;
    padding: 0 clamp(10px,2vw,18px);
    gap: clamp(8px,1.5vw,16px);
    background: var(--bg2);
    border-top: 1px solid var(--border);
    transition: background 0.35s, border-color 0.35s;
    overflow: hidden;
}

.bottom-label {
    font-size: clamp(8px,0.85vw,10px);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
}

#topCandleWrap {
    flex: 1;
    height: 36px;
    position: relative;
    background: var(--bg3);
    border-radius: 6px;
    border: 1px solid var(--border);
    overflow: hidden;
    min-width: 0;
    transition: background 0.35s, border-color 0.35s;
}
canvas#topCandle {
    position: absolute; inset: 0;
    width: 100% !important; height: 100% !important;
}

.time-display {
    font-size: clamp(9px,0.9vw,11px);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color 0.35s;
}

/* ══════════════════════════════════════════
   SCANLINE
══════════════════════════════════════════ */
@keyframes scanline {
    from { transform: translateY(-100%); }
    to   { transform: translateY(100dvh); }
}
.scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 80px;
    background: linear-gradient(to bottom, transparent, var(--scanline), transparent);
    pointer-events: none; z-index: 9999;
    animation: scanline 9s linear infinite;
}

/* ══════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════ */
@keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
}

/* ══════════════════════════════════════════
   MOBILE  (≤ 640px)  —  stacked layout
══════════════════════════════════════════ */
@media (max-width: 640px) {
    :root, [data-theme="dark"], [data-theme="light"] {
        --header-h:  52px;
        --stats-h:   34px;
        --bottom-h:  58px;
    }

    /* hide company name on tiny screens */
    .company-name, #headerLeft .divider-v:first-of-type { display: none; }
    /* hide trend badge text if very small */
    .trend-badge { padding: 2px 5px; font-size: 8px; }

    /* stack: terminal on top, chart below */
    #main { flex-direction: column; }

    #terminalPanel {
        width: 100% !important;
        height: 50%;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }

    #terminal .xterm { zoom: 1.2; }

    /* hide drag divider on mobile */
    #divider { display: none; }

    #right { flex: 1; }

    /* tighten chart right-fade on mobile */
    #chartWrap::after {
        background:
            linear-gradient(to right,  transparent 96%, var(--bg) 100%),
            linear-gradient(to bottom, transparent 88%, var(--bg) 100%);
    }

    /* hide toggle label text on small screens */
    .toggle-emoji { font-size: 13px; }
    .toggle-track { width: 28px; }
}

/* ══════════════════════════════════════════
   TABLET  (641px – 1023px)
══════════════════════════════════════════ */
@media (min-width: 641px) and (max-width: 1023px) {
    :root, [data-theme="dark"], [data-theme="light"] {
        --header-h: 48px;
        --bottom-h: 50px;
    }
    #terminalPanel { width: 38%; }
    .company-name { display: none; }
}

/* ══════════════════════════════════════════
   DESKTOP  (≥ 1024px)
══════════════════════════════════════════ */
@media (min-width: 1024px) {
    :root, [data-theme="dark"], [data-theme="light"] {
        --header-h: 48px;
        --stats-h:  36px;
        --bottom-h: 52px;
    }
    #terminalPanel { width: 32%; }
}

/* ══════════════════════════════════════════
   TV / LARGE SCREEN  (≥ 1920px)
══════════════════════════════════════════ */
@media (min-width: 1920px) {
    :root, [data-theme="dark"], [data-theme="light"] {
        --header-h: 64px;
        --stats-h:  44px;
        --bottom-h: 68px;
    }
    .logo      { font-size: 26px; }
    .price-display { font-size: 28px; }
    .company-name  { font-size: 12px; letter-spacing: 0.14em; }
    .price-change  { font-size: 14px; padding: 4px 10px; }
    .trend-badge   { font-size: 12px; padding: 4px 10px; }
    .stat-key  { font-size: 11px; }
    .stat-val  { font-size: 15px; }
    .bottom-label { font-size: 12px; }
    .time-display { font-size: 14px; }
    #topCandleWrap { height: 46px; border-radius: 8px; }
    #terminalPanel { width: 28%; }
    .menu-btn  { font-size: 13px; padding: 7px 14px; }
    .menu-icon span { width: 16px; }
}

/* ══════════════════════════════════════════
   XTERM OVERRIDES
══════════════════════════════════════════ */
.xterm { height: 100% !important; }
.xterm-viewport { background: transparent !important; }
.xterm-screen   { background: transparent !important; }

</style>
</head>

<body>
<div class="scanline"></div>

<div id="app">

    <!-- ══ HEADER ══ -->
    <header id="topHeader">

        <!-- LEFT: menu + live + trend -->
        <div id="headerLeft">
            <div id="menu">
                <div class="menu-btn" id="menuBtn">
                    <div class="menu-icon">
                        <span></span><span></span><span></span>
                    </div>
                    <span>PXY</span>
                </div>
                <div id="dropdown">
                    <a class="nav-item" href="#" id="navGame">
                        <span class="nav-icon">🎮</span>
                        <span class="nav-label">GAME</span>
                        <span class="nav-arrow">→</span>
                    </a>
                    <a class="nav-item" href="#" id="navTrades">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">TRADES</span>
                        <span class="nav-arrow">→</span>
                    </a>
                    <a class="nav-item" href="#" id="navBacktest">
                        <span class="nav-icon">🔬</span>
                        <span class="nav-label">SIM</span>
                        <span class="nav-arrow">→</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- CENTER: PnL -->
        <div id="headerCenter">
            <span class="pnl-label">PnL</span>
            <span class="price-display" id="priceDisplay">—</span>
            <span class="price-change bull" id="priceChange">+0.00%</span>
        </div>

        <!-- RIGHT: toggle + logo -->
        <div id="headerRight">
            <div class="theme-toggle" id="themeToggle" title="Toggle theme">
                <span class="toggle-emoji toggle-emoji-moon">🌙</span>
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
                <span class="toggle-emoji toggle-emoji-sun">☀️</span>
            </div>
            <div class="divider-v"></div>
            <span class="company-name">PreciseXceleratedYield Pvt Ltd<sup>™</sup></span>
            <div class="divider-v"></div>
            <span class="logo">PXY<sup>®</sup></span>
        </div>

    </header>

    <!-- ══ MAIN ══ -->
    <main id="main">

        <div id="terminalPanel">

            <div id="terminal"></div>
        </div>

        <div id="divider" title="Drag to resize"></div>

        <div id="right">

            <div id="chartWrap">
                <div class="grid-overlay"></div>
                <canvas id="priceChart"></canvas>
            </div>
        </div>

    </main>

    <!-- ══ BOTTOM BAR ══ -->
    <footer id="bottomBar">
        <span class="bottom-label">Momentum</span>
        <div id="topCandleWrap">
            <canvas id="topCandle"></canvas>
        </div>
        <span class="time-display" id="clockDisplay">—</span>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
'use strict';

/* ══════════════════════════════════════
   UTILITIES
══════════════════════════════════════ */
const $ = id => document.getElementById(id);
function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
const isMobile = () => window.innerWidth <= 640;
const isTV     = () => window.innerWidth >= 1920;

/* ══════════════════════════════════════
   THEME
══════════════════════════════════════ */
const html         = document.documentElement;
const themeToggle  = $('themeToggle');
const themeColorMeta = $('themeColorMeta');
let isDark = true;

const darkTermTheme = {
    background:'#06080d', foreground:'#8899bb', cursor:'#3b82f6',
    green:'#22c55e', red:'#ef4444', yellow:'#f59e0b',
    cyan:'#22d3ee', blue:'#3b82f6',
    brightBlack:'#374151', brightWhite:'#e8ecf4'
};
const lightTermTheme = {
    background:'#f8fafc', foreground:'#334155', cursor:'#2563eb',
    green:'#16a34a', red:'#dc2626', yellow:'#d97706',
    cyan:'#0891b2', blue:'#2563eb',
    brightBlack:'#cbd5e1', brightWhite:'#0f172a'
};

function applyTheme(dark) {
    isDark = dark;
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeColorMeta.setAttribute('content', dark ? '#06080d' : '#f1f5fb');
    if (term) term.options.theme = dark ? darkTermTheme : lightTermTheme;
    if (lastSt && lastCloses) drawMomentumBar(lastSt, lastCloses);
    if (chart) {
        chart.options.plugins.tooltip.backgroundColor = cssVar('--bg2');
        chart.options.plugins.tooltip.bodyColor       = cssVar('--text');
        chart.options.scales.y.grid.color             = cssVar('--chart-grid');
        chart.options.scales.y.ticks.color            = cssVar('--chart-tick');
        chart.update('none');
    }
}

themeToggle.addEventListener('click', e => {
    e.stopPropagation();
    applyTheme(!isDark);
});

/* ══════════════════════════════════════
   MENU
══════════════════════════════════════ */
const menu    = $('menu');
const menuBtn = $('menuBtn');
menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    menu.classList.toggle('open');
});
document.addEventListener('click',       () => menu.classList.remove('open'));
document.addEventListener('touchstart',  () => menu.classList.remove('open'), { passive: true });

/* ══════════════════════════════════════
   TERMINAL
══════════════════════════════════════ */
const term = new Terminal({
    convertEol:  true,
    scrollback:  1000,
    fontFamily:  "'DM Mono', monospace",
    fontSize:    isMobile() ? 14 : isTV() ? 16 : 12,
    lineHeight:  1.5,
    cursorBlink: false,
    theme:       darkTermTheme
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open($('terminal'));
setTimeout(() => fitAddon.fit(), 80);

const ws = new WebSocket(`ws://${location.host}`);
ws.onmessage = e => term.write(e.data);

/* ══════════════════════════════════════
   DRAG DIVIDER (desktop only)
══════════════════════════════════════ */
const divider    = $('divider');
const termPanel  = $('terminalPanel');
let isDragging   = false;

function startDrag(clientX) {
    if (isMobile()) return;
    isDragging = true;
}
function doDrag(clientX) {
    if (!isDragging || isMobile()) return;
    const pct = (clientX / window.innerWidth) * 100;
    if (pct < 15 || pct > 70) return;
    termPanel.style.width = pct + '%';
    setTimeout(() => fitAddon.fit(), 10);
}
function endDrag() { isDragging = false; }

divider.addEventListener('mousedown',  e => startDrag(e.clientX));
window.addEventListener('mousemove',   e => doDrag(e.clientX));
window.addEventListener('mouseup',     endDrag);
divider.addEventListener('touchstart', e => startDrag(e.touches[0].clientX), { passive: true });
window.addEventListener('touchmove',   e => doDrag(e.touches[0].clientX),    { passive: true });
window.addEventListener('touchend',    endDrag);

/* resize: re-fit terminal and redraw candle */
const ro = new ResizeObserver(() => {
    fitAddon.fit();
    if (lastSt && lastCloses) drawMomentumBar(lastSt, lastCloses);
});
ro.observe($('terminal'));
ro.observe($('topCandleWrap'));

/* ══════════════════════════════════════
   CLOCK
══════════════════════════════════════ */
function tick() {
    $('clockDisplay').textContent =
        new Date().toLocaleTimeString('en-IN', { hour12: false });
}
tick(); setInterval(tick, 1000);

/* ══════════════════════════════════════
   DATA
══════════════════════════════════════ */
let chart, lastSt = null, lastCloses = null;

async function load() {
    let data;
    try {
        const res = await fetch('./syschrtpxy.json');
        data = await res.json();
    } catch {
        data = generateDemoData();
    }
    const closes = data.map(d => d.close);
    const st     = data.map(d => d.st);
    const trend  = data.map(d => d.st_trend);
    lastSt = st; lastCloses = closes;
    draw(closes, st, trend);
    drawMomentumBar(st, closes);
}

function generateDemoData() {
    let price = 2450, st = 2430;
    return Array.from({ length: 80 }, () => {
        price += (Math.random() - 0.48) * 12;
        st    += (Math.random() - 0.49) * 6;
        return { close: price, st, st_trend: price > st ? 1 : -1 };
    });
}

function updateHeader(closes, st, trend) {
    const last = closes.at(-1), prev = closes.at(-2) ?? last;
    $('priceDisplay').textContent =
        last.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pct = (last - prev) / prev * 100;
    const el  = $('priceChange');
    el.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    el.className   = 'price-change ' + (pct >= 0 ? 'bull' : 'bear');
    const isBull = last >= prev;
    $('topHeader').style.boxShadow = isBull
        ? '0 1px 0 rgba(34,197,94,0.28)'
        : '0 1px 0 rgba(239,68,68,0.28)';
}

/* ══════════════════════════════════════
   CHART
══════════════════════════════════════ */
function draw(closes, st) {
    const MAX = 60, pad = 4;
    const c = closes.slice(-MAX), s = st.slice(-MAX);
    const labels   = [...c.map((_,i) => i), ...Array(pad).fill('')];
    const closePad = [...c, ...Array(pad).fill(null)];
    const stPad    = [...s, ...Array(pad).fill(null)];
    const isBull   = c.at(-1) >= (c.at(-2) ?? c.at(-1));
    const lineColor = isBull ? cssVar('--bull') : cssVar('--bear');
    const fillTop   = isBull ? 'rgba(34,197,94,0.12)' : 'rgba(239,68,68,0.12)';

    if (!chart) {
        chart = new Chart($('priceChart'), {
            type: 'line',
            data: {
                labels,
                datasets: [
                    {
                        data: closePad,
                        borderColor: lineColor,
                        borderWidth: isTV() ? 3 : 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: ctx => {
                            const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, ctx.chart.height);
                            g.addColorStop(0, fillTop);
                            g.addColorStop(1, 'rgba(0,0,0,0)');
                            return g;
                        },
                        tension: 0.35
                    },
                    {
                        data: stPad,
                        borderWidth: isTV() ? 2 : 1.5,
                        pointRadius: 0,
                        borderColor: 'rgba(59,130,246,0.6)',
                        borderDash: [4, 4],
                        fill: false,
                        tension: 0.3
                    }
                ]
            },
            options: {
                animation: false,
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: cssVar('--bg2'),
                        borderColor:     cssVar('--border2'),
                        borderWidth: 1,
                        titleColor: cssVar('--muted'),
                        bodyColor:  cssVar('--text'),
                        padding: isTV() ? 14 : 10,
                        titleFont: { family: "'DM Mono', monospace", size: isTV() ? 12 : 10 },
                        bodyFont:  { family: "'DM Mono', monospace", size: isTV() ? 14 : 12 },
                        callbacks: {
                            label: ctx => {
                                const name = ctx.datasetIndex === 0 ? 'Close' : 'ST';
                                return `  ${name}: ${ctx.parsed.y?.toFixed(2) ?? '—'}`;
                            }
                        }
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        display: true,
                        position: 'right',
                        grid: { color: cssVar('--chart-grid'), drawBorder: false },
                        ticks: {
                            color: cssVar('--chart-tick'),
                            font: { family: "'DM Mono', monospace", size: isTV() ? 13 : 10 },
                            maxTicksLimit: isMobile() ? 4 : 6
                        }
                    }
                }
            }
        });
    } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data        = closePad;
        chart.data.datasets[0].borderColor = lineColor;
        chart.data.datasets[1].data        = stPad;
        chart.options.plugins.tooltip.backgroundColor = cssVar('--bg2');
        chart.options.plugins.tooltip.bodyColor       = cssVar('--text');
        chart.options.scales.y.grid.color             = cssVar('--chart-grid');
        chart.options.scales.y.ticks.color            = cssVar('--chart-tick');
        chart.update('none');
    }
}

/* ══════════════════════════════════════
   MOMENTUM CANDLE BAR
══════════════════════════════════════ */
function drawMomentumBar(stVals, closes) {
    const canvas = $('topCandle');
    const ctx    = canvas.getContext('2d');
    const dpr    = window.devicePixelRatio || 1;
    const rect   = canvas.parentElement.getBoundingClientRect();

    canvas.width  = rect.width  * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width  = rect.width  + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.scale(dpr, dpr);

    const W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);
    if (W < 10 || H < 6) return;

    const PADX = 8;
    const midY = H / 2;
    const bodyH = Math.max(10, H * 0.45);

    const recent = 60;
    const rc = closes.slice(-recent), rs = stVals.slice(-recent);
    const all = [...rc, ...rs];
    const high = Math.max(...all), low = Math.min(...all);
    const range = high - low || 1;
    const toX = v => ((v - low) / range) * (W - PADX * 2) + PADX;

    const open  = stVals.at(-1);
    const close = closes.at(-1);
    const wHigh = Math.max(...rc.slice(-8), ...rs.slice(-8));
    const wLow  = Math.min(...rc.slice(-8), ...rs.slice(-8));
    const isBull = close >= open;

    const bodyColor = isBull ? cssVar('--bull') : cssVar('--bear');
    const glowColor = isBull ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)';
    const mutedColor = cssVar('--muted');

    // track
    const tg = ctx.createLinearGradient(0, 0, W, 0);
    tg.addColorStop(0,   'rgba(0,0,0,0)');
    tg.addColorStop(0.08, cssVar('--track-mid'));
    tg.addColorStop(0.92, cssVar('--track-mid'));
    tg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.strokeStyle = tg; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PADX, midY); ctx.lineTo(W - PADX, midY); ctx.stroke();

    // wick
    const wx1 = toX(wLow), wx2 = toX(wHigh);
    ctx.strokeStyle = bodyColor; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.moveTo(wx1, midY); ctx.lineTo(wx2, midY); ctx.stroke();
    ctx.globalAlpha = 1;

    // wick caps
    const capH = Math.max(6, H * 0.28);
    [wx1, wx2].forEach(x => {
        ctx.beginPath(); ctx.moveTo(x, midY - capH/2); ctx.lineTo(x, midY + capH/2); ctx.stroke();
    });

    // body
    const bx1 = toX(Math.min(open, close));
    const bx2 = toX(Math.max(open, close));
    const bW  = Math.max(bx2 - bx1, 5);

    ctx.shadowColor = glowColor; ctx.shadowBlur = 12;
    ctx.fillStyle   = bodyColor;
    ctx.beginPath();
    ctx.roundRect(bx1, midY - bodyH/2, bW, bodyH, 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.roundRect(bx1 + 2, midY - bodyH/2 + 2, Math.max(bW - 4, 2), Math.max(bodyH*0.3, 3), 2);
    ctx.fill();
}

/* ══════════════════════════════════════
   PNL — updates header only
══════════════════════════════════════ */
async function loadPnl() {
    let trades = [];
    try {
        const res = await fetch('./pnl.json?_=' + Date.now());
        trades = await res.json();
    } catch { trades = []; }

    const total  = trades.reduce((s, t) => s + (t.PNL || 0), 0);
    const isBull = total >= 0;

    $('priceDisplay').textContent = (isBull ? '+' : '') + total.toLocaleString('en-IN');
    $('priceDisplay').style.color = isBull ? cssVar('--bull') : cssVar('--bear');
    $('priceChange').style.display = 'none';
    $('topHeader').style.boxShadow = isBull
        ? '0 1px 0 rgba(34,197,94,0.28)'
        : '0 1px 0 rgba(239,68,68,0.28)';
}

/* ══════════════════════════════════════
   NAV LINKS  (urls to be filled later)
══════════════════════════════════════ */
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') menu.classList.remove('open');
});

/* ══════════════════════════════════════
   START

load();
loadPnl();
setInterval(load,    3000);
setInterval(loadPnl, 5000);
</script>
