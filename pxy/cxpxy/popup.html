<!DOCTYPE html>
<html>
<head>
  <title>PXY</title>
  <style>
    body {
      margin: 0;
      width: 380px;
      height: 600px;
      font-family: Arial;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #fallback {
      display: none;
      text-align: center;
      padding-top: 200px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<iframe id="frame" src="http://20.219.25.209/cxpxy.html"></iframe>

<div id="fallback">
  <p>Popup blocked by site security</p>
  <button onclick="openTab()">Open Dashboard</button>
</div>

<script>
  const iframe = document.getElementById("frame");

  setTimeout(() => {
    try {
      iframe.contentWindow.location.href;
    } catch (e) {
      iframe.style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  }, 1500);

  function openTab() {
    chrome.tabs.create({
      url: "http://20.219.25.209/cxpxy.html"
    });
  }
</script>

</body>
</html>
